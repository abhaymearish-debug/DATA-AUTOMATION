# Render blueprint for the KSD Report Transformer.
#
# Starter instance with a persistent disk. The disk is the point: the workbooks
# ARE the data - a month's earlier days exist only inside them - so the
# workspace lives on /data, which survives restarts, deploys and code changes.
# Without it every deploy starts empty, which is what the free plan does.
#
# Cost: ~$7/month for the instance, ~$0.25/GB/month for the disk.
services:
  - type: web
    name: ksd-report-transformer
    runtime: docker
    plan: starter
    region: singapore        # nearest to Kerala of Render's regions
    healthCheckPath: /login
    disk:
      name: ksd-data
      mountPath: /data       # matches KSD_WORKSPACE_ROOT below
      sizeGB: 5
    envVars:
      - key: KSD_WORKSPACE_ROOT
        value: /data/workspace  # on the disk, so uploads outlive the container
      - key: KSD_SESSION_SECRET
        generateValue: true  # Render makes one and keeps it; never in the repo
      - key: KSD_ALLOWED_EMAILS
        value: abhaymearish@gmail.com
      - key: KSD_COOKIE_SECURE
        value: "1"           # Render serves HTTPS, so the cookie can insist on it
      - key: PYTHONUNBUFFERED
        value: "1"
