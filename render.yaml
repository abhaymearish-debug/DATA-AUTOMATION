# Render blueprint for the KSD Report Transformer.
#
# CURRENTLY ON THE FREE PLAN, WHICH HAS NO DISK.
#
# That matters more here than in most apps: the workbooks ARE the data, and on
# free the whole workspace lives inside the container. Every deploy, restart or
# wake-from-sleep starts it empty, so raws have to be uploaded again. Free
# instances also sleep after 15 minutes idle and take about a minute to wake.
#
# To make it permanent later, change three things and push:
#   plan: free      -> plan: starter
#   KSD_WORKSPACE_ROOT: /srv/workspace -> /data/workspace
#   and uncomment the disk block below.
services:
  - type: web
    name: ksd-report-transformer
    runtime: docker
    plan: free
    region: singapore        # nearest to Kerala of Render's regions
    healthCheckPath: /login
    # disk:                  # <- uncomment together with plan: starter
    #   name: ksd-data
    #   mountPath: /data
    #   sizeGB: 5
    envVars:
      - key: KSD_WORKSPACE_ROOT
        value: /srv/workspace   # inside the container: wiped on every restart
      - key: KSD_SESSION_SECRET
        generateValue: true  # Render makes one and keeps it; never in the repo
      - key: KSD_ALLOWED_EMAILS
        value: abhaymearish@gmail.com
      - key: KSD_COOKIE_SECURE
        value: "1"           # Render serves HTTPS, so the cookie can insist on it
      - key: PYTHONUNBUFFERED
        value: "1"
