{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block heading %}{{ title }}{% endblock %}

{% block head %}
{% include '_calendar.html' %}
<style>
  .controls { position:sticky; top:0; z-index:30; background:var(--bg); padding:2px 0 14px; }
  .bar1 { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .bar1 .sp { margin-left:auto; display:flex; gap:8px; align-items:center; }

  .fbar { display:inline-flex; align-items:stretch; background:var(--card);
          border:1px solid var(--line); border-radius:12px; padding:3px;
          box-shadow:0 1px 2px rgba(16,24,40,.04); }
  .fitem { display:flex; flex-direction:column; justify-content:center; gap:1px;
           padding:7px 15px; border-radius:9px; }
  .fitem:hover { background:var(--hover); }
  .fitem:focus-within { background:var(--hover); box-shadow:inset 0 0 0 1px #C7D2FE; }
  .fi-k { font-size:9.5px; letter-spacing:.7px; text-transform:uppercase;
          color:var(--muted); font-weight:700; }
  .fdiv { width:1px; background:var(--line); margin:8px 0; }
  .fi-v { display:flex; align-items:center; gap:7px; border:0; background:none; padding:0;
          font:inherit; font-size:13.5px; font-weight:650; color:var(--ink); cursor:pointer;
          text-align:left; }
  .fi-v i { font-style:normal; font-size:9px; color:var(--muted); }
  .fitem input[type=date], .fitem select {
      appearance:none; -webkit-appearance:none; border:0; background:none; font:inherit;
      font-size:13.5px; font-weight:650; color:var(--ink); padding:0; cursor:pointer; }
  .fitem input[type=date]:focus, .fitem select:focus { outline:none; }


  /* A height, or the box never scrolls: overflow:auto with nothing to overflow
     is not a scrollport, and the sticky header inside it has nothing to stick
     to - it just rode up the page and out of sight, leaving eighteen columns
     of figures with no names on them. --stick is the filter strip above, so
     the table always ends where the window does. */
  .wrap { background:var(--card); border:1px solid var(--line); border-radius:12px;
          overflow:auto;
          /* A first-paint value; ksdFit measures the real room and takes
             over, because what sits under the table - a Source chip, a
             footnote of one line or three - is not the same on every
             report or in every state. */
          max-height:max(160px, calc(100vh - var(--stick) - 190px)); }
  table { border-collapse:separate; border-spacing:0; width:100%; font-size:13px; }

  thead th { position:sticky; top:0; z-index:3; background:var(--navy); color:var(--gold);
             font-weight:700; font-size:10.5px; letter-spacing:.4px; text-transform:uppercase;
             padding:8px 6px; text-align:center; white-space:nowrap;
             border-bottom:1px solid #22407F; }
  thead th .d { display:block; font-size:12px; margin-top:2px; color:#FFD98A; }
  thead th + th { border-left:1px solid rgba(255,255,255,.12); }
  thead th:first-child { left:0; z-index:4; text-align:left; padding-left:15px; min-width:168px;
                         box-shadow:7px 0 9px -7px rgba(0,0,0,.45); }
  thead th:last-child { right:0; z-index:4; box-shadow:-7px 0 9px -7px rgba(0,0,0,.45); }

  /* Ruled both ways, the way the other reports read, and the name column
     casts an edge so a half-scrolled day passes under it rather than
     printing its digits down the middle. */
  tbody td { padding:0 8px; height:34px; text-align:center; white-space:nowrap;
             font-variant-numeric:tabular-nums; border-bottom:1px solid var(--line);
             border-left:1px solid var(--line); }
  tbody td:first-child { position:sticky; left:0; z-index:2; text-align:left;
                         padding-left:15px; font-weight:600; border-left:0;
                         border-right:1px solid var(--line);
                         box-shadow:7px 0 9px -7px rgba(16,24,40,.28); }
  tbody td:last-child { position:sticky; right:0; z-index:2; font-weight:700;
                        box-shadow:-7px 0 9px -7px rgba(16,24,40,.28); }

  tr.bond td { background:var(--card); }
  tr.bond.alt td { background:var(--row); }
  tr.bond:hover td { background:var(--hover); }
  td.z { color:var(--zero); }

  tr.cluster td { background:var(--navy); color:var(--gold); font-weight:700;
                  border-bottom:1px solid #22407F; border-left-color:#22407F; }
  tr.cluster td.z { color:#7C89A6; }
  tr.grand td { background:var(--gold); color:#1B2A4A; font-weight:700;
                border-left-color:rgba(27,42,74,.22); }
  tr.grand td.z { color:#9A8340; }

  /* A day nobody has uploaded yet still gets its column - it just says so,
     rather than passing a zero off as a day that traded nothing. */
  .seg { display:inline-flex; background:var(--row); border-radius:9px; padding:2px; gap:2px; }
  .seg button { border:0; background:none; font:inherit; font-size:12.5px; font-weight:650;
                color:var(--muted); padding:5px 12px; border-radius:7px; cursor:pointer; }
  .seg button.on { background:var(--card); color:var(--ink);
                   box-shadow:0 1px 2px rgba(16,24,40,.12); }

  thead th.nc { color:#8FA0C4; }
  thead th.nc .d { color:#8FA0C4; }
  tbody td.nc { background:#F7F8FB; color:#C2C9D6; }
  tr.cluster td.nc { background:#16305F; color:#7C89A6; }
  tr.grand td.nc { background:#F0D08A; color:#9A8340; }

  .status { font-size:12.5px; color:var(--muted); margin:14px 2px 0; }

  @media (max-width:760px){
    .bar1 .sp { margin-left:0; width:100%; }
    .fbar { width:100%; flex-wrap:wrap; }
    .fitem { flex:1 1 44%; padding:7px 11px; }
    .fdiv { display:none; }
    thead th:first-child, tbody td:first-child { min-width:130px; }
  }
</style>
{% endblock %}

{% block content %}
<div class="controls">
  <div class="bar1">
    <div class="fbar">
      <div class="fitem" id="calWrap" style="position:relative">
        <span class="fi-k">Period</span>
        <button type="button" class="fi-v" onclick="Cal.open(event)">
          <span id="calLabel">Pick a period</span><i>&#9662;</i></button>
        <div class="calpop" id="calPop"></div>
      </div>
      <span class="fdiv"></span>
      <div class="fitem">
        <span class="fi-k">Group by</span>
        <div class="seg" id="seg">
          <button type="button" class="on" data-view="bond" onclick="setView('bond')">Bond</button>
          <button type="button" data-view="warehouse" onclick="setView('warehouse')">Warehouse</button>
        </div>
      </div>
      <span class="fdiv"></span>
      <div class="fitem"><span class="fi-k">Cluster</span>
        <select id="fCluster">
          <option value="">All clusters</option>
          <option value="1">Cluster 1</option>
          <option value="2">Cluster 2</option>
          <option value="3">Cluster 3</option>
        </select>
      </div>
    </div>
    <label class="chk"><input type="checkbox" id="round" checked onchange="load()"><span class="sw"></span><span class="t">Round off</span></label>
    <div class="sp">
      <button class="btn xl" onclick="dl('xlsx')">Download Excel</button>
      <button class="btn pdf" onclick="dl('pdf')">Download PDF</button>
    </div>
  </div>
</div>

<div id="msg"></div>
<div class="wrap"><table id="grid">
  <thead><tr><th>Bond</th></tr></thead>
  <tbody><tr><td>Loading…</td></tr></tbody>
</table></div>
<div class="status srcline" id="srcLine" hidden></div>
<div class="status" id="foot"></div>
{% endblock %}

{% block scripts %}
<script>
const KIND = "{{ kind }}";
let filled = false;
let FROM = '', TO = '';
// Bond is our mapping of the shops; warehouse is the depot KSBC shipped from.
// Same lines, same grand total, cut two ways.
let view = 'bond';

function setView(v){
  if (view === v) return;
  view = v;
  seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  load();
}

const n = v => ksdCases(v, round.checked);
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }
function params(){
  const p = new URLSearchParams();
  if (FROM) p.set('date_from', FROM);
  if (TO)   p.set('date_to', TO);
  if (fCluster.value) p.set('cluster', fCluster.value);
  if (view !== 'bond') p.set('view', view);
  p.set('round_off', round.checked ? '1' : '0');
  return p;
}
let SPAN = {min:'', max:''};

async function load(){
  foot.textContent = 'Loading…';
  let d;
  try { d = await (await ksdFetch(`/api/reports/daily/${KIND}?` + params())).json(); }
  catch { msg.innerHTML = '<div class="banner">Could not reach the server.</div>'; return; }

  if (d.error){
    msg.innerHTML = `<div class="banner">${escapeHtml(d.error)}</div>`;
    grid.querySelector('tbody').innerHTML = '<tr><td>No data</td></tr>';
    foot.textContent = ''; srcLine.hidden = true; return;
  }
  msg.innerHTML = '';
  SPAN = d.span;
  if (!filled){ FROM = d.period.from; TO = d.period.to; filled = true; }
  // The dots mark the days an upload stands behind; every day stays clickable.
  Cal.setData(d.have || [], []);
  Cal.init(FROM, TO, onPick);
  render(d);
}

function render(d){
  const bonds = d.rows.filter(r => r.kind === 'bond');
  // Which columns have a raw behind them. The rest are shown, and marked.
  const covered = new Set(d.covered || []);
  const nc = d.days.map(x => !covered.has(x.iso));

  grid.querySelector('thead').innerHTML =
    `<tr><th>${escapeHtml(d.group_label || 'Bond')}</th>` +
    d.days.map((x, i) => `<th class="${nc[i] ? 'nc' : ''}" title="${nc[i] ? 'No raw uploaded for this day' : ''}">` +
                         `${x.dow}<span class="d">${x.dom}</span></th>`).join('') +
    '<th>Total</th></tr>';

  let alt = 0;
  grid.querySelector('tbody').innerHTML = d.rows.map(r => {
    let cls = r.kind;
    if (r.kind === 'bond'){ cls += (alt++ % 2 ? ' alt' : ''); } else { alt = 0; }
    const cells = r.cells.map((v, i) =>
      `<td class="${v ? '' : 'z'}${nc[i] ? ' nc' : ''}">${n(v)}</td>`).join('');
    return `<tr class="${cls}"><td>${escapeHtml(r.label)}</td>${cells}` +
           `<td class="${r.total ? '' : 'z'}">${n(r.total)}</td></tr>`;
  }).join('');

  const missing = d.days.filter((x, i) => nc[i]).map(x => x.dom);
  // The count, the period and the source file are all already on the page, so
  // the line only speaks when it has something the table cannot say itself.
  const notes = [];
  if (missing.length)
    notes.push(`No raw uploaded for ${missing.join(', ')} — shown as zero.`);
  if (d.unmapped.length)
    notes.push(`${d.unmapped.length} outlet(s) with no bond in master data.`);
  foot.textContent = notes.join(' ');
  // Which files answered the days on screen, folded into one chip.
  ksdSource(d.source_block);
}

function grab(url){ const a=document.createElement('a'); a.href=url;
                    document.body.appendChild(a); a.click(); a.remove(); }

// Always exactly what is on screen — the cluster filter above already decides
// how much that is, so a scope menu would only ask the same question twice.
function dl(fmt){ grab(`/reports/daily/${KIND}/export.${fmt}?` + params()); }

function onPick(from, to){ FROM = from; TO = to; load(); }

fCluster.addEventListener('change', load);
// Draw the picker before any data arrives, so a failed load still leaves a
// working way to ask for a different window.
Cal.init(FROM, TO, onPick);
load();
</script>
{% endblock %}
