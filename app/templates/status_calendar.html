{% extends "base.html" %}
{% block title %}Status Calendar{% endblock %}
{% block heading %}Status Calendar{% endblock %}

{% block head %}
<style>
  /* ==================================================================
     One question, asked of a month: can the reports speak for this day?

     The screen used to answer it twice. A matrix of streams against days
     sat above a calendar of days against streams - the same numbers, laid
     out two ways, one above the other, and the tiles underneath had to be
     read against the matrix to mean anything. Two charts, one fact.

     It is one board now. Each day's tile IS the column that was in the
     matrix: five bars, one per stream, standing up. A bar that is filled
     is a file that is in. A bar that is an empty outline is a file that is
     missing. A stub along the bottom is a file that is not due yet. Ink
     against no ink - the one distinction the eye settles without being
     taught, and the one that cannot argue with the stream colours, because
     it is not a colour.

     Losing the matrix gave the tiles its height, so the bars are tall
     enough to read a whole month's shape at a glance: where the skyline
     drops, a file is missing.
  ================================================================== */
  .content { padding-bottom:20px; }

  .board { background:var(--card); border:1px solid var(--line); border-radius:20px;
           overflow:hidden; display:flex; flex-direction:column;
           box-shadow:0 1px 2px rgba(16,24,40,.05),
                      0 18px 40px -28px rgba(16,24,40,.40); }

  /* ---------- the head ---------- */
  .head { display:flex; align-items:center; gap:18px; flex-wrap:wrap;
          padding:15px 20px 14px; }
  .mnav { display:inline-flex; align-items:center; gap:2px; flex:none;
          background:var(--row); border:1px solid var(--line); border-radius:11px;
          padding:3px; }
  .mnav button { border:0; background:none; border-radius:8px; width:26px; height:26px;
                 cursor:pointer; color:var(--muted); font-size:14px; line-height:1; padding:0;
                 transition:background .15s ease, color .15s ease; }
  .mnav button:hover { background:var(--card); color:var(--ink);
                       box-shadow:0 1px 2px rgba(16,24,40,.08); }
  .mnav .m { font-size:13.5px; font-weight:750; letter-spacing:-.25px;
             min-width:134px; text-align:center; color:var(--ink); }

  .sum { flex:1 1 auto; display:flex; align-items:baseline; gap:11px;
         flex-wrap:wrap; min-width:0; }
  .sum .v { font-size:34px; font-weight:800; letter-spacing:-1.6px; line-height:1;
            color:var(--ink); font-variant-numeric:tabular-nums; }
  .sum .v i { font-style:normal; font-size:17px; font-weight:700; color:var(--muted);
              letter-spacing:-.4px; }
  .sum .lbl { font-size:13px; font-weight:650; color:var(--muted); letter-spacing:-.15px; }
  .sum .pills { margin-left:auto; display:flex; gap:7px; flex-wrap:wrap; }
  .sum .pill { display:inline-flex; align-items:center; gap:6px;
               border:1px solid var(--line); border-radius:999px;
               padding:4.5px 11px 4.5px 9px; font-size:11.5px; font-weight:650;
               color:var(--muted); background:var(--card); white-space:nowrap; }
  .sum .pill b { color:var(--ink); font-weight:750; font-variant-numeric:tabular-nums; }
  .sum .pill i { width:7px; height:7px; border-radius:50%; flex:none; }
  .sum .pill.f i { background:var(--ok); }
  .sum .pill.p i { background:none; box-shadow:inset 0 0 0 1.6px var(--gold); }
  .sum .pill.e i { background:none;
                   box-shadow:inset 0 0 0 1.6px color-mix(in srgb, var(--bad) 55%,
                              transparent); }

  /* ---------- the key ----------
     Not a chart. One line that names the five streams in the order their
     bars stand in, and says how each one did this month. It is the legend
     and the scorecard in the space a legend alone used to take. */
  .key { display:flex; flex-wrap:wrap; justify-content:space-between; gap:9px 16px;
         padding:11px 20px 12px; border-top:1px solid var(--line);
         background:linear-gradient(180deg,
                    color-mix(in srgb, var(--blue) 3.5%, var(--card)), var(--card)); }
  .kk { display:inline-flex; align-items:center; gap:8px; min-width:0;
        font-size:11.5px; font-weight:650; color:var(--muted); letter-spacing:-.1px;
        white-space:nowrap; }
  .kk i { flex:none; width:10px; height:10px; border-radius:3.5px; background:var(--c);
          box-shadow:0 0 0 2.5px color-mix(in srgb, var(--c) 13%, transparent); }
  .kk em { font-style:normal; color:var(--ink); font-weight:700; }
  .kk b { font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums;
          margin-left:1px; }
  .kk .of { opacity:.62; font-weight:700; font-variant-numeric:tabular-nums; }
  /* A stream with everything in says so in green; one with nothing left to
     want says nothing at all. */
  .kk.done b, .kk.done .of { color:var(--ok); opacity:1; }

  /* ---------- the month ---------- */
  .cal { position:relative; padding:13px 16px 16px; border-top:1px solid var(--line); }
  .dows, .grid { display:grid; grid-template-columns:repeat(7,1fr); column-gap:10px; }
  .dows { padding-bottom:9px; }
  .dows span { text-align:center; font-size:9px; font-weight:800; letter-spacing:1.3px;
               text-transform:uppercase; color:var(--muted); opacity:.55; }
  .grid { row-gap:var(--gap, 10px); }

  .cell { min-height:var(--tile, 92px); min-width:0; display:flex; flex-direction:column;
          border:1px solid var(--line); border-radius:14px; padding:9px 11px 11px;
          background:var(--card); cursor:pointer; position:relative;
          transition:box-shadow .2s ease, border-color .2s ease,
                     transform .2s cubic-bezier(.2,.7,.3,1); }
  .cell:not(.pad):hover { border-color:color-mix(in srgb, var(--blue) 40%, var(--line));
          box-shadow:0 12px 28px -12px rgba(16,24,40,.28); transform:translateY(-2px);
          z-index:2; }
  .cell.on { border-color:var(--blue); z-index:3;
             box-shadow:0 0 0 3px color-mix(in srgb, var(--blue) 14%, transparent),
                        0 12px 28px -12px rgba(16,24,40,.28); }
  .cell.pad { border:0; background:none; min-height:0; cursor:default; }

  .cell .n { display:flex; align-items:center; gap:6px; min-height:19px;
             font-size:15px; font-weight:700; color:var(--ink);
             letter-spacing:-.4px; font-variant-numeric:tabular-nums; }
  .cell .n em { font-style:normal; font-size:8px; font-weight:800; letter-spacing:.8px;
                text-transform:uppercase; color:var(--gold); }
  .cell .n .tick { margin-left:auto; color:var(--ok); font-size:12.5px; }
  /* How many bars are empty, so nobody has to count them. It carries one of
     those empty bars with it, so the number needs no caption to say which
     way round it counts. This is the only red on the tile. */
  .cell .n .gap { margin-left:auto; flex:none; display:inline-flex; align-items:center;
                  gap:4px; font-size:10.5px; font-weight:800; line-height:1.5;
                  letter-spacing:-.2px; padding:0 6px 0 5px; border-radius:999px;
                  color:var(--bad);
                  background:color-mix(in srgb, var(--bad) 11%, transparent);
                  box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--bad) 24%,
                             transparent);
                  font-variant-numeric:tabular-nums; }
  .cell .n .gap i { width:7px; height:9px; border-radius:2.5px; flex:none;
                    box-shadow:inset 0 0 0 1.4px color-mix(in srgb, var(--bad) 58%,
                               transparent); }

  /* ---------- the five bars ---------- */
  .bars { display:flex; align-items:stretch; gap:5px; flex:1 1 auto; min-height:16px;
          margin-top:8px; }
  .bars b { flex:1; min-width:0; border-radius:5px;
            background:linear-gradient(175deg,
                       color-mix(in srgb, var(--c) 92%, #fff),
                       var(--c) 46%,
                       color-mix(in srgb, var(--c) 90%, #0B1020));
            transform-origin:bottom;
            animation:ksd-grow .36s cubic-bezier(.2,.8,.3,1) var(--in, 0ms) both; }
  /* The month draws itself, one day after another, left to right. It takes a
     third of a second and it is the difference between a chart appearing and
     a chart arriving. */
  @keyframes ksd-grow { from { transform:scaleY(.14); opacity:0; } }
  @media (prefers-reduced-motion: reduce){
    .bars b { animation:none; }
  }
  /* Missing: the bar is still there, and it is empty. */
  .bars b.off { background:color-mix(in srgb, var(--bad) 5%, transparent);
                box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--bad) 32%,
                           var(--line)); }
  /* Not due: the slot has not opened yet. */
  .bars b.wait { align-self:flex-end; height:4px; border-radius:2px;
                 background:var(--line); }

  /* The verdict, carried by the tile rather than written on it. */
  .cell.full { border-color:color-mix(in srgb, var(--ok) 32%, var(--line));
               background:linear-gradient(180deg,
                          color-mix(in srgb, var(--ok) 6%, var(--card)), var(--card)); }
  .cell.none { border-color:color-mix(in srgb, var(--bad) 22%, var(--line));
               background:linear-gradient(180deg,
                          color-mix(in srgb, var(--bad) 4%, var(--card)), var(--card)); }
  .cell.future { border-style:dashed; background:none; cursor:default; }
  .cell.future .n { color:var(--muted); font-weight:650; }
  .cell.future:hover { transform:none; box-shadow:none; border-color:var(--line); }
  .cell.today { border-color:var(--gold);
                box-shadow:0 0 0 3px color-mix(in srgb, var(--gold) 20%, transparent); }
  .cell.today .n { color:var(--gold); }

  /* Navy swallows a four-per-cent wash. Dark gets its own weights. */
  :root[data-theme="dark"] .cell.none {
      border-color:color-mix(in srgb, var(--bad) 34%, var(--line));
      background:linear-gradient(180deg,
                 color-mix(in srgb, var(--bad) 10%, var(--card)), var(--card)); }
  :root[data-theme="dark"] .cell.full {
      border-color:color-mix(in srgb, var(--ok) 38%, var(--line)); }
  :root[data-theme="dark"] .bars b.off {
      background:color-mix(in srgb, var(--bad) 7%, transparent);
      box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--bad) 42%, var(--line)); }

  /* ---------- what a day still wants ----------
     The panel names the uploads that day is missing and hands you each one:
     the card on Raw Data Upload opens with the date already filled in,
     because the day you pressed IS the date. */
  .daypop { position:absolute; z-index:40; width:306px; display:none;
            background:var(--card); border:1px solid var(--line); border-radius:14px;
            box-shadow:0 14px 36px -10px rgba(16,24,40,.26),
                       0 2px 6px rgba(16,24,40,.06);
            overflow:hidden; }
  .daypop.on { display:block; animation:ksd-pop .14s cubic-bezier(.2,.7,.3,1) both; }
  .daypop .hd { position:relative; padding:10px 34px 8px 13px; font-size:9.5px;
                font-weight:800; letter-spacing:.9px; text-transform:uppercase;
                color:var(--muted); border-bottom:1px solid var(--line); }
  .daypop .hd b { display:block; font-size:13px; font-weight:750; letter-spacing:-.2px;
                  text-transform:none; color:var(--ink); margin-top:2px; }
  .daypop .x { position:absolute; top:8px; right:8px; width:22px; height:22px;
               border:0; background:none; border-radius:7px; cursor:pointer; padding:0;
               color:var(--muted); font-size:15px; line-height:1;
               transition:background-color .14s ease, color .14s ease; }
  .daypop .x:hover { background:var(--hover); color:var(--ink); }
  .daypop .bd { padding:5px; max-height:330px; overflow:auto; }
  .daypop .up, .daypop .st {
                display:flex; align-items:center; gap:9px; width:100%;
                border:0; background:none; font:inherit; text-align:left;
                padding:7px 9px; border-radius:9px;
                color:var(--ink); font-size:12.5px; font-weight:650; }
  .daypop .up { cursor:pointer; transition:background-color .14s ease; }
  .daypop .up:hover { background:var(--hover); }
  .daypop .up b, .daypop .st b { flex:1 1 auto; min-width:0; font-weight:650;
                  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .daypop b u { display:block; text-decoration:none; font-size:10px; font-weight:600;
                color:var(--muted); letter-spacing:-.1px; margin-top:1px; }
  .daypop .up i, .daypop .st i { width:8px; height:10px; border-radius:3px; flex:none;
                  background:var(--c); }
  .daypop .up i { background:none;
                  box-shadow:inset 0 0 0 1.7px color-mix(in srgb, var(--bad) 60%,
                             transparent); }
  .daypop .up span { margin-left:auto; flex:none; font-size:10.5px; font-weight:750;
                     color:var(--blue); opacity:.75; transition:opacity .14s ease; }
  .daypop .up:hover span { opacity:1; }
  .daypop .st.done span { margin-left:auto; flex:none; color:var(--ok);
                          font-size:12px; font-weight:800; }
  .daypop .st.wait { color:var(--muted); }
  .daypop .st.wait i { background:none;
                       box-shadow:inset 0 0 0 1.6px color-mix(in srgb, var(--line) 90%,
                                  transparent); }
  .daypop .st.wait span { margin-left:auto; flex:none; font-size:10px; font-weight:700;
                          color:var(--muted); letter-spacing:.2px; }

  /* ---------- a phone ----------
     Seven columns of about fifty pixels: room for the number and five bars,
     and not for their names. The key above still has those, and the panel
     has them per day. */
  @media (max-width:760px){
    .head { padding:12px 13px 11px; gap:11px; }
    .sum .v { font-size:27px; }
    .sum .pills { margin-left:0; flex:1 1 100%; }
    .key { padding:10px 13px 11px; gap:7px 12px; justify-content:flex-start; }
    .kk { font-size:10.5px; gap:6px; }
    .kk i { width:8px; height:8px; box-shadow:none; }
    .cal { padding:10px 9px 12px; }
    .dows, .grid { column-gap:5px; }
    .cell { padding:5px 5px 6px; border-radius:9px; }
    .cell .n { font-size:11px; gap:3px; min-height:14px; }
    .cell .n em { display:none; }
    .cell .n .tick { font-size:10px; }
    .cell .n .gap { font-size:8.5px; padding:0 3px; gap:2px; box-shadow:none; }
    .cell .n .gap i { width:5px; height:7px; }
    .bars { gap:2.5px; margin-top:4px; }
    .bars b { border-radius:3px; }
    .daypop { width:calc(100vw - 30px); max-width:306px; }
    .dows span { font-size:8.5px; letter-spacing:.4px; }
  }
</style>
{% endblock %}

{% block content %}
<div class="board" id="board">
  <div class="head">
    <div class="mnav">
      <button type="button" onclick="step(-1)" aria-label="Previous month">&lsaquo;</button>
      <span class="m" id="mLabel">—</span>
      <button type="button" onclick="step(1)" aria-label="Next month">&rsaquo;</button>
    </div>
    <div class="sum" id="lede"></div>
  </div>
  <div class="key" id="key"></div>
  <div class="cal" id="cal">
    <div class="dows"><span>S</span><span>M</span><span>T</span><span>W</span
      ><span>T</span><span>F</span><span>S</span></div>
    <div class="grid" id="grid"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
/* What this screen answers: for any given day, can the reports speak for it?
   A day is covered per stream, and the gaps are the point - but a day with
   four of five is normal, not a fault, so the tile shows the shape of what
   it has rather than shouting a count at you. */
const CAL = {{ calendar | tojson }};
const MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];
const MONTHS_S = ['Jan','Feb','Mar','Apr','May','Jun',
                  'Jul','Aug','Sep','Oct','Nov','Dec'];
const iso = (y,m,d) => `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const today = new Date().toISOString().slice(0,10);
// The day a stream's raw for `key` can first exist: same day for the stock
// photograph, the morning after for anything that reports a finished day.
const dueBy = (key, s) => {
  const n = Number(s.due_after || 0);
  if (!n) return key;
  const [y,m,d] = key.split('-').map(Number);
  return new Date(Date.UTC(y, m-1, d + n)).toISOString().slice(0,10);
};
const esc = s => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };
const saidDay = key => {
  const [y, m, d] = key.split('-').map(Number);
  return `${d} ${MONTHS_S[m - 1]} ${y}`;
};
// "1 - 16 Aug", not "1 Aug to 16 Aug" - the month is the same at both ends.
const spanOf = p => {
  const A = new Date(p.from + 'T00:00'), B = new Date(p.to + 'T00:00');
  const mon = d => MONTHS_S[d.getMonth()];
  return A.getMonth() === B.getMonth() && A.getFullYear() === B.getFullYear()
    ? `${A.getDate()}–${B.getDate()} ${mon(B)}`
    : `${A.getDate()} ${mon(A)} – ${B.getDate()} ${mon(B)}`;
};

let month = (CAL.span.last || today).slice(0,7);

function step(n){
  let [y,m] = month.split('-').map(Number);
  m += n; if (m < 1){ m = 12; y--; } if (m > 12){ m = 1; y++; }
  month = `${y}-${String(m).padStart(2,'0')}`;
  draw();
}

function draw(){
  shutDay();
  const [y,m] = month.split('-').map(Number);
  const S = CAL.streams;
  mLabel.innerHTML = `${MONTHS[m-1]} ${y}`;

  const first = new Date(y, m-1, 1).getDay();
  const last  = new Date(y, m, 0).getDate();
  let html = '';
  for (let i = 0; i < first; i++) html += '<div class="cell pad"></div>';

  const tally = {}, dueDays = {};
  S.forEach(s => { tally[s.key] = 0; dueDays[s.key] = 0; });
  let full = 0, part = 0, blank = 0, elapsed = 0;

  for (let d = 1; d <= last; d++){
    const key = iso(y, m, d);
    const have = CAL.days[key] || [];
    // Four of these report what happened during the day, so they cannot
    // exist until it is over. Stock is a photograph and arrives the same
    // day. A stream that is not due yet is not missing.
    const due     = S.filter(s => dueBy(key, s) <= today);
    const missing = due.filter(s => !have.includes(s.key));
    const nothingDue = !due.length;

    if (!nothingDue){
      elapsed++;
      due.forEach(s => dueDays[s.key]++);
      if (!have.length) blank++;
      else if (missing.length) part++;
      else full++;
      have.forEach(k => tally[k] = (tally[k] || 0) + 1);
    }

    const done = !nothingDue && have.length && !missing.length;
    const cls = ['cell', nothingDue ? 'future'
                       : (have.length ? (missing.length ? '' : 'full') : 'none'),
                 key === today ? 'today' : ''].filter(Boolean).join(' ');

    // Five bars, always five, always in the key's order. A filled bar is a
    // file that is in; an empty one is a file that is missing; a stub is one
    // that is not due yet. No words - the key above names them once, and
    // pressing the tile names them again for that day.
    const bars = S.map(s => {
      const got = have.includes(s.key);
      const wait = !got && dueBy(key, s) > today;
      return `<b class="${got ? '' : wait ? 'wait' : 'off'}"
                 style="--c:${esc(s.colour)}"></b>`;
    }).join('');

    html += `<div class="${cls}" data-day="${key}" style="--in:${
          Math.min(d, 26) * 10}ms">
        <div class="n">${d}${key === today ? '<em>today</em>' : ''}${
          done ? '<span class="tick">✓</span>'
               : missing.length
                 ? `<span class="gap"><i></i>${missing.length}</span>` : ''}</div>
        <div class="bars">${bars}</div>
      </div>`;
  }
  grid.innerHTML = html;

  const answered = full + part;
  const pill = (cls, n, word) => n
    ? `<span class="pill ${cls}"><i></i><b>${n}</b> ${word}</span>` : '';
  lede.innerHTML =
    `<span class="v">${answered}<i> / ${elapsed}</i></span>` +
    `<span class="lbl">days answered</span>` +
    `<span class="pills">${pill('f', full, 'complete')}${
      pill('p', part, 'part')}${pill('e', blank, 'nothing in')}</span>`;

  // The key. Fixed order, never re-sorted - it is what the bars below mean,
  // and a colour learnt here has to still be in the same place down there.
  key.innerHTML = S.map(s => {
    const n = tally[s.key] || 0, of = dueDays[s.key] || 0;
    return `<span class="kk${of && n >= of ? ' done' : ''}" style="--c:${esc(s.colour)}"
                  title="${esc(s.label)}: ${n} of ${of} days due">
        <i></i><em>${esc(s.tiny || s.short)}</em><b>${n}</b><span class="of">/${of}</span>
      </span>`;
  }).join('');

  fit(Math.ceil((first + last) / 7));
}

/* A month is five rows or six, and a screen is whatever the screen is. A
   fixed tile height has to be short enough for the worst case, which leaves
   a band of empty page on every other one. Measure instead: shrink to the
   floor, ask the page how much room it did not use, and hand it back - to
   the tiles first, and once a day is as tall as a day should be, to the
   space between the weeks. */
const MIN_TILE = 62, MAX_TILE = 132, MIN_GAP = 9, MAX_GAP = 18;
function fit(rows){
  grid.style.setProperty('--tile', MIN_TILE + 'px');
  grid.style.setProperty('--gap', MIN_GAP + 'px');
  let slack = window.innerHeight
            - (board.getBoundingClientRect().bottom + window.scrollY) - 18;
  const h = Math.max(MIN_TILE,
            Math.min(MAX_TILE, MIN_TILE + Math.floor(slack / rows)));
  grid.style.setProperty('--tile', h + 'px');
  slack -= (h - MIN_TILE) * rows;
  const g = Math.max(MIN_GAP,
            Math.min(MAX_GAP, MIN_GAP + Math.floor(slack / rows)));
  grid.style.setProperty('--gap', g + 'px');
}

/* ---------- the day panel ----------
   What this day still wants, and the way to give it to it. Each row opens
   Raw Data Upload with that card already open and this date already in the
   box, so a gap you spotted is a gap you can close without first working out
   which tile to press and typing the date back in by hand. */
const pop = document.createElement('div');
pop.className = 'daypop';
cal.appendChild(pop);
let popFor = null;

function openDay(cell){
  const key = cell.dataset.day;
  if (!key) return;
  popFor = key;

  const S = CAL.streams;
  const have = CAL.days[key] || [];
  const due = S.filter(s => dueBy(key, s) <= today);
  if (!due.length){ shutDay(); return; }
  const missing = due.filter(s => !have.includes(s.key));
  // The pull taken on this day, named by the window it covers - "1 - 12 Aug"
  // says both that you took it and how far back it reaches.
  const pull = (CAL.periods || []).find(p => p.to === key);

  const rows = S.map(s => {
    const dot = `<i style="--c:${esc(s.colour)}"></i>`;
    if (have.includes(s.key)){
      const note = s.key === 'shop_cumulative' && pull
        ? `<u>${esc(spanOf(pull))} pull</u>` : '';
      return `<div class="st done">${dot}<b>${esc(s.label)}${note}</b>` +
             `<span>✓</span></div>`;
    }
    if (dueBy(key, s) > today)
      return `<div class="st wait">${dot}<b>${esc(s.label)}</b>` +
             `<span>not due</span></div>`;
    return `<button type="button" class="up" data-stream="${esc(s.card || s.key)}">` +
           `${dot}<b>${esc(s.label)}</b><span>Upload</span></button>`;
  }).join('');

  pop.innerHTML =
    `<div class="hd">${missing.length
        ? (missing.length === 1 ? '1 still wanted' : missing.length + ' still wanted')
        : 'All in'}<b>${esc(saidDay(key))}</b>` +
     `<button type="button" class="x" aria-label="Close">×</button></div>` +
    `<div class="bd">${rows}</div>`;

  // Placed against the grid, and flipped when it would run off the right.
  const box = cell.getBoundingClientRect();
  const host = cal.getBoundingClientRect();
  const w = 306, gap = 8;
  let left = box.left - host.left + box.width + gap;
  if (left + w > host.width - 4) left = box.left - host.left - w - gap;
  if (left < 4) left = Math.max(4, box.left - host.left);
  pop.style.left = Math.round(left) + 'px';
  pop.style.top = Math.round(box.top - host.top) + 'px';
  pop.classList.add('on');

  // Keep it on screen: if the panel would hang below the fold, lift it.
  const over = pop.getBoundingClientRect().bottom - (window.innerHeight - 8);
  if (over > 0) pop.style.top = Math.round(box.top - host.top - over) + 'px';
}

function shutDay(){
  pop.classList.remove('on');
  popFor = null;
  grid.querySelectorAll('.cell.on').forEach(c => c.classList.remove('on'));
}

/* Click, not hover. A panel that appears because the pointer crossed a tile
   on its way somewhere else is one you did not ask for, and one you have to
   escape before you can read the tile behind it. Pressing a day is a
   decision; the ring says which day is being answered, and pressing it again
   puts it away. */
grid.addEventListener('click', e => {
  const cell = e.target.closest('.cell');
  if (!cell || cell.classList.contains('pad') || cell.classList.contains('future')){
    shutDay(); return;
  }
  const open = popFor === cell.dataset.day && pop.classList.contains('on');
  shutDay();
  if (open) return;
  cell.classList.add('on');
  openDay(cell);
});
pop.addEventListener('click', e => {
  if (e.target.closest('.x')){ shutDay(); return; }
  const btn = e.target.closest('.up');
  if (!btn || !popFor) return;
  location.href = '/?upload=' + encodeURIComponent(btn.dataset.stream) +
                  '&date=' + encodeURIComponent(popFor);
});
document.addEventListener('click', e => {
  if (!pop.classList.contains('on')) return;
  if (e.target.closest('#grid') || e.target.closest('.daypop')) return;
  shutDay();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') shutDay(); });
let fitTimer = null;
window.addEventListener('resize', () => {
  shutDay();
  clearTimeout(fitTimer);
  fitTimer = setTimeout(draw, 90);
});

draw();
</script>
{% endblock %}
