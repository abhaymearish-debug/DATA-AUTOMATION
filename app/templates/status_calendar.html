{% extends "base.html" %}
{% block title %}Status Calendar{% endblock %}
{% block heading %}Status Calendar{% endblock %}

{% block head %}
<style>
  /* ------------------------------------------------------------------
     One question, asked of a month: can the reports speak for this day?

     The screen used to answer it three times over - a legend, then four
     cards repeating the legend, then a grid of dots you had to decode
     against it. It is one card now: the month's headline, and under it
     the four streams ranked by how far behind they are, which is the
     thing worth knowing. The tiles carry the same four colours in the
     same four places, so the card IS the key.
  ------------------------------------------------------------------ */
  /* The month sits inside the card it describes.

     It used to be a strip of its own above it - a pill on the left, an
     "Upload raw data" button on the right, and a band of empty page between
     that strip and the figures it was choosing. Two cards for one subject.
     The button goes with it: the sidebar has that page, and a day tile now
     hands you the upload for the day you are actually pointing at. */
  .mnav { display:inline-flex; align-items:center; gap:2px; flex:none;
          background:var(--row); border:1px solid var(--line); border-radius:11px;
          padding:3px; }
  .mnav button { border:0; background:none; border-radius:8px; width:26px; height:26px;
                 cursor:pointer; color:var(--muted); font-size:14px; line-height:1; padding:0;
                 transition:background .15s ease, color .15s ease; }
  .mnav button:hover { background:var(--card); color:var(--ink);
                       box-shadow:0 1px 2px rgba(16,24,40,.08); }
  .mnav .m { font-size:13.5px; font-weight:750; letter-spacing:-.25px;
             min-width:134px; text-align:center; color:var(--ink); }

  /* ---------- the month, in one card ----------

     This was a headline beside five rows of name-bar-number, each row a
     different length, the bars all starting at a different x because the
     names are not the same width. It read as a form, not as a summary.

     A hero and five cards now. The hero answers the only question the month
     has - how many of its days can the reports speak for - and each card
     answers it for one stream, in the same shape, side by side, so the one
     you are behind on is the short bar rather than the small number you had
     to go looking for.
  ------------------------------------------------------------------ */
  .board { background:var(--card); border:1px solid var(--line); border-radius:16px;
           padding:0; margin-bottom:14px; overflow:hidden;
           box-shadow:0 1px 2px rgba(16,24,40,.05); }

  .hero { display:flex; align-items:center; gap:18px; flex-wrap:wrap;
          padding:14px 18px 14px;
          background:linear-gradient(180deg,
                     color-mix(in srgb, var(--blue) 4%, var(--card)), var(--card)); }
  .hero .sum { flex:1 1 auto; display:flex; align-items:baseline; gap:11px;
               flex-wrap:wrap; min-width:0; }
  .hero .v { font-size:32px; font-weight:800; letter-spacing:-1.4px; line-height:1;
             color:var(--ink); font-variant-numeric:tabular-nums; }
  .hero .v i { font-style:normal; font-size:17px; font-weight:700; color:var(--muted);
               letter-spacing:-.4px; }
  .hero .k { font-size:13px; font-weight:650; color:var(--ink); letter-spacing:-.15px; }
  /* The three states of a day, as three quiet pills - a legend that happens
     to carry the counts. */
  .hero .pills { margin-left:auto; display:flex; gap:7px; flex-wrap:wrap; }
  .hero .pill { display:inline-flex; align-items:center; gap:6px;
                border:1px solid var(--line); border-radius:999px;
                padding:4.5px 11px 4.5px 9px; font-size:11.5px; font-weight:650;
                color:var(--muted); background:var(--card); white-space:nowrap; }
  .hero .pill b { color:var(--ink); font-weight:750;
                  font-variant-numeric:tabular-nums; }
  .hero .pill i { width:7px; height:7px; border-radius:50%; flex:none; }
  .hero .pill.f i { background:var(--ok); }
  .hero .pill.p i { background:none; box-shadow:inset 0 0 0 1.6px var(--gold); }
  .hero .pill.e i { background:none;
                    box-shadow:inset 0 0 0 1.6px color-mix(in srgb, var(--bad) 55%,
                               transparent); }

  /* One card per stream, all the same shape, worst first. */
  .streams { display:grid; grid-template-columns:repeat(5, 1fr);
             border-top:1px solid var(--line); }
  .scard { padding:13px 16px 15px; min-width:0;
           border-left:1px solid var(--line); }
  .scard:first-child { border-left:0; }
  .scard .nm { display:flex; align-items:center; gap:7px; min-width:0;
               font-size:11.5px; font-weight:700; color:var(--ink);
               letter-spacing:-.1px; white-space:nowrap;
               overflow:hidden; text-overflow:ellipsis; }
  .scard .nm i { width:7.5px; height:7.5px; border-radius:50%; flex:none;
                 box-shadow:0 0 0 2.5px color-mix(in srgb, var(--d) 15%, transparent);
                 background:var(--d); }
  .scard .v { margin-top:9px; font-size:19px; font-weight:780; letter-spacing:-.7px;
              color:var(--ink); line-height:1; font-variant-numeric:tabular-nums; }
  .scard .v i { font-style:normal; font-size:12px; font-weight:650; color:var(--muted);
                letter-spacing:-.1px; }
  /* The month, a segment per day, rather than one bar filled to a percentage.
     "18 of 19" tells you how many; this tells you WHICH - a stream that fell
     over on the 3rd and came back on the 7th reads as a gap in the strip,
     and one that has never started reads as an empty run at the front. */
  .scard .bar { margin-top:10px; display:flex; gap:1.5px; height:12px;
                align-items:stretch; }
  .scard .bar b { flex:1 1 0; min-width:0; border-radius:2px;
                  background:var(--d); transition:opacity .2s ease; }
  .scard .bar b.off { background:color-mix(in srgb, var(--bad) 26%, var(--row)); }
  .scard .bar b.wait { background:color-mix(in srgb, var(--line) 70%, transparent); }
  .scard:hover .bar b { opacity:.95; }
  /* Files and days are the same number on every stream but the cumulative,
     where two pulls answer a whole month - so it is only said where it
     differs from the days above it. */
  .scard .fc { margin-top:7px; min-height:13px; font-size:10.5px; font-weight:650;
               color:var(--muted); opacity:.85; font-variant-numeric:tabular-nums; }
  @media (max-width:1100px){ .streams { grid-template-columns:repeat(3, 1fr); }
    .scard:nth-child(4) { border-left:0; } }
  @media (max-width:760px){ .streams { grid-template-columns:repeat(2, 1fr); }
    .scard { border-left:0; box-shadow:inset 0 1px 0 var(--line); }
    .hero .pills { margin-left:0; width:100%; } }

  /* ---------- what a day still wants ----------
     Hovering a tile used to produce the browser's own tooltip: five lines of
     plain text, after a delay, that you could read and not act on. The panel
     below names the uploads that day is missing and hands you each one - the
     card on Raw Data Upload opens with the date already filled in, because
     the day you are pointing at IS the date. */
  .cal { position:relative; }
  .daypop { position:absolute; z-index:40; width:306px; display:none;
            background:var(--card); border:1px solid var(--line); border-radius:13px;
            box-shadow:0 10px 30px -8px rgba(16,24,40,.22),
                       0 2px 6px rgba(16,24,40,.06);
            overflow:hidden; }
  .daypop.on { display:block; animation:ksd-pop .14s cubic-bezier(.2,.7,.3,1) both; }
  .daypop .hd { padding:10px 13px 8px; font-size:9.5px; font-weight:800;
                letter-spacing:.9px; text-transform:uppercase; color:var(--muted);
                border-bottom:1px solid var(--line); }
  .daypop .hd b { display:block; font-size:13px; font-weight:750; letter-spacing:-.2px;
                  text-transform:none; color:var(--ink); margin-top:2px; }
  .daypop .bd { padding:5px; max-height:260px; overflow:auto; }
  .daypop .up { display:flex; align-items:center; gap:9px; width:100%;
                border:0; background:none; font:inherit; text-align:left;
                padding:8px 9px; border-radius:9px; cursor:pointer;
                color:var(--ink); font-size:12.5px; font-weight:650;
                transition:background-color .14s ease; }
  .daypop .up:hover { background:var(--hover); }
  .daypop .up b { flex:1 1 auto; min-width:0; font-weight:650; white-space:nowrap;
                  overflow:hidden; text-overflow:ellipsis; }
  .daypop .up i { width:7px; height:7px; border-radius:50%; flex:none;
                  background:none;
                  box-shadow:inset 0 0 0 1.7px color-mix(in srgb, var(--bad) 60%,
                             transparent); }
  .daypop .up span { margin-left:auto; flex:none; font-size:10.5px; font-weight:750;
                     color:var(--blue); opacity:0; transition:opacity .14s ease; }
  .daypop .up:hover span { opacity:1; }
  .daypop .ok { padding:11px 13px 13px; font-size:12.5px; color:var(--muted); }
  .daypop .ok b { color:var(--ok); }

  /* ---------- the grid ----------

     A day tile answers one question: is there anything still to upload for
     this day, and what. So it shows what is MISSING and nothing else.

     Five dots on every tile, one per stream, was the honest version and it
     made every day look alike - thirty tiles of the same five marks, and you
     had to know which of five positions meant which stream before any of it
     meant anything. A complete day was indistinguishable from a broken one
     at a glance, which is the only glance this screen gets.

     Inverted: a day with everything in is a tick on a green wash and no
     words at all. A day short of something names what it is short of, in
     that stream's colour. A day with nothing in says so. Your eye lands on
     the tiles that want something, because they are the only ones with
     anything written on them.
  ------------------------------------------------------------------ */
  .cal { background:var(--card); border:1px solid var(--line); border-radius:16px;
         padding:15px 15px 16px; box-shadow:0 1px 2px rgba(16,24,40,.05); }
  .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
  .dow { text-align:center; font-size:9px; font-weight:800; letter-spacing:1.1px;
         text-transform:uppercase; color:var(--muted); padding-bottom:8px; opacity:.7; }

  /* min-width:0 or a nowrap label sets a floor the column cannot go under,
     and seven of those push the grid off the side of a laptop. */
  .cell { min-height:104px; min-width:0; border:1px solid var(--line);
          border-radius:13px; padding:9px 10px 10px; background:var(--card);
          display:flex; flex-direction:column; position:relative; overflow:hidden;
          transition:box-shadow .18s ease, border-color .18s ease,
                     transform .18s cubic-bezier(.2,.7,.3,1); }
  .cell:not(.pad):hover { border-color:color-mix(in srgb, var(--blue) 36%, var(--line));
          box-shadow:0 8px 22px -8px rgba(16,24,40,.22);
          transform:translateY(-2px); z-index:2; }
  .cell.pad { border:0; background:none; min-height:0; }

  /* The day number, and to its right the one mark that says how the day did. */
  .cell .n { display:flex; align-items:center; gap:6px;
             font-size:14.5px; font-weight:750; color:var(--ink);
             letter-spacing:-.3px; font-variant-numeric:tabular-nums; }
  .cell .n em { font-style:normal; font-size:8px; font-weight:800; letter-spacing:.8px;
                text-transform:uppercase; color:var(--gold); }
  .cell .n .mk { margin-left:auto; flex:none; display:grid; place-items:center;
                 min-width:19px; height:19px; padding:0 5px; border-radius:999px;
                 font-size:10.5px; font-weight:800; letter-spacing:0;
                 font-variant-numeric:tabular-nums; }
  .cell .n .mk.ok { color:var(--ok);
                    background:color-mix(in srgb, var(--ok) 13%, transparent); }
  .cell .n .mk.no { color:var(--gold-ink, #92400E);
                    background:color-mix(in srgb, var(--gold) 20%, transparent); }

  /* What the day is still short of. Never more than three names - past that
     it is quicker to say how many. */
  .cell .gaps { margin-top:7px; display:grid; gap:3px; align-content:start; }
  .cell .g { display:flex; align-items:center; gap:6px; min-width:0;
             font-size:10.5px; font-weight:650; letter-spacing:-.05px;
             line-height:1.3; color:var(--muted);
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cell .g i { width:6px; height:6px; border-radius:50%; flex:none; background:var(--c);
               box-shadow:0 0 0 2px color-mix(in srgb, var(--c) 18%, transparent); }
  .cell .g.more { color:var(--muted); opacity:.8; padding-left:12px; }

  /* Everything in. A wash and a tick, and nothing to read. */
  .cell.full { border-color:color-mix(in srgb, var(--ok) 30%, var(--line));
               background:linear-gradient(180deg,
                          color-mix(in srgb, var(--ok) 7%, var(--card)),
                          color-mix(in srgb, var(--ok) 2%, var(--card))); }
  .cell.full .n { color:color-mix(in srgb, var(--ok) 55%, var(--ink)); }

  /* Nothing in at all - said in one line rather than as five absences. */
  .cell.none { border-color:color-mix(in srgb, var(--bad) 22%, var(--line));
               background:linear-gradient(180deg,
                          color-mix(in srgb, var(--bad) 5%, var(--card)),
                          var(--card)); }
  .cell.none .say { margin-top:auto; font-size:10.5px; font-weight:700;
                    color:color-mix(in srgb, var(--bad) 70%, var(--muted)); }

  /* Not due yet: quiet, and not a gap you could close today. */
  .cell.future { border-style:dashed; background:none; }
  .cell.future .n { color:var(--muted); font-weight:700; }
  .cell.future .say { margin-top:auto; font-size:10px; font-weight:650;
                      color:var(--muted); opacity:.65; }

  .cell.today { border-color:var(--gold);
                box-shadow:0 0 0 3px color-mix(in srgb, var(--gold) 20%, transparent); }
  .cell.today .n { color:var(--gold); }

  /* On a phone seven columns have about fifty pixels each, which is room for
     a number and four slots and nothing else. The note goes; the tooltip and
     the card above still say which stream is missing. */
  @media (max-width:760px){
    .board { gap:14px; padding:14px; }
    .rule { display:none; }
    .lede2 { flex:1 1 100%; }
    .cal { padding:10px; }
    .grid { gap:5px; }
    /* Seven columns of about fifty pixels: room for the number and five
       dots, and not for their names. The tooltip still has them. */
    .cell { min-height:58px; padding:6px 5px 7px; border-radius:9px; }
    .cell .n { font-size:11.5px; gap:3px; }
    .cell .n em, .cell .n .tick { display:none; }
    .sts { grid-auto-flow:column; gap:3px; margin-top:auto;
           justify-content:start; align-items:center; }
    .sts .st { font-size:0; gap:0; }
    .sts .st i { width:5.5px; height:5.5px; }
    .dow { font-size:8.5px; letter-spacing:.4px; }
  }

</style>
{% endblock %}

{% block content %}
<div class="board">
  <div class="hero">
    <div class="mnav">
      <button type="button" onclick="step(-1)" aria-label="Previous month">&lsaquo;</button>
      <span class="m" id="mLabel">—</span>
      <button type="button" onclick="step(1)" aria-label="Next month">&rsaquo;</button>
    </div>
    <div class="sum" id="lede"></div>
  </div>
  <div class="streams" id="streams"></div>
</div>

<div class="cal" id="cal"><div class="grid" id="grid"></div></div>
{% endblock %}

{% block scripts %}
<script>
/* What this screen answers: for any given day, can the reports speak for it?
   A day is covered per stream, and the gaps are the point - but a day with
   three of four streams is normal, not a fault, so the tile names what is
   missing rather than shouting a count at you. */
const CAL = {{ calendar | tojson }};
const MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];
const iso = (y,m,d) => `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const today = new Date().toISOString().slice(0,10);
// The day a stream's raw for `key` can first exist: same day for the stock
// photograph, the morning after for anything that reports a finished day.
const dueBy = (key, s) => {
  const n = Number(s.due_after || 0);
  if (!n) return key;
  const [y,m,d] = key.split('-').map(Number);
  return new Date(Date.UTC(y, m-1, d + n)).toISOString().slice(0,10);
};
const esc = s => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };

let month = (CAL.span.last || today).slice(0,7);

function step(n){
  let [y,m] = month.split('-').map(Number);
  m += n; if (m < 1){ m = 12; y--; } if (m > 12){ m = 1; y++; }
  month = `${y}-${String(m).padStart(2,'0')}`;
  draw();
}

function draw(){
  const [y,m] = month.split('-').map(Number);
  const S = CAL.streams;
  mLabel.innerHTML = `${MONTHS[m-1]} ${y}`;

  const first = new Date(y, m-1, 1).getDay();
  const last  = new Date(y, m, 0).getDate();
  let html = ['S','M','T','W','T','F','S'].map(d => `<div class="dow">${d}</div>`).join('');
  for (let i = 0; i < first; i++) html += '<div class="cell pad"></div>';

  const tally = {}, dueDays = {};
  S.forEach(s => { tally[s.key] = 0; dueDays[s.key] = 0; });
  let full = 0, part = 0, blank = 0, elapsed = 0;

  for (let d = 1; d <= last; d++){
    const key = iso(y, m, d);
    const have = CAL.days[key] || [];
    // Four of these report what happened during the day, so they cannot
    // exist until it is over. Stock is a photograph and arrives the same
    // day. A stream that is not due yet is not missing.
    const due     = S.filter(s => dueBy(key, s) <= today);
    const waiting = S.filter(s => dueBy(key, s) >  today);
    const missing = due.filter(s => !have.includes(s.key));
    const nothingDue = !due.length;

    if (!nothingDue){
      elapsed++;
      due.forEach(s => dueDays[s.key]++);
      if (!have.length) blank++;
      else if (missing.length) part++;
      else full++;
      have.forEach(k => tally[k] = (tally[k] || 0) + 1);
    }

    const done = !nothingDue && have.length && !missing.length;
    const cls = ['cell', nothingDue ? 'future'
                       : (have.length ? (missing.length ? '' : 'full') : 'none'),
                 key === today ? 'today' : ''].filter(Boolean).join(' ');

    // The whole day's state, spelled out, for anyone who hovers.
    // The pull taken on this day, named by the window it covers - "from the
    // 1 - 12 Aug pull" says both that you took it and how far back it reaches.
    const pull = (CAL.periods || []).find(p => p.to === key);
    // "1 - 16 Aug 2026", not "1 Aug 2026 to 16 Aug 2026" - the month and the
    // year are the same at both ends, and saying them twice in a tooltip
    // that is already five lines long is five words nobody reads.
    const span = p => {
      const A = new Date(p.from + 'T00:00'), B = new Date(p.to + 'T00:00');
      const mon = d => d.toLocaleDateString('en-GB', {month:'short'});
      return A.getMonth() === B.getMonth() && A.getFullYear() === B.getFullYear()
        ? `${A.getDate()}\u2013${B.getDate()} ${mon(B)} ${B.getFullYear()}`
        : `${A.getDate()} ${mon(A)} \u2013 ${B.getDate()} ${mon(B)} ${B.getFullYear()}`;
    };
    const tip = nothingDue ? key : S.map(s => have.includes(s.key)
          ? `\u2713 ${s.label}` +
            (s.key === 'shop_cumulative' && pull ? ` \u2014 from the ${span(pull)} pull` : '')
        : dueBy(key, s) > today ? `\u00b7 ${s.label} \u2014 not due yet`
        : `\u2014 ${s.label}`).join('\n');

    // All five, named, every day. Which ones are missing is the question
    // this screen exists to answer, and it should not need a hover or a
    // legend to answer it.
    // What the day is short of, named. Three at most: past that the count
    // says it faster than the list does, and five names is the wall of text
    // this tile was redesigned to get rid of.
    let body = '';
    let mark = '';
    if (nothingDue){
      body = `<div class="say">Not due yet</div>`;
    } else if (!have.length){
      body = `<div class="say">Nothing uploaded</div>`;
      mark = `<span class="mk no">${due.length}</span>`;
    } else if (missing.length){
      const show = missing.slice(0, 3);
      body = `<div class="gaps">${show.map(s =>
          `<span class="g" style="--c:${esc(s.colour)}"
                 title="${esc(s.label)}"><i></i>${esc(s.tiny || s.short)}</span>`).join('')}${
        missing.length > show.length
          ? `<span class="g more">+${missing.length - show.length} more</span>` : ''}</div>`;
      mark = `<span class="mk no">${missing.length}</span>`;
    } else {
      mark = `<span class="mk ok">\u2713</span>`;
    }

    html += `<div class="${cls}" data-day="${key}" title="${esc(tip)}">
        <div class="n">${d}${key === today ? '<em>today</em>' : ''}${mark}</div>
        ${body}
      </div>`;
  }
  grid.innerHTML = html;

  const answered = full + part;
  // The headline, then the three states of a day as pills - which doubles as
  // the key for the tiles under it.
  const pill = (cls, n, word) => n
    ? `<span class="pill ${cls}"><i></i><b>${n}</b> ${word}</span>` : '';
  lede.innerHTML =
    `<span class="v">${answered}<i> / ${elapsed}</i></span>` +
    `<span class="k">days answered</span>` +
    `<span class="pills">${pill('f', full, 'complete')}${
      pill('p', part, 'part')}${pill('e', blank, 'nothing in')}</span>`;

  // Worst first, and each against the days it was actually due - stock is
  // due for today as well, the other four are not, so they do not share a
  // denominator.
  // How many files are behind a row, which is not how many days it answers.
  // Every stream but one is a file a day, so the two numbers agree and the
  // file count says nothing new. A cumulative pull covers every day back to
  // the 1st, so two files answer all thirty-one days of August - and the row
  // read "31/31" beside a Shop Daily row of "4/31" that meant four uploads.
  // Same bar, two different questions. The file count is what tells them
  // apart, so it is only printed where it differs from the days.
  const monthFrom = iso(y, m, 1), monthTo = iso(y, m, last);
  const filesOf = key => key !== 'shop_cumulative' ? (tally[key] || 0)
    : (CAL.periods || []).filter(p => monthFrom <= p.to && p.to <= monthTo).length;

  streams.innerHTML = S.map(s => ({s, n: tally[s.key] || 0, of: dueDays[s.key] || 0,
                                   f: filesOf(s.key)}))
    .sort((a, b) => (a.of ? a.n / a.of : 1) - (b.of ? b.n / b.of : 1))
    .map(({s, n, of, f}) => {
      const said = f === 1 ? '1 file' : `${f} files`;
      // Only where files and days differ - and never "0 files", which is the
      // same nothing the count above it has already reported.
      const show = f !== n && f > 0;
      // One segment per day of this month, in order.
      const strip = [];
      for (let dd = 1; dd <= last; dd++){
        const k = iso(y, m, dd);
        if (dueBy(k, s) > today) strip.push('<b class="wait"></b>');
        else strip.push((CAL.days[k] || []).includes(s.key)
          ? '<b></b>' : '<b class="off"></b>');
      }
      return `<div class="scard" style="--d:${esc(s.colour)}"
                   title="${esc(s.label)}: ${n} of ${of} days due, from ${said}">
          <div class="nm"><i></i>${esc(s.tiny || s.short)}</div>
          <div class="v">${n}<i> / ${of}</i></div>
          <div class="bar">${strip.join('')}</div>
          <div class="fc">${show ? esc(said) : '&nbsp;'}</div>
        </div>`;
    }).join('');
}
/* ---------- the day panel ----------
   What this day still wants, and the way to give it to it. Each row opens
   Raw Data Upload with that card already open and this date already in the
   box, so a gap you spotted is a gap you can close without first working
   out which tile to press and typing the date back in by hand. */
const pop = document.createElement('div');
pop.className = 'daypop';
cal.appendChild(pop);

let popFor = null, popTimer = null;
const MONTHS_S = ['Jan','Feb','Mar','Apr','May','Jun',
                  'Jul','Aug','Sep','Oct','Nov','Dec'];
const saidDay = key => {
  const [y, m, d] = key.split('-').map(Number);
  return `${d} ${MONTHS_S[m - 1]} ${y}`;
};

function openDay(cell){
  const key = cell.dataset.day;
  if (!key) return;
  clearTimeout(popTimer);
  if (popFor === key && pop.classList.contains('on')) return;
  popFor = key;

  const S = CAL.streams;
  const have = CAL.days[key] || [];
  const due = S.filter(s => dueBy(key, s) <= today);
  if (!due.length){ shutDay(); return; }
  const missing = due.filter(s => !have.includes(s.key));

  pop.innerHTML =
    `<div class="hd">Raw data<b>${esc(saidDay(key))}</b></div>` +
    (missing.length
      ? `<div class="bd">${missing.map(s =>
          `<button type="button" class="up" data-stream="${esc(s.card || s.key)}">` +
          `<i style="--c:${esc(s.colour)}"></i><b>${esc(s.label)}</b>` +
          `<span>Upload</span></button>`).join('')}</div>`
      : `<div class="ok"><b>\u2713</b> Everything uploaded.</div>`);

  // Placed against the grid, and flipped when it would run off the right.
  const box = cell.getBoundingClientRect();
  const host = cal.getBoundingClientRect();
  const w = 306, gap = 8;
  let left = box.left - host.left + box.width + gap;
  if (left + w > host.width - 4) left = box.left - host.left - w - gap;
  if (left < 4) left = Math.max(4, box.left - host.left);
  pop.style.left = Math.round(left) + 'px';
  pop.style.top = Math.round(box.top - host.top) + 'px';
  pop.classList.add('on');

  // Keep it on screen: if the panel would hang below the fold, lift it.
  const over = pop.getBoundingClientRect().bottom - (window.innerHeight - 8);
  if (over > 0) pop.style.top = Math.round(box.top - host.top - over) + 'px';
}

function shutDay(){ pop.classList.remove('on'); popFor = null; }
const laterDay = () => { clearTimeout(popTimer); popTimer = setTimeout(shutDay, 240); };

grid.addEventListener('mouseover', e => {
  const cell = e.target.closest('.cell');
  if (!cell || cell.classList.contains('pad')) return;
  openDay(cell);
});
grid.addEventListener('mouseleave', laterDay);
pop.addEventListener('mouseenter', () => clearTimeout(popTimer));
pop.addEventListener('mouseleave', laterDay);
grid.addEventListener('click', e => {
  const cell = e.target.closest('.cell');
  if (cell && !cell.classList.contains('pad')) openDay(cell);
});
pop.addEventListener('click', e => {
  const btn = e.target.closest('.up');
  if (!btn || !popFor) return;
  location.href = '/?upload=' + encodeURIComponent(btn.dataset.stream) +
                  '&date=' + encodeURIComponent(popFor);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') shutDay(); });

draw();
</script>
{% endblock %}
