{% extends "base.html" %}
{% block title %}Status Calendar{% endblock %}
{% block heading %}Status Calendar{% endblock %}

{% block head %}
<style>
  /* ------------------------------------------------------------------
     One question, asked of a month: can the reports speak for this day?

     The screen used to answer it three times over - a legend, then four
     cards repeating the legend, then a grid of dots you had to decode
     against it. It is one card now: the month's headline, and under it
     the four streams ranked by how far behind they are, which is the
     thing worth knowing. The tiles carry the same four colours in the
     same four places, so the card IS the key.
  ------------------------------------------------------------------ */
  .controls { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .controls .sp { margin-left:auto; display:flex; gap:8px; align-items:center; }
  .mnav { display:inline-flex; align-items:center; gap:4px; background:var(--card);
          border:1px solid var(--line); border-radius:12px; padding:5px;
          box-shadow:0 1px 2px rgba(16,24,40,.05); }
  .mnav button { border:0; background:none; border-radius:9px; width:30px; height:30px;
                 cursor:pointer; color:var(--muted); font-size:14px; line-height:1; padding:0;
                 transition:background .15s ease, color .15s ease; }
  .mnav button:hover { background:var(--hover); color:var(--ink); }
  .mnav .m { font-size:14.5px; font-weight:700; letter-spacing:-.2px;
             min-width:150px; text-align:center; }
  .mnav .m small { display:block; font-size:9px; font-weight:800; letter-spacing:.9px;
                   text-transform:uppercase; color:var(--muted); margin-top:-1px; }

  /* ---------- the month, in one card ---------- */
  .board { display:flex; gap:22px; flex-wrap:wrap; align-items:stretch;
           background:var(--card); border:1px solid var(--line); border-radius:14px;
           padding:16px 18px; margin-bottom:14px;
           box-shadow:0 1px 2px rgba(16,24,40,.05); }
  .lede2 { flex:0 0 210px; display:flex; flex-direction:column; justify-content:center; }
  .lede2 .k { font-size:9.5px; font-weight:800; letter-spacing:.9px; text-transform:uppercase;
              color:var(--muted); }
  .lede2 .v { font-size:30px; font-weight:800; letter-spacing:-1px; line-height:1.1;
              margin-top:3px; font-variant-numeric:tabular-nums; }
  .lede2 .v i { font-style:normal; font-size:16px; font-weight:700; color:var(--muted); }
  .lede2 .s { font-size:12px; color:var(--muted); margin-top:5px; line-height:1.5; }
  .lede2 .s b { color:var(--ink); font-weight:700; }

  .rule { width:1px; align-self:stretch; flex:none;
          background:linear-gradient(180deg, transparent, var(--line) 15%,
                     var(--line) 85%, transparent); }

  /* Ranked worst first: the stream you are behind on is the one to see. */
  /* Two by two, always: four streams in a square read as a set, where three
     across and one underneath reads as a list that ran out of room. */
  .streams { flex:1 1 420px; display:grid; gap:9px 30px; align-content:center;
             grid-template-columns:repeat(2, minmax(220px, 1fr)); }
  @media (max-width:760px){ .streams { grid-template-columns:1fr; } }
  .srow { display:flex; align-items:center; gap:9px; font-size:12.5px; }
  .srow i { width:8px; height:8px; border-radius:50%; flex:none; }
  .srow .nm { font-weight:650; color:var(--ink); white-space:nowrap;
              min-width:150px; }
  .srow .bar { flex:1; height:5px; border-radius:3px; background:var(--row);
               overflow:hidden; min-width:44px; }
  .srow .bar b { display:block; height:100%; border-radius:3px; }
  .srow .ct { font-size:11.5px; font-weight:700; color:var(--muted); flex:none;
              font-variant-numeric:tabular-nums; min-width:44px; text-align:right; }

  /* ---------- the grid ---------- */
  .cal { background:var(--card); border:1px solid var(--line); border-radius:14px;
         padding:14px; box-shadow:0 1px 2px rgba(16,24,40,.05); }
  .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
  .dow { text-align:center; font-size:9px; font-weight:800; letter-spacing:1px;
         text-transform:uppercase; color:var(--muted); padding-bottom:6px; opacity:.85; }
  /* min-width:0 or the nowrap note below sets a floor the column cannot go
     under, and seven of those push the whole grid off the side of a laptop. */
  .cell { min-height:94px; min-width:0; border:1px solid var(--line); border-radius:11px;
          padding:9px 10px 10px; display:flex; flex-direction:column; background:var(--card);
          transition:box-shadow .15s ease, border-color .15s ease; }
  .cell:not(.pad):hover { border-color:color-mix(in srgb, var(--blue) 30%, var(--line));
          box-shadow:0 2px 10px rgba(16,24,40,.07); }
  .cell.pad { border:0; background:none; min-height:0; }
  /* Nothing at all: hatched, so an empty day reads as empty rather than as
     a day whose four streams all happen to be off. */
  .cell.none { background:repeating-linear-gradient(135deg,
               transparent 0 7px, var(--row) 7px 14px); }
  .cell.full { border-color:color-mix(in srgb, var(--ok) 38%, var(--line));
               background:color-mix(in srgb, var(--ok) 5%, var(--card)); }
  .cell.future { opacity:.4; }
  .cell.today { border-color:var(--gold); box-shadow:0 0 0 2px
                color-mix(in srgb, var(--gold) 28%, transparent); }
  .cell .n { font-size:13px; font-weight:700; color:var(--ink); display:flex;
             align-items:center; gap:6px; }
  .cell.today .n { color:var(--gold); }
  .cell .n em { font-style:normal; font-size:8.5px; font-weight:800; letter-spacing:.7px;
                text-transform:uppercase; color:var(--gold); }
  .cell .n .tick { margin-left:auto; color:var(--ok); font-size:11px; }

  /* Four slots, always four, always in the same order - so where a colour
     sits is what names it, and the card above is the key. */
  .slots { display:flex; gap:4px; margin-top:auto; }
  .slots b { flex:1; height:5px; border-radius:3px; background:var(--line); }
  .cell.none .slots, .cell.future .slots { visibility:hidden; }
  /* Two lines, so "no Secondary daily, Stock" reads out in full rather than
     truncating - the names are the point, and a count was what this screen
     used to say instead. */
  .gap { font-size:10.5px; color:var(--muted); margin-top:6px; line-height:1.3;
         min-width:0; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2;
         -webkit-box-orient:vertical; }

  /* On a phone seven columns have about fifty pixels each, which is room for
     a number and four slots and nothing else. The note goes; the tooltip and
     the card above still say which stream is missing. */
  @media (max-width:760px){
    .board { gap:14px; padding:14px; }
    .rule { display:none; }
    .lede2 { flex:1 1 100%; }
    .cal { padding:10px; }
    .grid { gap:5px; }
    .cell { min-height:58px; padding:6px 5px 7px; border-radius:9px; }
    .cell .n { font-size:11.5px; gap:3px; }
    .cell .n em, .cell .n .tick { display:none; }
    .gap { display:none; }
    .slots { gap:2px; }
    .slots b { height:4px; }
    .dow { font-size:8.5px; letter-spacing:.4px; }
  }

</style>
{% endblock %}

{% block content %}
<div class="controls">
  <div class="mnav">
    <button type="button" onclick="step(-1)" aria-label="Previous month">&lsaquo;</button>
    <span class="m" id="mLabel">—</span>
    <button type="button" onclick="step(1)" aria-label="Next month">&rsaquo;</button>
  </div>
  <div class="sp"><a class="act" href="/">Upload raw data</a></div>
</div>

<div class="board">
  <div class="lede2" id="lede"></div>
  <span class="rule"></span>
  <div class="streams" id="streams"></div>
</div>

<div class="cal"><div class="grid" id="grid"></div></div>
{% endblock %}

{% block scripts %}
<script>
/* What this screen answers: for any given day, can the reports speak for it?
   A day is covered per stream, and the gaps are the point - but a day with
   three of four streams is normal, not a fault, so the tile names what is
   missing rather than shouting a count at you. */
const CAL = {{ calendar | tojson }};
const MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];
const iso = (y,m,d) => `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const today = new Date().toISOString().slice(0,10);
const esc = s => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };

let month = (CAL.span.last || today).slice(0,7);

function step(n){
  let [y,m] = month.split('-').map(Number);
  m += n; if (m < 1){ m = 12; y--; } if (m > 12){ m = 1; y++; }
  month = `${y}-${String(m).padStart(2,'0')}`;
  draw();
}

function draw(){
  const [y,m] = month.split('-').map(Number);
  const S = CAL.streams;
  mLabel.innerHTML = `${MONTHS[m-1]} ${y}`;

  const first = new Date(y, m-1, 1).getDay();
  const last  = new Date(y, m, 0).getDate();
  let html = ['S','M','T','W','T','F','S'].map(d => `<div class="dow">${d}</div>`).join('');
  for (let i = 0; i < first; i++) html += '<div class="cell pad"></div>';

  const tally = {};
  S.forEach(s => tally[s.key] = 0);
  let full = 0, part = 0, blank = 0, elapsed = 0;

  for (let d = 1; d <= last; d++){
    const key = iso(y, m, d);
    const have = CAL.days[key] || [];
    const future = key > today;
    const missing = S.filter(s => !have.includes(s.key));
    if (!future){
      elapsed++;
      if (!have.length) blank++;
      else if (missing.length) part++;
      else full++;
      have.forEach(k => tally[k] = (tally[k] || 0) + 1);
    }
    const cls = ['cell', future ? 'future' : (have.length ? (missing.length ? '' : 'full') : 'none'),
                 key === today ? 'today' : ''].filter(Boolean).join(' ');

    // The whole day's state, spelled out, for anyone who hovers.
    const tip = future ? key
      : S.map(s => `${have.includes(s.key) ? '✓' : '—'} ${s.label}`).join('\n');

    const slots = S.map(s => `<b style="${have.includes(s.key)
        ? 'background:' + s.colour : ''}" title="${esc(s.label)}"></b>`).join('');

    // A day short of one stream is routine; it says which, quietly. A day
    // with nothing at all says so outright.
    let note = '';
    if (!future){
      if (!have.length) note = '<div class="gap">nothing uploaded</div>';
      else if (missing.length === 1) note = `<div class="gap">no ${esc(missing[0].short)}</div>`;
      else if (missing.length) note =
        `<div class="gap">no ${esc(missing.map(s => s.short).join(', '))}</div>`;
    }

    html += `<div class="${cls}" title="${esc(tip)}">
        <div class="n">${d}${key === today ? '<em>today</em>' : ''}${
          !future && have.length && !missing.length ? '<span class="tick">✓</span>' : ''}</div>
        ${note}
        <div class="slots">${slots}</div>
      </div>`;
  }
  grid.innerHTML = html;

  const answered = full + part;
  lede.innerHTML = `
    <div class="k">Days answered</div>
    <div class="v">${answered}<i> / ${elapsed}</i></div>
    <div class="s">${full ? `<b>${full}</b> complete` : 'none complete'}${
      part ? ` &middot; <b>${part}</b> part` : ''}${
      blank ? ` &middot; <b>${blank}</b> empty` : ''}</div>`;

  // Worst first: the stream you are behind on is the one worth seeing.
  streams.innerHTML = S.map(s => ({s, n: tally[s.key] || 0}))
    .sort((a, b) => a.n - b.n)
    .map(({s, n}) => {
      const pct = elapsed ? Math.round(n / elapsed * 100) : 0;
      return `<div class="srow" title="${esc(s.label)}: ${n} of ${elapsed} days">
          <i style="background:${s.colour}"></i>
          <span class="nm">${esc(s.label.replace(' - ', ' \u00b7 '))}</span>
          <span class="bar"><b style="width:${pct}%;background:${s.colour}"></b></span>
          <span class="ct">${n}/${elapsed}</span>
        </div>`;
    }).join('');
}
draw();
</script>
{% endblock %}
