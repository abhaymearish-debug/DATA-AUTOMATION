{% extends "base.html" %}
{% block title %}Status Calendar{% endblock %}
{% block heading %}Status Calendar{% endblock %}

{% block head %}
<style>
  /* ==================================================================
     One question, asked of a month: can the reports speak for this day?

     The screen used to answer it twice. A matrix of streams against days
     sat above a calendar of days against streams - the same numbers, laid
     out two ways, one above the other, and the tiles underneath had to be
     read against the matrix to mean anything. Two charts, one fact.

     It is one board now. Each day's tile IS the column that was in the
     matrix: five bars, one per stream, standing up. A bar that is filled
     is a file that is in. A bar that is an empty outline is a file that is
     missing. A stub along the bottom is a file that is not due yet. Ink
     against no ink - the one distinction the eye settles without being
     taught, and the one that cannot argue with the stream colours, because
     it is not a colour.

     Losing the matrix gave the tiles its height, so the bars are tall
     enough to read a whole month's shape at a glance: where the skyline
     drops, a file is missing.
  ================================================================== */
  .content { padding-bottom:20px; }

  .board { background:var(--card); border:1px solid var(--line); border-radius:20px;
           overflow:hidden; display:flex; flex-direction:column;
           box-shadow:0 1px 2px rgba(16,24,40,.05),
                      0 18px 40px -28px rgba(16,24,40,.40); }

  /* ---------- the head ----------

     The headline used to be "19 / 20 days answered", which was very nearly a
     lie. Eighteen of those nineteen days were answered by three files out of
     five; the biggest number on the screen was the one that mattered least,
     and the distribution that did matter - complete, part, nothing in - sat
     in small grey outlines off to the right where nobody read it.

     "18 part" was noise anyway: in a month where the cumulative is pulled
     twice and the stock count taken three times, almost every day is part.
     What is worth saying in one number is how much of what the month has
     asked for is actually in, and after that, how many gaps are left. The
     five streams underneath say where they are. */
  .head { display:flex; align-items:center; gap:20px; flex-wrap:wrap;
          padding:16px 20px 15px; }
  /* The month is a heading, not a control in a box. The arrows stand either
     side of it and keep quiet until you go near them. */
  .mnav { display:inline-flex; align-items:center; gap:4px; flex:none; }
  .mnav button { border:0; background:none; border-radius:50%; width:30px; height:30px;
                 cursor:pointer; color:var(--muted); font-size:16px; line-height:1; padding:0;
                 transition:background .15s ease, color .15s ease, transform .15s ease; }
  .mnav button:hover { background:var(--hover); color:var(--ink); }
  .mnav button:active { transform:scale(.92); }
  .mnav .m { font-size:19px; font-weight:780; letter-spacing:-.55px;
             min-width:168px; text-align:center; color:var(--ink); }

  /* No headline figure. A percentage of the month is a number you can look at
     and not act on; what is worth saying here is how many gaps are left, and
     the five meters underneath say where they are. */
  .sum { flex:1 1 auto; display:flex; align-items:center; gap:12px;
         flex-wrap:wrap; min-width:0; }
  /* One chip, so it can carry some weight. It used to share the corner with
     "1 day with nothing in" - a second count of the same shortfall, sliced a
     different way, which made two pills out of one fact and left neither of
     them worth reading. The number is a figure here, the word is its unit,
     and the mark beside it is the empty bar the tiles are full of. */
  .sum .pills { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
  .sum .pill { display:inline-flex; align-items:center; gap:10px;
               border-radius:13px; padding:7px 15px 7px 12px;
               font-size:12.5px; font-weight:650; letter-spacing:-.1px;
               white-space:nowrap; color:var(--muted); background:var(--row);
               box-shadow:inset 0 0 0 1px var(--line); }
  .sum .pill b { font-size:15.5px; font-weight:800; letter-spacing:-.45px;
                 color:var(--ink); font-variant-numeric:tabular-nums; }
  .sum .pill i { width:10px; height:13px; border-radius:3.5px; flex:none; }
  .sum .pill.gap { color:color-mix(in srgb, var(--bad) 58%, var(--ink));
      background:linear-gradient(180deg,
                 color-mix(in srgb, var(--bad) 12%, var(--card)),
                 color-mix(in srgb, var(--bad) 6%, var(--card)));
      box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--bad) 26%, transparent),
                 0 1px 2px color-mix(in srgb, var(--bad) 12%, transparent); }
  .sum .pill.gap b { color:var(--bad); }
  .sum .pill.gap i { background:color-mix(in srgb, var(--bad) 6%, transparent);
                     box-shadow:inset 0 0 0 1.6px color-mix(in srgb, var(--bad) 48%,
                                transparent); }
  /* Nothing outstanding is a sentence, not a count, so it drops the figure. */
  .sum .pill.all { color:var(--ok); font-weight:700;
      background:linear-gradient(180deg,
                 color-mix(in srgb, var(--ok) 12%, var(--card)),
                 color-mix(in srgb, var(--ok) 6%, var(--card)));
      box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--ok) 26%, transparent),
                 0 1px 2px color-mix(in srgb, var(--ok) 12%, transparent); }
  .sum .pill.all i { width:15px; height:15px; border-radius:50%; background:var(--ok);
                     color:#fff; display:grid; place-items:center;
                     font-size:9px; font-weight:800; font-style:normal; }

  /* ---------- the key ----------
     Not a chart. One line that names the five streams in the order their
     bars stand in, and says how each one did this month. It is the legend
     and the scorecard in the space a legend alone used to take. */
  /* ---------- the key ----------
     A line of names and numbers is a legend. Give each one the bar its own
     score would draw and it becomes a scorecard: five meters side by side,
     and the two streams that are behind are obvious before you have read a
     single figure. It is still the legend - same colours, same order as the
     bars below - it just earns its row now. */
  .key { display:grid; grid-template-columns:repeat(auto-fit, minmax(152px, 1fr));
         gap:12px 26px; padding:13px 20px 15px; border-top:1px solid var(--line);
         background:linear-gradient(180deg,
                    color-mix(in srgb, var(--blue) 3.5%, var(--card)), var(--card)); }
  .kk { display:grid; grid-template-columns:1fr auto; align-items:center;
        gap:5px 8px; min-width:0; }
  .kk .nm { display:flex; align-items:center; gap:7px; min-width:0;
            font-size:11.5px; font-weight:700; color:var(--ink); letter-spacing:-.15px;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .kk .nm i { flex:none; width:9px; height:11px; border-radius:3px; background:var(--c); }
  .kk .sc { font-size:12px; font-weight:800; color:var(--ink); white-space:nowrap;
            font-variant-numeric:tabular-nums; letter-spacing:-.2px; }
  .kk .sc s { text-decoration:none; color:var(--muted); font-weight:700; opacity:.7; }
  .kk .bar { grid-column:1 / -1; height:5px; border-radius:3px; overflow:hidden;
             background:color-mix(in srgb, var(--c) 14%, var(--row)); }
  .kk .bar u { display:block; height:100%; text-decoration:none; border-radius:3px;
               background:var(--c);
               transition:width .55s cubic-bezier(.2,.8,.3,1); }
  /* A stream with everything in says so, in the colour of being done. */
  .kk.done .sc { color:var(--ok); }
  .kk.done .sc s { color:var(--ok); opacity:.65; }

  /* ---------- the month ---------- */
  .cal { position:relative; padding:13px 16px 16px; border-top:1px solid var(--line); }
  .dows, .grid { display:grid; grid-template-columns:repeat(7,1fr); column-gap:10px; }
  .dows { padding-bottom:9px; }
  .dows span { text-align:center; font-size:9px; font-weight:800; letter-spacing:1.3px;
               text-transform:uppercase; color:var(--muted); opacity:.55; }
  .grid { row-gap:var(--gap, 10px); }

  .cell { min-height:var(--tile, 92px); min-width:0; display:flex; flex-direction:column;
          border:1px solid var(--line); border-radius:14px; padding:9px 11px 11px;
          background:var(--card); cursor:pointer; position:relative;
          transition:box-shadow .2s ease, border-color .2s ease,
                     transform .2s cubic-bezier(.2,.7,.3,1); }
  .cell:not(.pad):hover { border-color:color-mix(in srgb, var(--blue) 40%, var(--line));
          box-shadow:0 12px 28px -12px rgba(16,24,40,.28); transform:translateY(-2px);
          z-index:2; }
  .cell.on { border-color:var(--blue); z-index:3;
             box-shadow:0 0 0 3px color-mix(in srgb, var(--blue) 14%, transparent),
                        0 12px 28px -12px rgba(16,24,40,.28); }
  .cell.pad { border:0; background:none; min-height:0; cursor:default; }

  .cell .n { display:flex; align-items:center; gap:6px; min-height:19px;
             font-size:15px; font-weight:700; color:var(--ink);
             letter-spacing:-.4px; font-variant-numeric:tabular-nums; }
  .cell .n em { font-style:normal; font-size:8px; font-weight:800; letter-spacing:.8px;
                text-transform:uppercase; color:var(--gold); }
  /* One mark, one place, two things it can say. A filled green disc with a
     tick: the day is done. A red disc with a number: that many bars below are
     empty. Same size, same slot, so a month of tiles reads as one column of
     verdicts rather than two kinds of badge. */
  .cell .n .tick, .cell .n .gap {
        margin-left:auto; flex:none; width:19px; height:19px; border-radius:50%;
        display:grid; place-items:center; font-weight:800; letter-spacing:0;
        font-variant-numeric:tabular-nums; }
  .cell .n .tick { background:var(--ok); color:#fff; font-size:10.5px;
                   box-shadow:0 1px 3px color-mix(in srgb, var(--ok) 34%, transparent); }
  .cell .n .gap { font-size:11px; color:var(--bad);
                  background:color-mix(in srgb, var(--bad) 11%, transparent);
                  box-shadow:inset 0 0 0 1.3px color-mix(in srgb, var(--bad) 28%,
                             transparent); }

  /* ---------- the five bars ---------- */
  .bars { display:flex; align-items:stretch; gap:5px; flex:1 1 auto; min-height:16px;
          margin-top:8px; }
  .bars b { flex:1; min-width:0; border-radius:5px;
            background:linear-gradient(175deg,
                       color-mix(in srgb, var(--c) 92%, #fff),
                       var(--c) 46%,
                       color-mix(in srgb, var(--c) 90%, #0B1020));
            transform-origin:bottom;
            animation:ksd-grow .36s cubic-bezier(.2,.8,.3,1) var(--in, 0ms) both; }
  /* The month draws itself, one day after another, left to right. It takes a
     third of a second and it is the difference between a chart appearing and
     a chart arriving. */
  @keyframes ksd-grow { from { transform:scaleY(.14); opacity:0; } }
  @media (prefers-reduced-motion: reduce){
    .bars b { animation:none; }
  }
  /* Missing: the bar is still there, and it is empty. */
  .bars b.off { background:color-mix(in srgb, var(--bad) 5%, transparent);
                box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--bad) 32%,
                           var(--line)); }
  /* Not due: the slot has not opened yet. */
  .bars b.wait { align-self:flex-end; height:4px; border-radius:2px;
                 background:var(--line); }

  /* The verdict, carried by the tile rather than written on it. */
  .cell.full { border-color:color-mix(in srgb, var(--ok) 32%, var(--line));
               background:linear-gradient(180deg,
                          color-mix(in srgb, var(--ok) 6%, var(--card)), var(--card)); }
  .cell.none { border-color:color-mix(in srgb, var(--bad) 22%, var(--line));
               background:linear-gradient(180deg,
                          color-mix(in srgb, var(--bad) 4%, var(--card)), var(--card)); }
  .cell.future { border-style:dashed; background:none; cursor:default; }
  .cell.future .n { color:var(--muted); font-weight:650; }
  .cell.future:hover { transform:none; box-shadow:none; border-color:var(--line); }
  .cell.today { border-color:var(--gold);
                box-shadow:0 0 0 3px color-mix(in srgb, var(--gold) 20%, transparent); }
  .cell.today .n { color:var(--gold); }

  /* Navy swallows a four-per-cent wash. Dark gets its own weights. */
  :root[data-theme="dark"] .cell.none {
      border-color:color-mix(in srgb, var(--bad) 34%, var(--line));
      background:linear-gradient(180deg,
                 color-mix(in srgb, var(--bad) 10%, var(--card)), var(--card)); }
  :root[data-theme="dark"] .cell.full {
      border-color:color-mix(in srgb, var(--ok) 38%, var(--line)); }
  :root[data-theme="dark"] .bars b.off {
      background:color-mix(in srgb, var(--bad) 7%, transparent);
      box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--bad) 42%, var(--line)); }

  /* ---------- what a day still wants ----------
     The panel names the uploads that day is missing and hands you each one:
     the card on Raw Data Upload opens with the date already filled in,
     because the day you pressed IS the date. */
  /* The panel used to be a flat list in which the four things already done
     shouted as loudly as the one thing left to do. It is the one thing left
     to do that brought you here.

     The date leads, with the verdict beside it. Below, the rows that are
     settled step back - muted, ticked, quiet - and the rows that still want
     something come forward: tinted in their stream's colour, outlined, with
     a real button on the end rather than a word in blue. And a caret points
     back at the day it is answering, so the panel belongs to that tile
     instead of floating over the month. */
  .daypop { position:absolute; z-index:40; width:320px; display:none;
            background:var(--card); border:1px solid var(--line); border-radius:15px;
            box-shadow:0 18px 44px -14px rgba(16,24,40,.30),
                       0 3px 8px rgba(16,24,40,.07); }
  .daypop.on { display:block; animation:ksd-pop .15s cubic-bezier(.2,.7,.3,1) both; }
  .daypop .tip { position:absolute; width:11px; height:11px; background:var(--card);
                 border:1px solid var(--line); transform:rotate(45deg); }
  .daypop.side-l .tip { left:-6.5px; border-top:0; border-right:0; }
  .daypop.side-r .tip { right:-6.5px; border-bottom:0; border-left:0; }

  .daypop .hd { position:relative; display:flex; align-items:center; gap:9px;
                padding:12px 38px 12px 14px; border-bottom:1px solid var(--line);
                background:var(--row); border-radius:14px 14px 0 0; }
  .daypop .dt { font-size:14.5px; font-weight:780; letter-spacing:-.35px;
                color:var(--ink); }
  .daypop .verdict { flex:none; font-size:10.5px; font-weight:750; letter-spacing:-.1px;
                     padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .daypop .verdict.want { color:var(--bad);
                          background:color-mix(in srgb, var(--bad) 11%, transparent);
                          box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--bad) 24%,
                                     transparent); }
  .daypop .verdict.ok { color:var(--ok);
                        background:color-mix(in srgb, var(--ok) 12%, transparent);
                        box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--ok) 26%,
                                   transparent); }
  .daypop .x { position:absolute; top:10px; right:9px; width:24px; height:24px;
               border:0; background:none; border-radius:8px; cursor:pointer; padding:0;
               color:var(--muted); font-size:16px; line-height:1;
               transition:background-color .14s ease, color .14s ease; }
  .daypop .x:hover { background:var(--hover); color:var(--ink); }

  .daypop .bd { padding:7px; max-height:330px; overflow:auto;
                display:flex; flex-direction:column; gap:3px; }
  .daypop .up, .daypop .st {
                display:flex; align-items:center; gap:10px; width:100%;
                border:0; background:none; font:inherit; text-align:left;
                padding:8px 10px; border-radius:10px;
                color:var(--ink); font-size:12.5px; font-weight:650; }
  .daypop .up b, .daypop .st b { flex:1 1 auto; min-width:0; font-weight:650;
                  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .daypop b u { display:block; text-decoration:none; font-size:10px; font-weight:600;
                color:var(--muted); letter-spacing:-.1px; margin-top:1px; }
  .daypop .up i, .daypop .st i { width:9px; height:13px; border-radius:3px; flex:none;
                  background:var(--c); }

  /* Still wanted: the row wears its stream's colour and ends in a button. */
  .daypop .up { cursor:pointer; padding:9px 9px 9px 10px;
                background:color-mix(in srgb, var(--c) 7%, var(--card));
                box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--c) 20%, transparent);
                transition:background-color .15s ease, box-shadow .15s ease,
                           transform .15s cubic-bezier(.2,.7,.3,1); }
  .daypop .up:hover { background:color-mix(in srgb, var(--c) 12%, var(--card));
                      box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--c) 34%,
                                 transparent); }
  .daypop .up:active { transform:scale(.99); }
  .daypop .up i { background:color-mix(in srgb, var(--c) 8%, transparent);
                  box-shadow:inset 0 0 0 1.6px color-mix(in srgb, var(--c) 55%,
                             transparent); }
  .daypop .up span { margin-left:auto; flex:none; font-size:11px; font-weight:750;
                     letter-spacing:-.1px; color:#fff; padding:4.5px 11px;
                     border-radius:8px;
                     background:color-mix(in srgb, var(--c) 84%, #0A1020);
                     box-shadow:0 1px 2px rgba(16,24,40,.16); }
  .daypop .up:hover span { filter:brightness(1.06); }

  /* Settled: quieter than the thing you came here to do. */
  .daypop .st.done { color:var(--muted); }
  .daypop .st.done b { font-weight:600; color:color-mix(in srgb, var(--ink) 72%,
                       var(--muted)); }
  .daypop .st.done i { opacity:.55; }
  .daypop .st.done span { margin-left:auto; flex:none; width:16px; height:16px;
                          border-radius:50%; display:grid; place-items:center;
                          font-size:9px; font-weight:800; color:#fff;
                          background:var(--ok); }
  .daypop .st.wait { color:var(--muted); }
  .daypop .st.wait i { background:none;
                       box-shadow:inset 0 0 0 1.6px color-mix(in srgb, var(--line) 90%,
                                  transparent); }
  .daypop .st.wait span { margin-left:auto; flex:none; font-size:10px; font-weight:700;
                          color:var(--muted); letter-spacing:.2px; }

  /* ---------- a phone ----------
     Seven columns of about fifty pixels: room for the number and five bars,
     and not for their names. The key above still has those, and the panel
     has them per day. */
  @media (max-width:760px){
    .head { padding:12px 13px 11px; gap:11px; }
    .sum .pills { margin-left:0; flex:1 1 100%; }
    .key { padding:10px 13px 12px; gap:10px 14px;
           grid-template-columns:repeat(auto-fit, minmax(118px, 1fr)); }
    .kk .nm { font-size:10px; gap:5px; }
    .kk .nm i { width:7px; height:9px; }
    .kk .sc { font-size:10.5px; }
    .kk .bar { height:4px; }
    .cal { padding:10px 9px 12px; }
    .dows, .grid { column-gap:5px; }
    .cell { padding:5px 5px 6px; border-radius:9px; }
    .cell .n { font-size:11px; gap:3px; min-height:14px; }
    .cell .n em { display:none; }
    .cell .n .tick, .cell .n .gap { width:14px; height:14px; font-size:8.5px; }
    .bars { gap:2.5px; margin-top:4px; }
    .bars b { border-radius:3px; }
    .daypop { width:calc(100vw - 30px); max-width:306px; }
    .dows span { font-size:8.5px; letter-spacing:.4px; }
  }
</style>
{% endblock %}

{% block content %}
<div class="board" id="board">
  <div class="head">
    <div class="mnav">
      <button type="button" onclick="step(-1)" aria-label="Previous month">&lsaquo;</button>
      <span class="m" id="mLabel">—</span>
      <button type="button" onclick="step(1)" aria-label="Next month">&rsaquo;</button>
    </div>
    <div class="sum" id="lede"></div>
  </div>
  <div class="key" id="key"></div>
  <div class="cal" id="cal">
    <div class="dows"><span>S</span><span>M</span><span>T</span><span>W</span
      ><span>T</span><span>F</span><span>S</span></div>
    <div class="grid" id="grid"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
/* What this screen answers: for any given day, can the reports speak for it?
   A day is covered per stream, and the gaps are the point - but a day with
   four of five is normal, not a fault, so the tile shows the shape of what
   it has rather than shouting a count at you. */
const CAL = {{ calendar | tojson }};
const MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];
const MONTHS_S = ['Jan','Feb','Mar','Apr','May','Jun',
                  'Jul','Aug','Sep','Oct','Nov','Dec'];
const iso = (y,m,d) => `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
// The browser's own calendar day, not UTC's. toISOString() converts to UTC
// first, so between midnight and 05:30 IST it returned yesterday - and the
// calendar then treated today as "not due yet", hiding a day's missing
// uploads from whoever checks first thing in the morning.
const today = (() => {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
})();
// The day a stream's raw for `key` can first exist: same day for the stock
// photograph, the morning after for anything that reports a finished day.
const dueBy = (key, s) => {
  const n = Number(s.due_after || 0);
  if (!n) return key;
  const [y,m,d] = key.split('-').map(Number);
  return new Date(Date.UTC(y, m-1, d + n)).toISOString().slice(0,10);
};
const esc = s => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };
const saidDay = key => {
  const [y, m, d] = key.split('-').map(Number);
  return `${d} ${MONTHS_S[m - 1]} ${y}`;
};
// "1 - 16 Aug", not "1 Aug to 16 Aug" - the month is the same at both ends.
const spanOf = p => {
  const A = new Date(p.from + 'T00:00'), B = new Date(p.to + 'T00:00');
  const mon = d => MONTHS_S[d.getMonth()];
  return A.getMonth() === B.getMonth() && A.getFullYear() === B.getFullYear()
    ? `${A.getDate()}–${B.getDate()} ${mon(B)}`
    : `${A.getDate()} ${mon(A)} – ${B.getDate()} ${mon(B)}`;
};

let month = (CAL.span.last || today).slice(0,7);

function step(n){
  let [y,m] = month.split('-').map(Number);
  m += n; if (m < 1){ m = 12; y--; } if (m > 12){ m = 1; y++; }
  month = `${y}-${String(m).padStart(2,'0')}`;
  draw();
}

function draw(){
  shutDay();
  const [y,m] = month.split('-').map(Number);
  const S = CAL.streams;
  mLabel.innerHTML = `${MONTHS[m-1]} ${y}`;

  const first = new Date(y, m-1, 1).getDay();
  const last  = new Date(y, m, 0).getDate();
  let html = '';
  for (let i = 0; i < first; i++) html += '<div class="cell pad"></div>';

  const tally = {}, dueDays = {};
  S.forEach(s => { tally[s.key] = 0; dueDays[s.key] = 0; });
  let full = 0, part = 0, blank = 0, elapsed = 0;

  for (let d = 1; d <= last; d++){
    const key = iso(y, m, d);
    const have = CAL.days[key] || [];
    // Four of these report what happened during the day, so they cannot
    // exist until it is over. Stock is a photograph and arrives the same
    // day. A stream that is not due yet is not missing.
    const due     = S.filter(s => dueBy(key, s) <= today);
    const missing = due.filter(s => !have.includes(s.key));
    const nothingDue = !due.length;

    if (!nothingDue){
      elapsed++;
      due.forEach(s => dueDays[s.key]++);
      if (!have.length) blank++;
      else if (missing.length) part++;
      else full++;
      have.forEach(k => tally[k] = (tally[k] || 0) + 1);
    }

    const done = !nothingDue && have.length && !missing.length;
    const cls = ['cell', nothingDue ? 'future'
                       : (have.length ? (missing.length ? '' : 'full') : 'none'),
                 key === today ? 'today' : ''].filter(Boolean).join(' ');

    // Five bars, always five, always in the key's order. A filled bar is a
    // file that is in; an empty one is a file that is missing; a stub is one
    // that is not due yet. No words - the key above names them once, and
    // pressing the tile names them again for that day.
    const bars = S.map(s => {
      const got = have.includes(s.key);
      const wait = !got && dueBy(key, s) > today;
      return `<b class="${got ? '' : wait ? 'wait' : 'off'}"
                 style="--c:${esc(s.colour)}"></b>`;
    }).join('');

    html += `<div class="${cls}" data-day="${key}" style="--in:${
          Math.min(d, 26) * 10}ms">
        <div class="n">${d}${key === today ? '<em>today</em>' : ''}${
          done ? '<span class="tick">✓</span>'
               : missing.length
                 ? `<span class="gap">${missing.length}</span>` : ''}</div>
        <div class="bars">${bars}</div>
      </div>`;
  }
  grid.innerHTML = html;

  // What the month asked for, and what it got - counted over every stream on
  // every day it was due, which is the only figure on this screen that can be
  // believed on its own.
  // A raw can arrive before it is due - today's shop daily, uploaded this
  // evening rather than tomorrow morning - and then a stream has more days in
  // than were asked of it. Counting those against the days due gave "20/19",
  // which reads as a fault in the arithmetic rather than as being early. The
  // denominator is whichever is larger, so a day that came early counts as a
  // day answered instead of as an overflow.
  const asked = s => Math.max(dueDays[s.key] || 0, tally[s.key] || 0);
  const wanted = S.reduce((n, s) => n + asked(s), 0);
  const inAll  = S.reduce((n, s) => n + (tally[s.key] || 0), 0);
  const gaps = wanted - inAll;
  lede.innerHTML = `<span class="pills">${gaps
    ? `<span class="pill gap"><i></i><b>${gaps}</b> ${
        gaps === 1 ? 'gap' : 'gaps'}</span>`
    : `<span class="pill all"><i>\u2713</i>Nothing outstanding</span>`}</span>`;

  // The key. Fixed order, never re-sorted - it is what the bars below mean,
  // and a colour learnt here has to still be in the same place down there.
  key.innerHTML = S.map(s => {
    const n = tally[s.key] || 0, of = asked(s);
    const pct = of ? Math.min(100, Math.round(n / of * 100)) : 0;
    return `<div class="kk${of && n >= of ? ' done' : ''}" style="--c:${esc(s.colour)}"
                 title="${esc(s.label)}: ${n} of ${of} days due">
        <span class="nm"><i></i>${esc(s.tiny || s.short)}</span>
        <span class="sc">${n}<s>/${of}</s></span>
        <span class="bar"><u style="width:${pct}%"></u></span>
      </div>`;
  }).join('');

  fit(Math.ceil((first + last) / 7));
}

/* A month is five rows or six, and a screen is whatever the screen is. A
   fixed tile height has to be short enough for the worst case, which leaves
   a band of empty page on every other one. Measure instead: shrink to the
   floor, ask the page how much room it did not use, and hand it back - to
   the tiles first, and once a day is as tall as a day should be, to the
   space between the weeks. */
const MIN_TILE = 62, MAX_TILE = 132, MIN_GAP = 9, MAX_GAP = 18;
function fit(rows){
  grid.style.setProperty('--tile', MIN_TILE + 'px');
  grid.style.setProperty('--gap', MIN_GAP + 'px');
  let slack = window.innerHeight
            - (board.getBoundingClientRect().bottom + window.scrollY) - 18;
  const h = Math.max(MIN_TILE,
            Math.min(MAX_TILE, MIN_TILE + Math.floor(slack / rows)));
  grid.style.setProperty('--tile', h + 'px');
  slack -= (h - MIN_TILE) * rows;
  const g = Math.max(MIN_GAP,
            Math.min(MAX_GAP, MIN_GAP + Math.floor(slack / rows)));
  grid.style.setProperty('--gap', g + 'px');
}

/* ---------- the day panel ----------
   What this day still wants, and the way to give it to it. Each row opens
   Raw Data Upload with that card already open and this date already in the
   box, so a gap you spotted is a gap you can close without first working out
   which tile to press and typing the date back in by hand. */
const pop = document.createElement('div');
pop.className = 'daypop';
cal.appendChild(pop);
let popFor = null;

function openDay(cell){
  const key = cell.dataset.day;
  if (!key) return;
  popFor = key;

  const S = CAL.streams;
  const have = CAL.days[key] || [];
  const due = S.filter(s => dueBy(key, s) <= today);
  if (!due.length){ shutDay(); return; }
  const missing = due.filter(s => !have.includes(s.key));
  // The pull taken on this day, named by the window it covers - "1 - 12 Aug"
  // says both that you took it and how far back it reaches.
  const pull = (CAL.periods || []).find(p => p.to === key);

  // The colour goes on the ROW, so the tint, the outline and the button can
  // all be mixed from it - not on the dot, where only the dot could use it.
  const rows = S.map(s => {
    const c = ` style="--c:${esc(s.colour)}"`;
    if (have.includes(s.key)){
      const note = s.key === 'shop_cumulative' && pull
        ? `<u>${esc(spanOf(pull))} pull</u>` : '';
      return `<div class="st done"${c}><i></i><b>${esc(s.label)}${note}</b>` +
             `<span>✓</span></div>`;
    }
    if (dueBy(key, s) > today)
      return `<div class="st wait"${c}><i></i><b>${esc(s.label)}</b>` +
             `<span>not due</span></div>`;
    return `<button type="button" class="up"${c} data-stream="${esc(s.card || s.key)}">` +
           `<i></i><b>${esc(s.label)}</b><span>Upload</span></button>`;
  }).join('');

  pop.innerHTML =
    `<span class="tip"></span>` +
    `<div class="hd"><span class="dt">${esc(saidDay(key))}</span>` +
      (missing.length
        ? `<span class="verdict want">${missing.length} still wanted</span>`
        : `<span class="verdict ok">All in</span>`) +
     `<button type="button" class="x" aria-label="Close">×</button></div>` +
    `<div class="bd">${rows}</div>`;

  // Placed against the grid, and flipped when it would run off the right.
  const box = cell.getBoundingClientRect();
  const host = cal.getBoundingClientRect();
  const w = 320, gap = 11;
  let right = true;
  let left = box.left - host.left + box.width + gap;
  if (left + w > host.width - 4){ left = box.left - host.left - w - gap; right = false; }
  if (left < 4){ left = Math.max(4, box.left - host.left); right = true; }
  pop.classList.toggle('side-l', right);
  pop.classList.toggle('side-r', !right);
  pop.style.left = Math.round(left) + 'px';
  let top = box.top - host.top;
  pop.style.top = Math.round(top) + 'px';
  pop.classList.add('on');

  // Keep it on screen: if the panel would hang below the fold, lift it.
  const over = pop.getBoundingClientRect().bottom - (window.innerHeight - 8);
  if (over > 0){ top -= over; pop.style.top = Math.round(top) + 'px'; }

  // The caret tracks the tile however far the panel has had to move.
  const h = pop.getBoundingClientRect().height;
  const at = (box.top - host.top) + box.height / 2 - top;
  // Kept clear of the header band so the caret is always card-white.
  pop.querySelector('.tip').style.top =
    Math.round(Math.max(56, Math.min(h - 26, at - 5.5))) + 'px';
}

function shutDay(){
  pop.classList.remove('on');
  popFor = null;
  grid.querySelectorAll('.cell.on').forEach(c => c.classList.remove('on'));
}

/* Click, not hover. A panel that appears because the pointer crossed a tile
   on its way somewhere else is one you did not ask for, and one you have to
   escape before you can read the tile behind it. Pressing a day is a
   decision; the ring says which day is being answered, and pressing it again
   puts it away. */
grid.addEventListener('click', e => {
  const cell = e.target.closest('.cell');
  if (!cell || cell.classList.contains('pad') || cell.classList.contains('future')){
    shutDay(); return;
  }
  const open = popFor === cell.dataset.day && pop.classList.contains('on');
  shutDay();
  if (open) return;
  cell.classList.add('on');
  openDay(cell);
});
pop.addEventListener('click', e => {
  if (e.target.closest('.x')){ shutDay(); return; }
  const btn = e.target.closest('.up');
  if (!btn || !popFor) return;
  location.href = '/?upload=' + encodeURIComponent(btn.dataset.stream) +
                  '&date=' + encodeURIComponent(popFor);
});
document.addEventListener('click', e => {
  if (!pop.classList.contains('on')) return;
  if (e.target.closest('#grid') || e.target.closest('.daypop')) return;
  shutDay();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') shutDay(); });
let fitTimer = null;
window.addEventListener('resize', () => {
  shutDay();
  clearTimeout(fitTimer);
  fitTimer = setTimeout(draw, 90);
});

draw();
</script>
{% endblock %}
