  }
  buildMixScopeControls();

  // BRAND × PACK heat matrix (latest snapshot, from skuDetail).
  // Restyled 9 Jul 2026 PM: rounded tiles, dark→cyan→gold ramp (sqrt-scaled so
  // mid values stay readable), row/column TOTALs, dim uniform zero cells.
  const mx = document.getElementById('bpMatrix');
  const det = PAYLOAD.skuDetail;
  if (mx) {
    if (det && det.byWarehouse) {
      // EXACT Total-Liquidation heat recipe (22 Jul 2026): the shared
      // hand-picked 7-stop cyan-teal palette — constant hue, climbing
      // saturation, topping out dark enough that white text always reads.
      const KSD_BLUES = ['#0C1E2A','#0F3245','#124760','#155C7C','#177298','#1A88B4','#1E9ECF'];
      const agg = new Map(); const packSet = new Set();
      Object.keys(det.byWarehouse).forEach(w => {
        if (whSet && !whSet.has(w)) return;
        det.byWarehouse[w].forEach(x => {
          packSet.add(x[1]);
          if (!agg.has(x[0])) agg.set(x[0], new Map());
          const m = agg.get(x[0]);
          m.set(x[1], (m.get(x[1]) || 0) + x[2]);
        });
      });
      const packs = Array.from(packSet).sort((a, b) => packMl(a) - packMl(b));
      const brandOrder = B.items.map(x => x.key).filter(b => agg.has(b));
      agg.forEach((_, b) => { if (!brandOrder.includes(b)) brandOrder.push(b); });
      let maxCell = 0, grand = 0;
      const colTot = {};
      agg.forEach(m => m.forEach((v, pk) => {
        if (v > maxCell) maxCell = v;
        grand += v;
        colTot[pk] = (colTot[pk] || 0) + v;
      }));
      // QUANTILE bins, exactly like the liquidation heatmap: the values are
      // heavily skewed, so a linear/sqrt ramp buries most cells in the darkest
      // shades — quantiles give each shade a similar number of cells.
      const heatVals = [];
      agg.forEach(m => m.forEach(v => { if (v > 0.5) heatVals.push(v); }));
      heatVals.sort((a, b) => a - b);
      const heatCuts = [];
      for (let qi = 1; qi < KSD_BLUES.length; qi++)
        heatCuts.push(heatVals[Math.floor(qi / KSD_BLUES.length * heatVals.length)]);
      const heatColor = v => {
        let s = 0; while (s < heatCuts.length && v >= heatCuts[s]) s++;
        return KSD_BLUES[Math.max(0, Math.min(KSD_BLUES.length - 1, s))];
      };
      let out = '<table class="heat-tbl"><thead><tr><th></th>'
        + packs.map(pk => '<th>' + pk.replace(/\s*ML$/i, '') + '<small> ml</small></th>').join('')
        + '<th class="htoth">Total</th></tr></thead><tbody>';
      brandOrder.forEach(b => {
        let rowTot = 0;
        const cells = packs.map(pk => {
          const v = (agg.get(b) && agg.get(b).get(pk)) || 0;
          rowTot += v;
          if (v < 0.5) return '<td class="hz">–</td>';
          return '<td style="background:' + heatColor(v) + '" title="'
            + brandShort(b) + ' ' + pk + ' · ' + fmt(v) + ' cs · ' + pct(v / (grand || 1) * 100)
            + ' of ' + scopeNm + '">' + (v >= 10 ? fmt(v) : fmt1(v)) + '</td>';
        }).join('');
        out += '<tr><td class="hb">' + brandShort(b) + '</td>' + cells
          + '<td class="htot">' + fmt(rowTot) + '</td></tr>';
      });
      out += '<tr><td class="hb" style="color:#FFD86B">TOTAL</td>'
        + packs.map(pk => '<td class="htot">' + fmt(colTot[pk] || 0) + '</td>').join('')
        + '<td class="hgrand">' + fmt(grand) + '</td></tr>';
      out += '</tbody></table>';
      mx.innerHTML = brandOrder.length ? out
        : '<div class="empty-note">No stock at ' + scopeNm + ' in the latest snapshot.</div>';
    } else {
      mx.innerHTML = '<div class="empty-note">Pack matrix starts with the next stock upload.</div>';
    }
  }
}

// ---- Warehouse Daily Sales (24 Jul 2026) — the liquidation daily trend,
// ported: royal-blue tube bars (network dispatches/day by Inv/GTN date),
// painted totals + ★ BEST + DRY DAY, gold Sunday wash, gold cumulative
// pace line vs prior-month dashed on the right axis, pill end-labels, and a
// Daily | Cumulative race toggle. Data: PAYLOAD.dailyDispatch (exact
// per-date COMBINED dispRows()ATCHES sums — never the windowed inbound 'out').
let wdsChart = null, wdsMode = 'daily';
function renderWds() {
  const panel = document.getElementById('wdsPanel');
  if (!panel) return;
  const DD = PAYLOAD.dailyDispatch;
  if (!DD || !DD.cur || !DD.cur.days || !Object.keys(DD.cur.days).length) {
    // It used to remove itself, which reads exactly like a panel that was
    // never built. This one says what is missing.
    const chips = panel.querySelector('#wdsChips');
    const mix = panel.querySelector('#wdsMix');
    const wrap = panel.querySelector('.wds-wrap');
    const seg = panel.querySelector('#wdsSeg');
    if (mix) mix.innerHTML = '';
    if (wrap) wrap.style.display = 'none';
    if (seg) seg.style.display = 'none';
    if (chips) chips.innerHTML =
      '<div style="padding:18px 2px 8px;color:#7E90AE;font-size:12px;line-height:1.6">'
      + '<b style="color:#F3D08A">No Secondary Sales export has been uploaded for this month.</b><br>'
      + 'Every sales figure on this page comes from those invoices, so until one is '
      + 'uploaded there is no month-to-date sales figure to show \u2014 the tiles above read '
      + '\u201cnot uploaded\u201d rather than nought. The stock figures are unaffected.</div>';
    return;
  }
  const cur = DD.cur, pri = DD.pri || null;
  // The same window every other panel uses: the last day an upload ANSWERS
  // for, not the last day something moved. Taking the last day with a figure
  // shortened the month whenever it ended quietly, and this panel then
  // labelled itself "August 1-29" beside a header tile reading "Aug 1-30".
  const lastDay = ddLastDay(cur);
  const days = []; for (let d = 1; d <= lastDay; d++) days.push(d);
  // A day nobody uploaded is NOT a day nothing moved. Both used to draw as a
  // bare zero column, so eight missing August exports looked exactly like
  // eight dry days - and they sat in the per-day divisor as if they were.
  const covSet = new Set(cur.covered || []);
  const known = d => !cur.covered || covSet.has(d);
  const daily = days.map(d => Math.round((cur.days[String(d)] || 0) * 100) / 100);
  const gapDays = days.filter(d => !known(d));
  // channel split (24 Jul 2026, Abhay: "mix of KSBC and Cfed, just like the
  // liquidation artifact") — royal-blue KSBC + champagne CFD/BAR stack
  const haveSplit = !!(cur.ksbc && cur.inv);
  const kArr = haveSplit ? days.map(d => Math.round((cur.ksbc[String(d)] || 0) * 100) / 100) : daily;
  const iArr = haveSplit ? days.map(d => Math.round((cur.inv[String(d)] || 0) * 100) / 100) : days.map(() => 0);
  const cum = a => { let s = 0; return a.map(v => { s += v; return Math.round(s * 100) / 100; }); };
  const cumC = cum(daily);
  const priCov = pri ? new Set(pri.covered || []) : null;
  const priWhole = !!(pri && days.every(d => !priCov || !pri.covered || priCov.has(d)));
  const curWhole = gapDays.length === 0;
  const priDaily = pri && pri.days ? days.map(d => Math.round((pri.days[String(d)] || 0) * 100) / 100) : null;
  const priCum = priDaily ? cum(priDaily) : null;
  const monN = cur.m.charAt(0) + cur.m.slice(1).toLowerCase();
  const mo3 = monN.slice(0, 3);
  const pri3 = pri ? (pri.m.charAt(0) + pri.m.slice(1).toLowerCase()).slice(0, 3) : '';
  const wdOf = d => new Date(cur.y, cur.mi - 1, d).getDay();
  const WD3 = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const WDU = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];

  const mtd = cumC[cumC.length - 1] || 0;
  // Days something actually moved. This used to be the day of the month less
  // one for a dry 1st, which counted every Sunday and every holiday as a
  // trading day and so understated cs/day by about a day in seven. A day with
  // no upload behind it is not a trading day either - it is a day we cannot
  // speak for - so it stays out of the divisor and out of the best-day race.
  const tradeDays = Math.max(1, days.filter((d, i) => known(d) && daily[i] > 0.01).length);
  let bi = 0; days.forEach((d, i) => { if (known(d) && daily[i] > daily[bi]) bi = i; });
  const priPace = priCum ? priCum[priCum.length - 1] : null;
  const dPace = priPace != null ? Math.round((mtd - priPace) * 100) / 100 : null;
  const chips = document.getElementById('wdsChips');
  if (chips) chips.innerHTML =
      '<span class="wds-chip" style="--tc:#FFD86B"><i class="dt"></i><em>MTD dispatched</em><b>' + fmt(mtd) + '</b><u>cs · ' + monN + ' 1–' + lastDay
        + (curWhole ? '' : ' · ' + (lastDay - gapDays.length) + ' of ' + lastDay + ' days uploaded') + '</u></span>'
    + '<span class="wds-chip" style="--tc:#60A5FA"><i class="dt"></i><em>Avg / day</em><b>' + fmt(Math.round(mtd / tradeDays)) + '</b><u>cs · ' + tradeDays + ' trading days</u></span>'
    + '<span class="wds-chip" style="--tc:#FFD700"><i class="dt"></i><em>Best day ★</em><b>' + fmt(daily[bi]) + '</b><u>' + mo3 + ' ' + days[bi] + ' · ' + WD3[wdOf(days[bi])] + '</u></span>'
    // A month-on-month move is drawn only where the app holds BOTH windows
    // whole. It used to print "+5,987 cs" against a prior month that had never
    // been uploaded - an absent month read as a zero baseline and a record rise.
    + (dPace == null ? ''
      : (curWhole && priWhole)
        ? '<span class="wds-chip ' + (dPace >= 0 ? 'pos' : 'neg') + '" style="--tc:' + (dPace >= 0 ? '#43C08A' : '#E06A62') + '"><i class="dt"></i><em>vs ' + pri3 + ' 1–' + lastDay + '</em><b>'
          + (dPace >= 0 ? '▲ +' : '▼ −') + fmt(Math.abs(dPace)) + '</b><u>cs'
          + (priPace ? ' · ' + (dPace >= 0 ? '+' : '−') + Math.abs(dPace / priPace * 100).toFixed(1) + '%' : '') + '</u></span>'
        : '<span class="wds-chip" style="--tc:#7E90AE"><i class="dt"></i><em>vs ' + pri3 + ' 1–' + lastDay + '</em><b>—</b><u>'
          + (curWhole ? pri3 + ' part-uploaded' : 'this month part-uploaded') + '</u></span>');

  // channel-mix ribbon: the month's KSBC / invoice split with each leg's own
  // pace against the same window last month (24 Jul 2026)
  const mixEl = document.getElementById('wdsMix');
  if (mixEl) {
    if (!haveSplit) { mixEl.style.display = 'none'; }
    else {
      const kT = kArr.reduce((a, b) => a + b, 0), iT = iArr.reduce((a, b) => a + b, 0);
      const tot = Math.max(1, kT + iT);
      const pk = kT / tot * 100;
      const legPri = (which) => {
        if (!pri || !pri[which]) return null;
        return Object.keys(pri[which]).reduce((a, k) => a + (Number(k) <= lastDay ? pri[which][k] : 0), 0);
      };
      // the same rule as the chips above: no percentage unless the app holds
      // both windows whole
      const dOf = (cur, prv) => (prv == null || prv <= 0 || !(curWhole && priWhole)) ? ''
        : ' <s>' + (cur - prv >= 0 ? '▲ +' : '▼ −') + Math.abs((cur / prv - 1) * 100).toFixed(0) + '% vs ' + pri3 + '</s>';
      mixEl.innerHTML =
          '<span class="lg k"><b>' + fmt(kT) + '</b> KSBC · ' + pk.toFixed(0) + '%' + dOf(kT, legPri('ksbc')) + '</span>'
        + '<span class="bar"><i class="k" style="width:' + pk.toFixed(1) + '%"></i>'
        + '<i class="v" style="width:' + (100 - pk).toFixed(1) + '%"></i></span>'
        + '<span class="lg v"><b>' + fmt(iT) + '</b> invoice · ' + (100 - pk).toFixed(0) + '%' + dOf(iT, legPri('inv')) + '</span>';
    }
  }

  const cv = document.getElementById('wdsChart');
  if (!cv) return;
  const ctxW = cv.getContext('2d');
  const grad2 = stops => { const g = ctxW.createLinearGradient(0, 0, 0, 300);
    stops.forEach(s => g.addColorStop(s[0], s[1])); return g; };

  const gapBand = { id: 'wdsGap', beforeDatasetsDraw(ch) {
    const xs = ch.scales.x, a = ch.chartArea; if (!xs || !a || !gapDays.length) return;
    const bw = (a.right - a.left) / Math.max(1, days.length);
    ch.ctx.save();
    days.forEach((d, i) => { if (known(d)) return;
      const x = xs.getPixelForValue(i) - bw / 2;
      ch.ctx.fillStyle = 'rgba(240,198,116,.06)';
      ch.ctx.fillRect(x, a.top, bw, a.bottom - a.top); });
    ch.ctx.restore(); } };

  const sundayBand = { id: 'wdsSunday', beforeDatasetsDraw(ch) {
    const xs = ch.scales.x, a = ch.chartArea; if (!xs || !a) return;
    const bw = (a.right - a.left) / Math.max(1, days.length);
    ch.ctx.save();
    days.forEach((d, i) => { if (wdOf(d) !== 0) return;
      const x = xs.getPixelForValue(i) - bw / 2;
      ch.ctx.fillStyle = 'rgba(255,215,0,.025)';
      ch.ctx.fillRect(x, a.top, bw, a.bottom - a.top);
      ch.ctx.fillStyle = 'rgba(255,215,0,.45)';
      ch.ctx.fillRect(x + bw * 0.2, a.bottom - 2.5, bw * 0.6, 2.5); });
    ch.ctx.restore(); } };

  // average-per-day reference rule — reads the shape against the month's pace
  const avgRule = { id: 'wdsAvgRule', beforeDatasetsDraw(ch) {
    if (wdsMode === 'cum') return;
    const ys = ch.scales.y, a = ch.chartArea; if (!ys || !a) return;
    const avgV = mtd / Math.max(1, tradeDays);
    const y = ys.getPixelForValue(avgV);
    if (!(y > a.top && y < a.bottom)) return;
    const ctx = ch.ctx; ctx.save();
    ctx.setLineDash([5, 6]); ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(147,165,196,.34)';
    ctx.beginPath(); ctx.moveTo(a.left, y); ctx.lineTo(a.right, y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = '800 8.6px -apple-system,sans-serif';
    ctx.fillStyle = 'rgba(160,178,207,.75)'; ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';
    ctx.fillText('AVG ' + fmt(Math.round(avgV)), a.left + 4, y - 3);
    ctx.restore(); } };

  const barTotals = { id: 'wdsTotals', afterDatasetsDraw(ch) {
    if (wdsMode === 'cum') return;
    const xs = ch.scales.x, ys = ch.scales.y, ctx = ch.ctx;
    const best = Math.max.apply(null, daily.concat([0]));
    const fs = days.length > 24 ? 8.5 : days.length > 18 ? 9.5 : 10.5;
    ctx.save(); ctx.textAlign = 'center';
    daily.forEach((v, i) => {
      if (v <= 0.01) {
        // "no export uploaded" and "nothing moved" are different statements
        // and used to draw as the same empty column.
        if (!known(days[i])) { ctx.font = '700 8px -apple-system,sans-serif';
          ctx.fillStyle = 'rgba(240,198,116,.8)';
          ctx.fillText('NO DATA', xs.getPixelForValue(i), ys.getPixelForValue(0) - 9);
          return; }
        if (days[i] === 1) { ctx.font = '700 8px -apple-system,sans-serif';
          ctx.fillStyle = 'rgba(126,144,173,.6)';
          ctx.fillText('DRY DAY', xs.getPixelForValue(i), ys.getPixelForValue(0) - 9); }
        return; }
      const x = xs.getPixelForValue(i), y = ys.getPixelForValue(v);
      const yTxt = Math.max(y - 8, ch.chartArea.top + 14);
      ctx.shadowColor = 'rgba(5,9,20,.85)'; ctx.shadowBlur = 6;
      ctx.font = '700 ' + fs + 'px -apple-system,sans-serif';
      ctx.fillStyle = v === best ? '#FFD700' : 'rgba(208,222,242,.95)';
      ctx.fillText(fmt(v), x, yTxt);
      if (v === best && v > 0) { ctx.font = '800 8px -apple-system,sans-serif';
        ctx.fillText('★ BEST', x, yTxt - 12); }
      ctx.shadowBlur = 0; });
    ctx.restore(); } };

  const endLabels = { id: 'wdsEnds', afterDatasetsDraw(ch) {
    const ctx = ch.ctx;
    ch.data.datasets.forEach((ds, di) => {
      if (!ds._endLabel || !ch.isDatasetVisible(di)) return;
      const pts = ch.getDatasetMeta(di).data; if (!pts || !pts.length) return;
      const p = pts[pts.length - 1]; if (!p) return;
      ctx.save(); ctx.shadowColor = ds._endColor || '#fff'; ctx.shadowBlur = 10;
      ctx.fillStyle = ds._endColor || '#fff';
      ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0; ctx.fillStyle = '#0B0F1E';
      ctx.beginPath(); ctx.arc(p.x, p.y, 1.6, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      ctx.save();
      ctx.font = '800 10.5px -apple-system,sans-serif';
      const txt = ds._endLabel, tw = ctx.measureText(txt).width;
      const rh = 18, rw = tw + 14, r = 9;
      const rx = p.x - 9 - rw;
      let ry = p.y + (ds._endBelow ? 10 : -10 - rh);
      ry = Math.max(ry, ch.chartArea.top - 26);
      ctx.fillStyle = 'rgba(9,14,28,.88)';
      ctx.beginPath();
      ctx.moveTo(rx + r, ry);
      ctx.arcTo(rx + rw, ry, rx + rw, ry + rh, r); ctx.arcTo(rx + rw, ry + rh, rx, ry + rh, r);
      ctx.arcTo(rx, ry + rh, rx, ry, r); ctx.arcTo(rx, ry, rx + rw, ry, r);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = .55; ctx.strokeStyle = ds._endColor || '#fff'; ctx.lineWidth = 1; ctx.stroke();
      ctx.globalAlpha = 1; ctx.fillStyle = ds._endColor || '#fff';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(txt, rx + rw / 2, ry + rh / 2 + 0.5);
      ctx.restore();
    }); } };

  const lineGlow = { id: 'wdsLineGlow',
    beforeDatasetDraw(ch, args) { const ds = ch.data.datasets[args.index];
      if (ds && ds.type === 'line' && ds._glow) { ch.ctx.save(); ch.ctx.shadowColor = ds._glow; ch.ctx.shadowBlur = 9; } },
    afterDatasetDraw(ch, args) { const ds = ch.data.datasets[args.index];
      if (ds && ds.type === 'line' && ds._glow) { ch.ctx.restore(); } } };

  const topCap = { id: 'wdsTopCap', afterDatasetsDraw(ch) {
    if (wdsMode === 'cum') return;
    const ctx = ch.ctx, ys = ch.scales.y;
    ctx.save();
    days.forEach((d, i) => {
      const v = daily[i]; if (v <= 0.01) return;
      const meta = ch.getDatasetMeta(haveSplit && iArr[i] > 0.01 ? 1 : 0);
      const bar = meta.data[i]; if (!bar) return;
      const y = ys.getPixelForValue(v);
      const capCol = (haveSplit && iArr[i] > 0.01) ? '#F1DA9E' : '#93C5FD';
      ctx.shadowColor = capCol; ctx.shadowBlur = 6;
      ctx.fillStyle = capCol;
      if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bar.x - bar.width / 2, y - 1.25, bar.width, 2.5, 2); ctx.fill(); }
      else ctx.fillRect(bar.x - bar.width / 2, y - 1.25, bar.width, 2.5);
    });
    ctx.restore(); } };

  const barGlow = { id: 'wdsBarGlow',
    beforeDatasetDraw(ch, args) { const ds = ch.data.datasets[args.index];
      if (ds && ds.type === 'bar' && ds._glowCol) { ch.ctx.save(); ch.ctx.shadowColor = ds._glowCol;
        ch.ctx.shadowBlur = 10; ch.ctx.shadowOffsetY = 2; } },
    afterDatasetDraw(ch, args) { const ds = ch.data.datasets[args.index];
      if (ds && ds.type === 'bar' && ds._glowCol) { ch.ctx.restore(); } } };

  const hoverGlow = { id: 'wdsHoverGlow', beforeDatasetsDraw(ch) {
    const act = ch.tooltip && ch.tooltip.getActiveElements ? ch.tooltip.getActiveElements() : [];
    if (!act.length) return;
    const i = act[0].index, xs = ch.scales.x, a = ch.chartArea;
    const bw = (a.right - a.left) / Math.max(1, days.length);
    const x = xs.getPixelForValue(i);
    const g = ch.ctx.createLinearGradient(0, a.top, 0, a.bottom);
    g.addColorStop(0, 'rgba(148,197,255,.10)'); g.addColorStop(1, 'rgba(148,197,255,.015)');
    ch.ctx.save(); ch.ctx.fillStyle = g;
    ch.ctx.fillRect(x - bw / 2, a.top, bw, a.bottom - a.top);
    ch.ctx.restore(); } };

  const hovOut = c => {
    const el = document.getElementById('wdsHov'); if (!el) return;
    const tt = c.tooltip;
    if (!tt || !tt.opacity || !tt.dataPoints || !tt.dataPoints.length) { el.innerHTML = ''; return; }
    const i = tt.dataPoints[0].dataIndex, dnum = days[i];
    const head = '<span class="rd-h">' + WD3[wdOf(dnum)] + ', ' + mo3 + ' ' + dnum + '</span>';
    if (wdsMode === 'cum') {
      const cu = cumC[i] || 0, pr = priCum ? (priCum[i] || 0) : null;
      el.innerHTML = head
        + '<span class="rd-s"><i class="dot" style="--c:#FFD86B"></i><em>' + mo3 + '</em><b>' + fmt(cu) + '</b><u>cs</u></span>'
        + (pr == null ? '' : '<span class="rd-s"><i class="dot" style="--c:#93A6C4"></i><em>' + pri3 + '</em><b>' + fmt(pr) + '</b><u>cs</u></span>'
          + '<span class="rd-s"><em>gap</em><b style="color:' + (cu - pr >= 0 ? '#7BD8AA' : '#F09A93') + '">' + (cu - pr >= 0 ? '+' : '−') + fmt(Math.abs(cu - pr)) + '</b></span>');
      return;
    }
    const t = daily[i] || 0;
    if (t <= 0.01) { el.innerHTML = head + '<span class="rd-s"><em>dry day — no dispatches</em></span>'; return; }
    let out = head
      + (haveSplit
        ? '<span class="rd-s"><i class="dot" style="--c:#60A5FA"></i><em>KSBC</em><b>' + fmt(kArr[i]) + '</b></span>'
          + '<span class="rd-s"><i class="dot" style="--c:#D9B45B"></i><em>Invoice</em><b>' + fmt(iArr[i]) + '</b></span>'
          + '<span class="rd-s"><em>Total</em><b>' + fmt(t) + '</b><u>cs</u></span>'
        : '<span class="rd-s"><i class="dot" style="--c:#60A5FA"></i><em>dispatched</em><b>' + fmt(t) + '</b><u>cs</u></span>')
      + '<span class="rd-s"><i class="dot" style="--c:#FFD86B"></i><em>cum</em><b>' + fmt(cumC[i] || 0) + '</b><u>cs</u></span>';
    if (priDaily && priDaily[i] != null && priCum) {
      const dd = t - priDaily[i];
      out += '<span class="rd-s"><em>vs ' + pri3 + ' ' + dnum + '</em><b style="color:' + (dd >= 0 ? '#7BD8AA' : '#F09A93') + '">' + (dd >= 0 ? '+' : '−') + fmt(Math.abs(dd)) + '</b></span>';
    }
    el.innerHTML = out;
  };

  const drawWds = () => {
    if (wdsChart) { try { wdsChart.destroy(); } catch (e) {} }
    const cumMode = wdsMode === 'cum';
    let datasets;
    if (cumMode) {
      const goldFill = ctxW.createLinearGradient(0, 0, 0, 300);
      goldFill.addColorStop(0, 'rgba(255,216,107,.26)'); goldFill.addColorStop(1, 'rgba(255,216,107,.02)');
      datasets = [
        { type: 'line', label: monN + ' cumulative', data: cumC,
          borderColor: '#FFD86B', borderWidth: 3, tension: .35, pointRadius: 0, pointHoverRadius: 5,
          borderCapStyle: 'round', borderJoinStyle: 'round', fill: true, backgroundColor: goldFill,
          _glow: 'rgba(255,216,107,.45)',
          _endLabel: fmt(mtd) + ' cs', _endColor: '#FFD86B' }
      ].concat(priCum ? [
        { type: 'line', label: pri3 + ' 1–' + lastDay + ' cum.', data: priCum,
          borderColor: '#93A6C4', borderDash: [6, 5], borderWidth: 1.8, tension: .35, pointRadius: 0,
          pointHoverRadius: 4, fill: false,
          _endLabel: pri3 + ' ' + fmt(priPace || 0), _endColor: '#9FB0CC', _endBelow: true }
      ] : []);
    } else {
      const kBar = { type: 'bar', label: haveSplit ? 'KSBC dispatch' : 'Dispatched / day', data: kArr,
          backgroundColor: grad2([[0, '#60A5FA'], [0.55, '#3B82F6'], [1, 'rgba(29,78,216,.82)']]),
          _glowCol: 'rgba(96,165,250,.25)', stack: 's',
          borderWidth: 0, borderSkipped: false,
          borderRadius: c => (!haveSplit || iArr[c.dataIndex] <= 0.01) ? { topLeft: 8, topRight: 8 } : 0,
          maxBarThickness: 58, barPercentage: .68, categoryPercentage: .8 };
      const iBar = { type: 'bar', label: 'CFD + BAR invoice', data: iArr,
          backgroundColor: grad2([[0, '#F5E3B3'], [0.5, '#D9B45B'], [1, 'rgba(166,124,46,.85)']]),
          _glowCol: 'rgba(217,180,91,.24)', stack: 's',
          borderWidth: 0, borderSkipped: false, borderRadius: { topLeft: 8, topRight: 8 },
          maxBarThickness: 58, barPercentage: .68, categoryPercentage: .8 };
      datasets = [
        kBar,
        ...(haveSplit ? [iBar] : []),
        { type: 'line', label: monN + ' cumulative', data: cumC, yAxisID: 'y1',
          borderColor: '#FFD86B', borderWidth: 3.2, tension: .38, pointRadius: 0,
          borderCapStyle: 'round', borderJoinStyle: 'round', pointHoverRadius: 4,
          fill: true, backgroundColor: (() => { const g = ctxW.createLinearGradient(0, 0, 0, 300);
            g.addColorStop(0, 'rgba(255,216,107,.12)'); g.addColorStop(.7, 'rgba(255,216,107,.02)');
            g.addColorStop(1, 'rgba(255,216,107,0)'); return g; })(),
          _glow: 'rgba(255,216,107,.5)',
          _endLabel: fmt(mtd) + ' cs', _endColor: '#FFD86B' }
      ].concat(priCum ? [
        { type: 'line', label: pri3 + ' 1–' + lastDay + ' cum.', data: priCum, yAxisID: 'y1',
          borderColor: '#93A6C4', borderDash: [6, 5], borderWidth: 1.8, tension: .35, pointRadius: 0,
          pointHoverRadius: 4, fill: false,
          _endLabel: pri3 + ' ' + fmt(priPace || 0), _endColor: '#9FB0CC', _endBelow: true }
      ] : []);
    }
    wdsChart = new Chart(cv, {
      data: { labels: days, datasets: datasets },
      options: { responsive: true, maintainAspectRatio: false,
        animation: { duration: 700, easing: 'easeOutQuart',
          delay: c => (c.type === 'data' && c.mode === 'default') ? c.dataIndex * 28 : 0 },
        layout: { padding: { top: 30, right: cumMode ? 14 : 12 } },
        interaction: { mode: 'index', intersect: false },
        hover: { mode: 'index', intersect: false },
        plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, pointStyle: 'rectRounded',
            boxWidth: 9, boxHeight: 9, padding: 18, font: { size: 11, weight: '600' }, color: '#B9C8DE' } },
          tooltip: { enabled: false, external: hovOut } },
        scales: {
          x: { grid: { display: false }, border: { color: '#1B2942' },
              ticks: { color: c => wdOf(days[c.index]) === 0 ? '#FFD700' : '#7E90AD',
                font: c => ({ size: 10.5, weight: wdOf(days[c.index]) === 0 ? '800' : '500' }),
                callback: function (v, i) { const d = days[i];
                  return [String(d), WDU[wdOf(d)]]; } } },
          y: { stacked: !cumMode && haveSplit, beginAtZero: true, grace: '14%',
              grid: { color: 'rgba(148,163,184,.045)' }, border: { display: false },
              ticks: { color: '#6F84A6', maxTicksLimit: 6, font: { size: 10.5, weight: '600' }, callback: v => fmt(v) },
              title: { display: true, text: cumMode ? 'cumulative cs' : 'cases / day', color: '#6E7F9B', font: { size: 10 } } },
          ...(cumMode ? {} : { y1: { position: 'right', min: 0, grace: '10%', grid: { display: false }, border: { display: false },
              ticks: { color: 'rgba(255,216,107,.72)', callback: v => fmt(v) },
              title: { display: true, text: 'cumulative cs', color: '#A8935C', font: { size: 10 } } } })
        } },
      plugins: [gapBand, sundayBand, avgRule, hoverGlow, barGlow, lineGlow, barTotals, topCap, endLabels]
    });
  };
  drawWds();
  const seg = document.getElementById('wdsSeg');
  if (seg && !seg._wired) {
    seg._wired = true;
    seg.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      seg.querySelectorAll('button').forEach(x => x.classList.remove('on'));
      b.classList.add('on'); wdsMode = b.dataset.m; drawWds();
    });
  }
}

function render() {
  const stockRaw = PAYLOAD.stock || [];
  const dispRaw = dispRows();

  const byDate = new Map();
  stockRaw.forEach(r => {
    if (!byDate.has(r.d)) byDate.set(r.d, []);
    byDate.get(r.d).push({ warehouse: r.w, physical: r.p, allotable: r.a, pending: r.n });
  });
  const dates = Array.from(byDate.keys()).sort();
  const latest = dates[dates.length-1];
  const prev   = dates[dates.length-2];
  const latestRows = byDate.get(latest);
  const prevRows   = prev ? byDate.get(prev) : [];
  const prevMap = new Map(prevRows.map(r => [r.warehouse, r]));
  // Per-warehouse prior physical: each WH's most recent snapshot BEFORE latest,
  // not the single global prior date — so a WH missing from yesterday's Bevco
  // export (BALARAMAPURAM-shaped drop) still shows a Δ vs its own last reading
  // instead of "—". Mirrors the inbound maintainer's per-WH lookback.
  const priorPhysByWh = new Map();
  for (let i = 0; i < dates.length - 1; i++) {
    byDate.get(dates[i]).forEach(r => priorPhysByWh.set(r.warehouse, r.physical));
  }
  // Per-warehouse physical history for the league-table sparklines.
  const physByWhDate = new Map();
  stockRaw.forEach(r => {
    if (!physByWhDate.has(r.w)) physByWhDate.set(r.w, new Map());
    physByWhDate.get(r.w).set(r.d, r.p);
  });
  const sparkDates = dates.slice(-14);

  // Month windows for the per-warehouse Stock trend chart.
  // Dropdown: This Month (= month of latest snapshot) / Last Month / older
  // months present in history / All Months. '__ALLM__' = full history.
  const monthKeys = [...new Set(dates.map(d => d.slice(0, 7)))].sort().reverse(); // newest first
  const monthLabelOf = k => new Date(k + '-01T00:00:00')
        .toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
  const monthShortOf = k => new Date(k + '-01T00:00:00')
        .toLocaleDateString('en-IN', { month: 'short', year: 'numeric' });
  const allRangeLbl = monthShortOf(monthKeys[monthKeys.length - 1]) + ' – ' + monthShortOf(monthKeys[0]);
  const monthOptions = monthKeys.map((k, i) => {
    const name = i === 0 ? 'This Month · ' + monthLabelOf(k)
               : i === 1 ? 'Last Month · ' + monthLabelOf(k)
               : monthLabelOf(k);
    return `<option value="${k}">${name}</option>`;
  }).slice(0, 3).join('');
  const datesForMonth = k => k === '__ALLM__' ? dates : dates.filter(d => d.startsWith(k));
  const trendLabelOf  = k => k === '__ALLM__' ? `all months (${allRangeLbl})` : monthLabelOf(k);
  const curMonthLabel = monthLabelOf(monthKeys[0]);
  const whNames = [...latestRows.map(r => r.warehouse)].sort((a,b)=>a.localeCompare(b));
  const whOptions = ['<option value="__ALL__">All Warehouses (Network)</option>']
        .concat([1, 2, 3].map(c => `<option value="__C${c}__">Cluster ${c}</option>`))
        .concat(whNames.map(w => `<option value="${w}">${w}</option>`)).join('');

  const sum = arr => arr.reduce((a,b)=>a+b,0);
  const totalPhys  = sum(latestRows.map(r=>r.physical));
  const totalAllot = sum(latestRows.map(r=>r.allotable));
  const totalPend  = sum(latestRows.map(r=>r.pending));
  const allotRatio = totalPhys ? totalAllot/totalPhys*100 : 0;
  const pendRatio  = totalPhys ? totalPend/totalPhys*100  : 0;

  // Network DoD Δ — LIKE-FOR-LIKE: compare each latest warehouse to ITS OWN most
  // recent prior physical (priorPhysByWh), summed over the SAME warehouse set.
  // The old sum(prevRows) used the single global-prior date, so a warehouse
  // dropping out of one Bevco export (BALARAMAPURAM/ALUVA-shaped) produced a
  // spurious network swing on the drop day AND the day it returned. Summing a
  // matched set is immune to that. (Fixed 10 Jul 2026.)
  let curMatched = 0, priorMatched = 0;
  latestRows.forEach(r => {
    if (priorPhysByWh.has(r.warehouse)) {
      curMatched   += r.physical;
      priorMatched += priorPhysByWh.get(r.warehouse);
    }
  });
  const dPhys = priorMatched ? (curMatched - priorMatched) : 0;
  const dPhysPct = priorMatched ? (curMatched - priorMatched)/priorMatched*100 : 0;

  // Partial-export guard: warehouses seen in the recent 14-day window but absent
  // from today's snapshot. A short Bevco export undercounts the network KPIs;
  // build_warehouse_stock.py logs MISSING_WAREHOUSES but a scheduled refresh still
  // ships the short day, so surface it on the artifact itself. Self-heals once the
  // warehouse reports again. (Added 10 Jul 2026.)
  const _recentWin = dates.slice(-14);
  const _recentWh = new Set();
  _recentWin.forEach(d => (byDate.get(d) || []).forEach(r => _recentWh.add(r.warehouse)));
  const _latestSet = new Set(latestRows.map(r => r.warehouse));
  const missingToday = [..._recentWh].filter(w => !_latestSet.has(w)).sort();

  // The flow-balance banner that used to sit here policed inbound_history's two
  // columns. Nothing on the page reads them any more, so there is nothing left
  // to police: the sales figures come from the invoices and the stock figures
  // from the stock reports, and each is checked against its own raw file by
  // tools/verify_dashboards.py. What DOES need saying is when the app is
  // holding only part of a month - see covGap below.

  // Months-of-cover tier counts — feed the tier-filter chips above the league
  // table (same classification as the Dispatch Priority section below).
  const salesByWh = (PAYLOAD.sales && PAYLOAD.sales.byWarehouse) || {};
  let nCovCritical=0, nCovHealthy=0, nCovWatch=0, nCovOver=0, nCovIdle=0;
  latestRows.forEach(r => {
    const s = salesByWh[r.warehouse];
    const avg = s ? (s.avg || 0) : 0;
    const t = coverTier(r.physical, avg).tier;
    if (t === 'critical')         nCovCritical++;
    else if (t === 'cover-ok')    nCovHealthy++;
    else if (t === 'cover-watch') nCovWatch++;
    else if (t === 'overstock')   nCovOver++;
    else                          nCovIdle++;
  });

  // Table Status column uses months-of-cover (same classification as the Stock Health
  // panel and the Dispatch Priority section). Pending% tier kept around for legacy
  // (statusFor) but not displayed in the warehouse league table any more.
  // The glyph and the word are separate so a narrow screen can keep the glyph
  // and drop the word, rather than clipping "Overstocked" halfway through or
  // making the whole table drag sideways.
  function shortCoverTier(physical, avg) {
    // `short` is what a phone gets: "Overstocked" is the only word here long
    // enough to need one, and a clipped half of it tells nobody anything.
    const out = (tier, ic, text, short) =>
      ({ tier, ic, text, short: short || text, label: ic + ' ' + text });
    if (!avg || avg <= 0) return physical > 0 ? out('idle', '—', 'No sales')
                                              : out('idle', '—', '');
    const cover = physical / avg;
    if (cover < 1)  return out('critical',    '🚫', 'Critical');
    if (cover <= 2) return out('cover-ok',    '✅', 'Healthy');
    if (cover <= 3) return out('cover-watch', '⚠️', 'Watch');
    return                 out('overstock',   '🚀', 'Overstocked', 'Over');
  }
  // Sort worst-to-best by months of cover (Critical first, Overstocked last,
  // no-sales rows pushed to the very bottom).
  const sorted = [...latestRows].sort((a, b) => {
    const sa = salesByWh[a.warehouse]; const sb = salesByWh[b.warehouse];
    const aa = sa ? (sa.avg || 0) : 0;
    const bb = sb ? (sb.avg || 0) : 0;
    const ca = aa > 0 ? a.physical / aa : Infinity;
    const cb = bb > 0 ? b.physical / bb : Infinity;
    return ca - cb;
  });
  // match the Months of Cover section: red / green / yellow / purple
  const TIER_COLORS = { critical: '#F0837B', 'cover-ok': '#4ADE80',
                        'cover-watch': '#FFD86B', overstock: '#A78BFA', idle: '#5E7191' };
  const tableHtml = sorted.map(r => {
    const _s = salesByWh[r.warehouse];
    const _avg = _s ? (_s.avg || 0) : 0;
    const s = shortCoverTier(r.physical, _avg);
    const _m = physByWhDate.get(r.warehouse);
    const sVals = sparkDates.map(d => (_m && _m.has(d)) ? _m.get(d) : null);
    const sparkColor = TIER_COLORS[s.tier] || '#94A3B8';
    const prevPhys = priorPhysByWh.has(r.warehouse) ? priorPhysByWh.get(r.warehouse) : null;
    const d = prevPhys == null ? null : r.physical - prevPhys;
    const dCls = d==null ? 'flat' : d>0?'pos':(d<0?'neg':'flat');
    const dTxt = d==null ? '—' : (d>0?'+':'') + fmt(d);
    return `<tr class="wh-row" data-wh="${r.warehouse}" data-tier="${s.tier}" title="Click for brand & pack detail">
      <td>${r.warehouse}</td>
      <td class="num">${fmt(r.physical)}</td>
      <td class="num col-allot">${fmt(r.allotable)}</td>
      <td class="num col-pend">${fmt(r.pending)}</td>
      <td class="num delta-cell col-delta ${dCls}">${dTxt}</td>
      <td class="sparkcell col-spark">${sparkSvg(sVals, { w: 84, h: 22, color: sparkColor })}</td>
      <td class="col-status"><span class="pill ${s.tier}" title="${s.text}"><i class="ic">${s.ic}</i><b>${s.text}</b><u class="ab">${s.short}</u></span></td>
    </tr>`;
  }).join('');

  // THE MONTH-TO-DATE WINDOW, for every panel that carries one.
  // It runs to the last day the dispatch uploads ANSWER FOR, not the last day
  // something moved: a quiet 23rd somebody uploaded is still part of the month
  // to date, and stopping the window at the 18th because the 19th to 23rd were
  // nil would quietly shorten the month and flatter the run rate.
  const mtdPrefix   = ddPre();
  const dispMTD     = mtdPrefix ? dispRaw.filter(r => r.d.startsWith(mtdPrefix)) : [];
  const mtdFirstDay = ddFirstDay(ddCur());
  const mtdLastDay  = ddLast();
  const monthName   = ddCur() ? MONTHS[ddCur().mi - 1] : '';
  const mtdLabel    = ddCur() ? (mtdFirstDay === mtdLastDay
                                  ? `${monthName} ${mtdLastDay}`
                                  : `${monthName} ${mtdFirstDay}–${mtdLastDay}`) : '—';

  // Series for the network trend chart + KPI-tile sparklines (computed up
  // front so the tiles can embed sparklines in the initial HTML).
  // `n` is how many warehouses reported that day. A short Bevco export is a
  // hole in the network, not a crash in it: 4 May 2026 reads as a 2,539-case
  // fall, of which 1,915 is three warehouses simply absent from the file. The
  // header's day-on-day tile has compared matched sets since 10 Jul; the chart,
  // which is where a trend is actually read, had no such guard and showed the
  // cliff to anyone who clicked 90D or All.
  const trendData = dates.map(d => {
    const rs = byDate.get(d);
    return { d, n: rs.length,
             phys: sum(rs.map(r=>r.physical)),
             allot: sum(rs.map(r=>r.allotable)),
             pend: sum(rs.map(r=>r.pending)) };
  });
  const trendFullN = trendData.reduce((a, r) => Math.max(a, r.n), 0);

  // Format the as-of date as e.g. '19 May 2026' for the header.
  const _hdrDt = new Date(latest + 'T00:00:00');
  const _hdrFmt = _hdrDt.toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
  document.getElementById('hdrAsOf').textContent = _hdrFmt;
  document.getElementById('metaInfo').innerHTML =
    `<b>${latestRows.length}</b><em>warehouses</em><span class="sep"></span><b>${dates.length}</b><em>days of history</em>`

  // ---- KPI aggregates: cover + sales (6-tile header, 21 Jul) --------------
  // Everything below reuses buildMerged()/coverTier() so the header agrees to
  // the case with the Months-of-Cover section further down the page.
  const kMerged   = buildMerged(latestRows);
  const kDemand   = kMerged.reduce((a, m) => a + (m.avg || 0), 0);        // network cs/mo
  const kCover    = kDemand > 0 ? totalPhys / kDemand : null;             // months of cover
  const kTierCnt  = { critical: 0, 'cover-ok': 0, 'cover-watch': 0, overstock: 0, idle: 0 };
  let kToOneMo = 0;
  kMerged.forEach(m => {
    kTierCnt[m.tier.tier] = (kTierCnt[m.tier.tier] || 0) + 1;
    if (m.tier.tier === 'critical') kToOneMo += Math.max(0, Math.ceil((m.avg || 0) - m.physical));
  });
  const kBelow1   = kTierCnt.critical;                 // warehouses under 1 mo cover
  const kOver3    = kTierCnt.overstock;                // warehouses over 3 mo
  const kWhTotal  = kMerged.length;
  const kBelowPct = kWhTotal ? (kBelow1 / kWhTotal * 100) : 0;
  // cover health pill: green healthy band 1-2 mo, red under, amber watch, gold over
  const kCoverPill = kCover == null ? { c: 'flat', t: '—' }
    : kCover < 1  ? { c: 'neg',  t: 'Critical' }
    : kCover <= 2 ? { c: 'pos',  t: 'Healthy' }
    : kCover <= 3 ? { c: 'flat', t: 'Watch' }
    :               { c: 'gold', t: 'Overstocked' };

  // ---- NETWORK SALES, month to date --------------------------------------
  // One basis, one source: the invoices, dated by their own Inv/GTN date. The
  // same sum the Secondary Sales - Daily report prints, so the two cannot
  // disagree, and the same rows every other sales panel on this page reads.
  const sCur = ddCur(), sPri = ddPri();
  const sHave    = !!sCur;
  const sLastDay = ddLast();
  const sMtd     = sHave ? Object.values(sCur.days).reduce((a, b) => a + b, 0) : 0;
  const sPrv     = sPri
    ? Object.keys(sPri.days).reduce((a, k) => a + (Number(k) <= sLastDay ? sPri.days[k] : 0), 0)
    : 0;
  // LIKE-FOR-LIKE OR NOTHING. A percentage against a month the app holds fewer
  // days of is not a growth rate, and a director reading it as one is the
  // exact failure this page exists to prevent. Both windows have to be whole
  // up to the day cap before a pill is drawn; otherwise the prior figure is
  // still shown, marked as the part month it is, with no percentage on it.
  const sCovCur = sHave ? (sCur.covered || []).filter(d => d <= sLastDay).length : 0;
  const sCovPri = sPri  ? (sPri.covered  || []).filter(d => d <= sLastDay).length : 0;
  const sWhole  = sHave && sCovCur >= sLastDay && sCovPri >= sLastDay;
  const sPct    = (sWhole && sPrv > 0) ? (sMtd / sPrv - 1) * 100 : null;
  const sLbl    = sHave ? MONTHS[sCur.mi - 1] + ' 1–' + sLastDay : null;
  const sPriorMo = sPri ? MONTHS[sPri.mi - 1] : 'prior';
  // Per day over the days that TRADED, not the days on the calendar: a run
  // rate divided by Sundays and dry days is not a run rate.
  const sTrade  = sHave ? Object.values(sCur.days).filter(v => v > 0.01).length : 0;
  const sPerDay = sTrade ? sMtd / sTrade : 0;
  // Days inside the window that nobody has uploaded. The figures are right for
  // the days the app holds; this is how many days they are missing.
  const covGap  = sHave ? Math.max(0, sLastDay - sCovCur) : 0;
  // ... and the case it used to be switched off for. `covGap` needs a current
  // month to have a gap at all, so a month with no Secondary Sales export
  // whatsoever produced no banner, no gap and three panels quietly reading 0.
  const noDispatch = !sHave;
  const dispMonthLbl = latest
    ? new Date(latest.slice(0, 7) + '-01T00:00:00').toLocaleString('en-US', { month: 'long', year: 'numeric' })
    : 'this month';
  const demandThin  = !!(PAYLOAD.sales && PAYLOAD.sales.thin);
  const demandScale = (PAYLOAD.sales && PAYLOAD.sales.scaleUp) || 0;
  const demandLbl  = (PAYLOAD.sales && PAYLOAD.sales.periodLabel) || '';
  // shared bar: base = the portion NOT moving, delta = the move against it
  const kMoveBar = (cur, prv, goodUp) => {
    const hi = Math.max(cur, prv, 1);
    let d = prv ? Math.abs(cur - prv) / hi * 100 : 0;
    if (d > 0.001) d = Math.max(d, 4);
    const up = goodUp ? cur >= prv : cur <= prv;
    return '<div class="cbar"><i class="base" style="width:' + Math.max(0, 100 - d).toFixed(1) + '%"></i>'
      + (d > 0 ? '<i class="delta ' + (up ? 'up' : 'dn') + '" style="width:' + d.toFixed(1) + '%"></i>' : '')
      + '</div>';
  };

  document.getElementById('content').innerHTML = `
    ${covGap ? `<div style="background:linear-gradient(135deg,rgba(240,198,116,.14),rgba(240,198,116,.03));border:1px solid rgba(240,198,116,.4);border-left:3px solid #E3A32B;color:#F3D08A;padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:12.5px;font-weight:600;line-height:1.5">&#9888;&#65039; Part month &mdash; dispatch has been uploaded for <b>${sCovCur}</b> of the <b>${sLastDay}</b> days to ${monthName} ${sLastDay}, so ${covGap} day${covGap>1?'s are':' is'} missing. Every sales figure below is the true total for the days the app holds and understates the month by whatever moved on the ${covGap>1?'others':'other'}. Upload the missing Secondary Sales exports to close it.</div>` : ''}
    ${noDispatch ? `<div style="background:linear-gradient(135deg,rgba(224,106,98,.14),rgba(224,106,98,.03));border:1px solid rgba(224,106,98,.35);border-left:3px solid #C6403A;color:#FFB4AC;padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:12.5px;font-weight:600;line-height:1.45">&#9888;&#65039; No Secondary Sales export has been uploaded for ${dispMonthLbl}. Every sales figure on this page is built from those invoices, so there is no month-to-date sales figure to show &mdash; the sales tiles read &ldquo;not uploaded&rdquo; rather than nought, and the months-of-cover tiers are running on the demand basis named below. The stock figures are unaffected.</div>` : ''}

  Chart.defaults.color = PALETTE.axis;
  Chart.defaults.borderColor = PALETTE.grid;
  Chart.defaults.font.family = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';

  // NETWORK TREND (reworked 9 Jul 2026 PM, Abhay: "improve this part") —
  // range chips (14D/30D/90D/All), max ~7 clean horizontal date ticks, gold
  // month-start separators, end-of-line value labels, DoD footer in tooltip.
  // The old fixed step-2 tick thinning smeared ~27 rotated labels on 55 days.
  let netTrendChart = null;
  const TREND_RANGES = [
    { k: '14',  label: '14D', days: 14 },
    { k: '30',  label: '30D', days: 30 },
    { k: '90',  label: '90D', days: 90 },
    { k: 'all', label: 'All', days: null },
  ];
  function renderNetworkTrend(rangeKey) {
    const canvas = document.getElementById('trendChart');
    if (!canvas) return;
    const def = TREND_RANGES.find(r => r.k === rangeKey) || TREND_RANGES[1];
    let data = trendData;
    if (def.days) {
      const cut = new Date(latest + 'T00:00:00');
      cut.setDate(cut.getDate() - def.days + 1);
      const cutISO = isoOf(cut);
      data = trendData.filter(r => r.d >= cutISO);
    }
    if (data.length < 2) data = trendData.slice(-2);
    const ctx2 = canvas.getContext('2d');
    const gradPhys = ctx2.createLinearGradient(0, 0, 0, 320);
    gradPhys.addColorStop(0, 'rgba(96,165,250,0.20)');
    gradPhys.addColorStop(1, 'rgba(96,165,250,0.02)');
    const showPts = data.length <= 21;
    // Header readout — legend at rest, the hovered day's figures on hover, so
    // no floating card ever sits over the lines (the liquidation pattern).
    const hov = document.getElementById('ntHov');
    const NT_LEG = [['Physical', '#60A5FA'], ['Allotable', '#81C784'], ['Pending', '#FFB74D']];
    const ntSpan = (nm, col, val) => '<span class="rd-s" style="--c:' + col + ';cursor:default"><i class="dot"></i><em>'
      + nm + '</em>' + (val == null ? '' : '<b>' + val + '</b><u>cs</u>') + '</span>';
    function paintNtHov(i) {
      if (!hov) return;
      if (i == null) i = data.length - 1;   // at rest: the latest snapshot
      if (!data[i]) {
        hov.innerHTML = NT_LEG.map(l => ntSpan(l[0], l[1], null)).join('');
        return;
      }
      const r = data[i];
      const short = trendFullN && r.n < trendFullN;
      hov.innerHTML = '<span class="rd-h live">' + fmtDateLabel(r.d) + '</span>'
        + ntSpan('Physical', '#60A5FA', fmt(r.phys))
        + ntSpan('Allotable', '#81C784', fmt(r.allot))
        + ntSpan('Pending', '#FFB74D', fmt(r.pend))
        + (short ? '<span class="rd-s" style="--c:#E3A32B;cursor:default"><i class="dot"></i><em>Short export</em><b>'
            + r.n + '</b><u>of ' + trendFullN + ' WH</u></span>' : '');
    }
    paintNtHov(null);
    if (netTrendChart) { netTrendChart.destroy(); netTrendChart = null; }
    netTrendChart = new Chart(canvas, {
      type: 'line',
      data: {
        labels: data.map(r => fmtDateLabel(r.d)),
        datasets: [
          { label: 'Physical',  data: data.map(r => r.phys),
            borderColor: PALETTE.cyan, backgroundColor: gradPhys,
            fill: true, tension: 0.35, borderWidth: 3,
            borderCapStyle: 'round', borderJoinStyle: 'round', _glow: 'rgba(96,165,250,.5)',
            pointRadius: showPts ? 2 : 0, pointHoverRadius: 5 },
          { label: 'Allotable', data: data.map(r => r.allot),
            borderColor: PALETTE.green, backgroundColor: 'rgba(0,0,0,0)',
            fill: false, tension: 0.35, borderWidth: 2.4,
            borderCapStyle: 'round', borderJoinStyle: 'round', _glow: 'rgba(129,199,132,.45)',
            pointRadius: showPts ? 2 : 0, pointHoverRadius: 5 },
          { label: 'Pending',   data: data.map(r => r.pend),
            borderColor: PALETTE.amber, backgroundColor: 'rgba(0,0,0,0)',
            fill: false, tension: 0.35, borderWidth: 2.4,
            borderCapStyle: 'round', borderJoinStyle: 'round', _glow: 'rgba(255,183,77,.4)',
            pointRadius: showPts ? 2 : 0, pointHoverRadius: 5 }
        ]
      },
      options: {
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        layout: { padding: { top: 8, right: 16 } },
        plugins: {
          legend: { display: false },
          tooltip: {
            enabled: false,
            // the hovered day's figures land in the readout row ABOVE the plot
            // instead of a floating card that covers the lines
            external: (c) => {
              const tt = c.tooltip;
              if (!tt || tt.opacity === 0 || !tt.dataPoints || !tt.dataPoints.length) { paintNtHov(null); return; }
              paintNtHov(tt.dataPoints[0].dataIndex);
            }
          }
        },
        scales: {
          x: { grid: { display: false }, border: { color: '#1B2942' },
               ticks: { color: PALETTE.axis, font: { size: 10 }, maxRotation: 0, minRotation: 0, autoSkip: false, padding: 6,
                 callback: function(value, index) {
                   const last = data.length - 1;
                   const step = Math.max(1, Math.ceil(data.length / 7));
                   if ((last - index) % step !== 0) return '';
                   const parts = data[index].d.split('-').map(Number);
                   return parts[2] + ' ' + MONTHS[parts[1] - 1];
                 } } },
          y: { grid: { color: 'rgba(148,163,184,0.05)', drawTicks: false, borderDash: [3, 6] },
               border: { display: false },
               ticks: { color: PALETTE.axis, font: { size: 10 }, padding: 8, maxTicksLimit: 7, callback: v => v.toLocaleString('en-IN') },
               beginAtZero: true }
        }
      },
      plugins: [
        { // days the Bevco export was short: shaded, so the dip reads as a
          // missing file rather than as stock that left the network
          id: 'nt-short',
          beforeDatasetsDraw(ch) {
            if (!trendFullN) return;
            const xs = ch.scales.x, a = ch.chartArea; if (!xs || !a) return;
            const bw = (a.right - a.left) / Math.max(1, data.length);
            ch.ctx.save();
            data.forEach((r, i) => {
              if (r.n >= trendFullN) return;
              ch.ctx.fillStyle = 'rgba(227,163,43,.10)';
              ch.ctx.fillRect(xs.getPixelForValue(i) - bw / 2, a.top, bw, a.bottom - a.top);
            });
            ch.ctx.restore();
          }
        },
        { // soft glow under each line (the liquidation line treatment)
          id: 'nt-glow',
          beforeDatasetDraw(chart, args) {
            const ds = chart.data.datasets[args.index];
            if (ds && ds._glow) { chart.ctx.save(); chart.ctx.shadowColor = ds._glow; chart.ctx.shadowBlur = 9; }
          },
          afterDatasetDraw(chart, args) {
            const ds = chart.data.datasets[args.index];
            if (ds && ds._glow) chart.ctx.restore();
          }
        },
        { // gold month-start separators with month tags
          id: 'nt-month-sep',
          beforeDatasetsDraw(chart) {
            const { ctx, chartArea, scales } = chart;
            if (!chartArea) return;
            const xs = scales.x;
            ctx.save();
            for (let i = 1; i < data.length; i++) {
              if (data[i].d.slice(0, 7) === data[i - 1].d.slice(0, 7)) continue;
              const x = (xs.getPixelForValue(i) + xs.getPixelForValue(i - 1)) / 2;
              ctx.strokeStyle = 'rgba(255,215,0,0.30)';
              ctx.setLineDash([3, 4]); ctx.lineWidth = 1;
              ctx.beginPath(); ctx.moveTo(x, chartArea.top); ctx.lineTo(x, chartArea.bottom); ctx.stroke();
              ctx.setLineDash([]);
              ctx.fillStyle = 'rgba(255,215,0,0.8)';
              ctx.font = '700 9.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
              ctx.textAlign = 'left';
              ctx.fillText(new Date(data[i].d + 'T00:00:00').toLocaleString('en-US', { month: 'short' }).toUpperCase(), x + 4, chartArea.top + 9);
            }
            ctx.restore();
          }
        }
      ]
    });
    const note = document.getElementById('trendNote');
    if (note && data.length >= 2) {
      const a = data[0], b = data[data.length - 1];
      const dP = b.phys - a.phys;
      const dpct = a.phys ? dP / a.phys * 100 : 0;
      const dcolor = dP > 0 ? '#7BD8AA' : (dP < 0 ? '#F09A93' : '#9FB0CC');
      const sign = dP > 0 ? '+' : '';
    }
  }
  (function attachTrendRange() {
    const box = document.getElementById('trendRange');
    const LS_TR = 'ksdwh.nettrend.range';
    let cur = '30';
    try { const s = localStorage.getItem(LS_TR); if (s && TREND_RANGES.some(r => r.k === s)) cur = s; } catch (e) {}
    function paint() {
      if (!box) return;
      box.innerHTML = TREND_RANGES.map(r =>
        '<span class="rchip' + (r.k === cur ? ' active' : '') + '" data-k="' + r.k + '">' + r.label + '</span>').join('');
      box.querySelectorAll('.rchip').forEach(ch => ch.addEventListener('click', () => {
        cur = ch.dataset.k;
        try { localStorage.setItem(LS_TR, cur); } catch (e) {}
        paint();
        renderNetworkTrend(cur);
      }));
    }
    paint();
    renderNetworkTrend(cur);
  })();

function equalizeWarehouseRows() {
  const grid = document.querySelector('.grid-main');
  if (!grid) return;
  const panels = grid.querySelectorAll(':scope > .panel');
  if (panels.length < 2) return;
  const leftPanel  = panels[0];
  const rightPanel = panels[1];
  const tableRows = Array.from(leftPanel.querySelectorAll('table.tbl tbody tr.wh-row')).filter(r => !r.hidden);
  // Single-column (stacked) layout: no pin, natural heights.
  const stacked = getComputedStyle(grid).gridTemplateColumns.trim().split(/\s+/).length < 2;
  if (stacked) {
    leftPanel.style.height = '';
    tableRows.forEach(r => r.style.height = '');
    return;
  }
  if (!tableRows.length) return;
  tableRows.forEach(r => r.style.height = '');
  requestAnimationFrame(() => {
    leftPanel.style.height = '';   // no pin, no scroll — rows are sized to meet
    const targetBottomY = rightPanel.getBoundingClientRect().bottom;
    const tbody = leftPanel.querySelector('table.tbl tbody');
    const tbodyTop = tbody.getBoundingClientRect().top;
    const panelStyle = getComputedStyle(leftPanel);
    const panelPadBottom = parseFloat(panelStyle.paddingBottom) || 16;
    const panelBorderBottom = parseFloat(panelStyle.borderBottomWidth) || 1;
    const available = targetBottomY - tbodyTop - panelPadBottom - panelBorderBottom;
    if (available <= 0) return;
    const n = tableRows.length;
    // Distribute exactly: base + 1 extra px for the first (remainder) rows.
    // Min clamp 30 (was 36): near the rows' natural height, so the total can
    // actually FIT the target and the two panels end on the same edge instead
    // of the table overshooting past it.
    const base = Math.floor(available / n);
    const remainder = Math.round(available - base * n);
    tableRows.forEach((r, i) => {
      const h = Math.min(Math.max(base + (i < remainder ? 1 : 0), 30), 64);
      r.style.height = h + 'px';
    });
  });
}

// ---------------------------------------------------------------------------
// equalizeWarehouseRows sizes the LEFT table's rows to the height of the RIGHT
// panel -- and that panel holds two charts. On a cold open it gets measured
// before those size and before the web font swaps, so every row comes out
// wrong; reloading only looks right because the layout is already warm.
//
// So: run it whenever the layout could have changed, and watch the panel it
// depends on rather than guessing at the moment it settles.
// ---------------------------------------------------------------------------
let _eqT;
function scheduleEqualize() { clearTimeout(_eqT); _eqT = setTimeout(equalizeWarehouseRows, 50); }

window.addEventListener('resize', scheduleEqualize);

// listener for it silently does nothing at all.
if (document.readyState === 'complete') setTimeout(equalizeWarehouseRows, 0);
else window.addEventListener('load', equalizeWarehouseRows);

// deploy, and never a stale snapshot baked into the markup.

// main.py - so there is nothing to wait for and nothing to fetch. The fetch
// paths stay for a page served bare, and for anything that reloads the
// figures without reloading the page.
(window.__KSD_WAREHOUSE__ ? Promise.resolve(window.__KSD_WAREHOUSE__)
  : (window.__whFigures || fetch('/api/dashboard/warehouse', { credentials: 'same-origin' })
      .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))))
  .then(data => {
    if (data && data.error) throw new Error(data.error);
    if (!data || !(data.stock || []).length) throw new Error('No stock history yet.');
    PAYLOAD = data;

// The right panel is the thing being measured, so react to it actually
// changing. It is built by render(), and render() now waits on a fetch, so
// this has to be (re)bound then - bound at parse time it would watch a panel
// that does not exist yet, which is exactly why the league table sat at its
// natural height and left a gap under it.
var _rightRO = null, _lastRH = 0;
function watchRightPanel() {
  if (!window.ResizeObserver) return;
  var grid = document.querySelector('.grid-main');
  var right = grid && grid.querySelectorAll(':scope > .panel')[1];
  if (!right) return;
  if (_rightRO) _rightRO.disconnect();
  _lastRH = 0;
  _rightRO = new ResizeObserver(function (entries) {
    // only a REAL height change re-runs the equalizer — transient sub-pixel
    // or readout-driven flaps used to thrash the league row heights
    var h = Math.round(entries[0].contentRect.height);
    if (Math.abs(h - _lastRH) > 1) { _lastRH = h; scheduleEqualize(); }
  });
  _rightRO.observe(right);
}
watchRightPanel();

// Everything that can only be measured once the figures are on the page: the
// charts have a container to size against, and the league table has a right
// panel to match. Called after render(), and again as the fonts and charts
// settle.
function settleLayout() {
  watchRightPanel();
  requestAnimationFrame(function () { requestAnimationFrame(equalizeWarehouseRows); });
  [120, 400, 900].forEach(function (ms) {
    setTimeout(function () {
      equalizeWarehouseRows();
      if (window.__ksdReflow) window.__ksdReflow();
    }, ms);
  });
}

// ---------------------------------------------------------------------------
// Same cold-open problem as the row equalizer, one layer down: Chart.js
// measures a canvas's container when the chart is CONSTRUCTED and bakes that
// width into the canvas. Inside an embedded view the panels are often still
// settling at that point, so a chart built against a wider box keeps drawing
// wider than its tile -- the end-of-line value labels and the last x tick fall
// off the right edge. Reloading only looks correct because the layout is
// already warm by the time the script runs.
//
// ch.resize() re-measures the container and redraws, so the fix is simply to
// call it once the layout is real: after a genuine layout frame, on full load
// (which may already have fired here), when the web font swaps in, and -- the
// catch-all -- whenever a chart's own container actually changes size.
// ---------------------------------------------------------------------------
(function reflowCharts() {
  if (!window.Chart || !Chart.getChart) return;
  var each = function (fn) {
    document.querySelectorAll('canvas').forEach(function (cv) {
      var ch = Chart.getChart(cv);
      if (ch) { try { fn(ch, cv); } catch (e) {} }
    });
  };
  var resizeAll = function () { each(function (ch) { ch.resize(); }); };
  // Charts are built by render(), after this block has run its own timers, so
  // the settle pass needs a way back in here.
  window.__ksdReflow = resizeAll;

  requestAnimationFrame(function () { requestAnimationFrame(resizeAll); });
  if (document.readyState === 'complete') setTimeout(resizeAll, 0);
  else window.addEventListener('load', resizeAll);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resizeAll).catch(function () {});
  setTimeout(resizeAll, 120);
  setTimeout(resizeAll, 400);

  if (window.ResizeObserver) {
    var t;
    var ro = new ResizeObserver(function () { clearTimeout(t); t = setTimeout(resizeAll, 40); });
    each(function (ch, cv) { if (cv.parentElement) ro.observe(cv.parentElement); });
    // charts built later (the mix pie is rebuilt on every scope change) still
    // need watching, so re-scan once the first batch has settled
    setTimeout(function () { each(function (ch, cv) { if (cv.parentElement) ro.observe(cv.parentElement); }); }, 500);
  }
})();
</script>
