<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>K.S. Distillery — Warehouse Live Position</title>
<!--KSD_PAYLOAD-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1300px 640px at 10% -10%, #17264e 0%, transparent 55%),
                radial-gradient(1100px 560px at 94% -2%, #1b2c33 0%, transparent 50%),
                radial-gradient(900px 500px at 50% 108%, #131f3d 0%, transparent 55%),
                linear-gradient(180deg, #0A0F1E 0%, #0C1426 50%, #090E1C 100%);
    color: #E5EAF0;
    min-height: 100vh;
    padding: 18px 24px 46px;
    font-variant-numeric: tabular-nums;
  }
  .hdr, #content { max-width: 1540px; margin-left: auto; margin-right: auto; }
  .hdr {
    /* The brand half of this row moved to the sidebar, so what is left - the
       date and the counts - keeps to the right rather than sliding into the
       space it vacated. */
    display: flex; align-items: center; justify-content: flex-end;
    gap: 18px; flex-wrap: wrap;
    padding-bottom: 8px; margin-bottom: 10px;
    position: relative;
  }
  .hdr-brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .hdr-brand img.logo {
    width: 58px; height: 58px; object-fit: contain; flex: 0 0 auto;
    filter: drop-shadow(0 0 10px rgba(255,215,0,0.28)) drop-shadow(0 1px 2px rgba(0,0,0,0.5));
  }
  .hdr-title h1 {
    margin: 0; font-size: 21px; font-weight: 800; color: #FFFFFF;
    letter-spacing: 0.13em; line-height: 1.1; white-space: nowrap;
  }
  .hdr-tag {
    margin-top: 4px; font-size: 10.5px; font-weight: 600; color: #FFD700;
    text-transform: uppercase; letter-spacing: 0.30em; white-space: nowrap;
  }
  .hdr-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .hdr-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: #111C33; border: 1px solid #223354; border-radius: 999px;
    padding: 6px 14px; font-size: 10.5px; font-weight: 700; color: #93A5C2;
    letter-spacing: 0.07em; text-transform: uppercase; font-feature-settings: "tnum";
  }
  .hdr-pill em { font-style: normal; }
  .hdr-pill .sep { width: 3px; height: 3px; border-radius: 50%; background: #4C5D79;
    margin: 0 4px; flex: 0 0 auto; }
  .hdr-pill b { color: #80D8F7; font-weight: 700; }
  .hdr-pill.gold { border-color: rgba(255,215,0,0.35); color: #C9D4E4; }
  .hdr-pill.gold b { color: #FFD700; }
  .hdr-pill .dot {
    width: 7px; height: 7px; border-radius: 50%; background: #4ADE80;
    box-shadow: 0 0 6px rgba(74,222,128,0.8); margin-right: 2px;
    animation: ksdpulse 2.2s ease-in-out infinite;
  }
  @keyframes ksdpulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .grid-kpi {
    display: grid; width: 100%;
    grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
    gap: 10px; margin-bottom: 14px;
  }
  /* Five tiles since Inbound went (23 Sep 2026). Five divides into neither
     three nor two, so the tile that would otherwise sit alone beside an empty
     cell is stretched across it instead. Explicit fr tracks, not repeat() —
     see the .sstrip note; the embedded webview dropped the repeat() form. */
  @media (max-width: 1240px) {
    .grid-kpi { grid-template-columns: 1fr 1fr 1fr; }
    .grid-kpi .kpi:nth-child(4) { grid-column: 1 / 3; }
  }
  @media (max-width: 720px)  {
    .grid-kpi { grid-template-columns: 1fr 1fr; }
    .grid-kpi .kpi:nth-child(4) { grid-column: auto; }
    .grid-kpi .kpi:nth-child(5) { grid-column: 1 / -1; }
  }
  .grid-kpi .kpi { min-width: 0; }
  /* KPI card ported from the Total Liquidation artifact so the two dashboards
     read as one family: accent edge, dotted label, value + unit + pill, a
     base/delta bar, and a hairline footer carrying the context. */
  .kpi {
    position: relative; overflow: hidden; border-radius: 14px; padding: 12px 14px 11px;
    border: 1px solid #27385E;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.055), 0 6px 20px rgba(0,0,0,.34);
    transition: transform .2s cubic-bezier(.2,.7,.3,1), box-shadow .2s ease, border-color .2s ease;
    /* plain first, so a browser without color-mix keeps a usable card */
    background: linear-gradient(168deg,#1A2745 0%,#131E37 52%,#0E1729 100%);
    /* then the accent's own light, pooled in the corner nearest its marker --
       enough to give each tile a character of its own without tinting the card */
    background:
      radial-gradient(130px 84px at 0% 0%,
        color-mix(in srgb, var(--cc,#4FC3F7) 12%, transparent) 0%, transparent 70%),
      linear-gradient(168deg,#1A2745 0%,#131E37 52%,#0E1729 100%);
  }
  .kpi:hover {
    transform: translateY(-3px);
    border-color: color-mix(in srgb, var(--cc,#4FC3F7) 46%, #27385E);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 15px 32px rgba(0,0,0,.46);
    background:
      radial-gradient(155px 98px at 0% 0%,
        color-mix(in srgb, var(--cc,#4FC3F7) 20%, transparent) 0%, transparent 70%),
      linear-gradient(168deg,#1A2745 0%,#131E37 52%,#0E1729 100%);
  }
  .kpi::before {
    content: ""; position: absolute; left: 0; top: 13px; bottom: 13px; width: 3px;
    border-radius: 0 4px 4px 0;
    background: var(--cc,#4FC3F7);
    background: linear-gradient(180deg, var(--cc,#4FC3F7) 0%,
      color-mix(in srgb, var(--cc,#4FC3F7) 45%, transparent) 100%);
    box-shadow: 0 0 14px color-mix(in srgb, var(--cc,#4FC3F7) 65%, transparent);
  }
  /* accent-tinted hairline along the top edge, fading out to both corners */
  .kpi::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; pointer-events: none;
    background: linear-gradient(90deg, transparent 0%,
      color-mix(in srgb, var(--cc,#4FC3F7) 50%, transparent) 42%, transparent 100%);
  }
  .kpi .label {
    display: flex; align-items: center; gap: 7px; min-height: 13px;
    font-size: 8.8px; text-transform: uppercase; letter-spacing: .13em;
    color: #8DA1BF; font-weight: 800;
  }
  .kpi .label i { flex: 0 0 auto; width: 6px; height: 6px; }
  .kpi .label i {
    width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; background: var(--cc,#4FC3F7);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--cc,#4FC3F7) 15%, transparent),
                0 0 10px color-mix(in srgb, var(--cc,#4FC3F7) 65%, transparent);
  }
  .kpi .value {
    display: flex; align-items: baseline; gap: 7px; flex-wrap: nowrap; white-space: nowrap;
    font-size: 27px; font-weight: 800; margin-top: 9px; letter-spacing: -.035em;
    line-height: 1; color: #FFFFFF; font-variant-numeric: tabular-nums;
  }
  /* Guarded: an unsupported background-clip with a transparent text fill would
     render the headline number invisible, so it only applies where it works. */
  @supports (-webkit-background-clip:text) or (background-clip:text) {
    .kpi .value > .n {
      background: linear-gradient(177deg,#FFFFFF 22%,#BCCDE9 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
  }
  .kpi .value .u { font-size: 10.4px; color: #74859F; font-weight: 600; letter-spacing: .01em;
    align-self: flex-end; margin-bottom: 2px; }
  /* inline beside the value, pushed to the tile's right edge */
  .kpi .dpill { margin-left: auto; align-self: center;
    font-size: 9.6px; font-weight: 800; padding: 2.5px 7.5px; border-radius: 7px;
    border: 0; letter-spacing: .01em; white-space: nowrap; }
  /* header-strip pill nudge (30 Jul 2026, Abhay: "a bit left and a bit more
     up") — pulled in off the tile's right edge and lifted clear of the
     headline's baseline. Scoped to .grid-kpi so the Stock Trend and Cover
     tiles keep their own alignment. */
  .grid-kpi .kpi .dpill { margin-right: 10px; transform: translateY(-4px); }
  .kpi .dpill.pos { background: rgba(67,192,138,.18); color: #7FE3B0;
    box-shadow: inset 0 0 0 1px rgba(67,192,138,.24); }
  .kpi .dpill.neg { background: rgba(224,106,98,.18); color: #FF9C94;
    box-shadow: inset 0 0 0 1px rgba(224,106,98,.26); }
  .kpi .dpill.flat{ background: rgba(126,144,173,.16); color: #A9B9D4;
    box-shadow: inset 0 0 0 1px rgba(126,144,173,.22); }
  .kpi .dpill.gold{ background: rgba(255,183,0,.16); color: #FFD167;
    box-shadow: inset 0 0 0 1px rgba(255,183,0,.26); }
  .kpi .cbar { display: flex; height: 8px; border-radius: 99px; margin-top: 11px;
    overflow: hidden; background: rgba(255,255,255,.05);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.05), inset 0 1px 2px rgba(0,0,0,.38); }
  .kpi .cbar i { display: block; height: 100%; }
  /* the fill lights along its length rather than sitting as a flat block */
  .kpi .cbar .base  { border-radius: 99px 0 0 99px; background: var(--cc,#4FC3F7);
    background: linear-gradient(90deg,
      color-mix(in srgb, var(--cc,#4FC3F7) 62%, #0A1220) 0%, var(--cc,#4FC3F7) 100%);
    box-shadow: 0 0 10px color-mix(in srgb, var(--cc,#4FC3F7) 42%, transparent),
                inset -2px 0 0 rgba(255,255,255,.5); }
  .kpi .cbar .delta { border-radius: 0 99px 99px 0; box-shadow: inset 1.5px 0 0 #0A1220; }
  .kpi .cbar .delta.up { background: linear-gradient(90deg,#43C08A,#7BD8AA); }
  .kpi .cbar .delta.dn { background: linear-gradient(90deg,#E06A62,#F09A93); }
  .kpi .cbar .rest { border-radius: 0 99px 99px 0;
    background: repeating-linear-gradient(115deg,
      rgba(255,255,255,.10) 0 3px, rgba(255,255,255,.03) 3px 6px); }
  /* tier-distribution bar (Below 1-Mo Cover): each segment is a cover band, so
     they sit side by side with a hairline between rather than one lit fill */
  .kpi .cbar.tierbar { box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); }
  .kpi .cbar.tierbar i { box-shadow: inset -1px 0 0 rgba(10,18,32,.65); border-radius: 0; }
  .kpi .cbar.tierbar i:first-child { border-radius: 99px 0 0 99px; }
  .kpi .cbar.tierbar i:last-child  { border-radius: 0 99px 99px 0; box-shadow: none; }
  .kpi .sub { position: relative; display: flex; align-items: baseline;
    justify-content: space-between; gap: 6px;
    font-size: 10px; color: #74859F; font-weight: 600; white-space: nowrap;
    margin-top: 10px; padding-top: 9px; letter-spacing: .01em; }
  /* the rule above the footer fades at both ends instead of butting the edges */
  .kpi .sub::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px;
    background: linear-gradient(90deg, rgba(255,255,255,.015), rgba(255,255,255,.10) 50%,
      rgba(255,255,255,.015)); }
  .kpi .sub > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .kpi .sub b { color: #C4D2E6; font-weight: 700; }
  .kpi .sub .dd { flex: 0 0 auto; font-weight: 800; }
  .kpi .delta.pos, .kpi .sub .dd.pos { color: #7BD8AA; }
  .kpi .delta.neg, .kpi .sub .dd.neg { color: #F09A93; }
  .kpi .delta.flat, .kpi .sub .dd.flat { color: #9FB0CC; }

  .grid-main {
    display: grid; grid-template-columns: 1.25fr 1fr; gap: 14px;
    align-items: start;
  }
  /* content (nowrap readouts etc.) must never resize the columns — without
     this, hovering the trend changed the readout's width, the fr track
     re-measured, and the WHOLE page appeared to shift (22 Jul 2026). */
  .grid-main > .panel { min-width: 0; }
  @media (max-width: 1100px) { .grid-main { grid-template-columns: 1fr; } }
  .panel {
    background: linear-gradient(180deg,#13203A 0%, #0E1830 100%);
    border: 1px solid #233453; border-radius: 16px; padding: 16px 18px;
    box-shadow: 0 8px 26px rgba(0,0,0,.22);
  }
  table.tbl tbody td { padding-top: 14px; padding-bottom: 14px; }
  .panel h2 {
    margin: 0 0 10px; font-size: 12.5px; text-transform: uppercase; letter-spacing: 1.3px;
    color: #FFD700; font-weight: 800;
    display: flex; align-items: center; gap: 9px; justify-content: space-between; flex-wrap: wrap;
  }
  .panel h2 .hint { font-size: 10.5px; color: #7E90AD; font-weight: 700;
    letter-spacing: .04em; text-transform: none; }
  .panel h2 .hint b { color: #FFD86B; font-weight: 800; }
  .panel .note { font-size: 11px; color: #7E90AD; }

  /* ===== Months of Cover — V2 look (ported 22 Jul) ===================== */
  .moc-h2 { margin: 0 0 12px; display: flex; align-items: baseline; gap: 10px;
    flex-wrap: wrap; justify-content: space-between; }
  .moc-h2 > span:first-child { font-size: 12.5px; text-transform: uppercase;
    letter-spacing: 1.3px; color: #FFD700; font-weight: 800; }
  .moc-hint { font-size: 10.5px; color: #7E90AD; font-weight: 700; letter-spacing: .04em; }
  .moc-kpis { display: grid; width: 100%; grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 9px; margin-bottom: 12px; }
  /* compact variant (23 Jul 2026, Abhay): shrink the tiles to hand their
     space to the cover bars + demand table below */
  .moc-kpis .kpi { padding: 8px 12px 8px; border-radius: 12px; }
  .moc-kpis .kpi::before { top: 10px; bottom: 10px; }
  .moc-kpis .kpi .label { min-height: 11px; font-size: 8.4px; }
  .moc-kpis .kpi .value { font-size: 19px; margin-top: 5px; gap: 6px; }
  .moc-kpis .kpi .dpill { font-size: 9px; padding: 2px 6px; }
  .moc-kpis .kpi .cbar { margin-top: 7px; height: 5px; }
  .moc-kpis .kpi .sub { margin-top: 7px; padding-top: 6px; font-size: 9.3px; }
  @media (max-width: 1080px) { .moc-kpis { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 560px)  { .moc-kpis { grid-template-columns: 1fr; } }
  .moc-grid { display: grid; grid-template-columns: 1.28fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 1100px) { .moc-grid { grid-template-columns: 1fr; } }
  .moc-h { margin: 0 0 8px; font-size: 10.2px; color: #FFD86B; letter-spacing: .16em;
    font-weight: 800; text-transform: uppercase; display: flex; align-items: center;
    gap: 8px; }
  .moc-h::before { content: ""; width: 3px; height: 12px; border-radius: 2px;
    background: linear-gradient(180deg,#FFD86B,#C9931B); flex: 0 0 auto; }
  .moc-h small { color: #8093AE; font-weight: 600; letter-spacing: .04em; text-transform: none;
    font-size: 9.6px; margin-left: auto; }

  /* horizontal cover bars -- roomier rows (Abhay: don't cramp it, keep the size
     it was before). V2 style + colours, original ~27px row height. */
  .cvb { display: flex; flex-direction: column; gap: 6.5px; }
  .cvb-r { display: grid; grid-template-columns: 138px 1fr 68px; align-items: center;
    gap: 12px; font-size: 11px; min-height: 16px; padding: 1px 3px; border-radius: 6px;
    transition: background .14s; }
  .cvb-r:hover { background: rgba(79,195,247,.06); }
  .cvb-nm { font-size: 11.4px; font-weight: 800; color: #C4D3EA; letter-spacing: .03em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cvb-track { position: relative; height: 15px; border-radius: 6px; background: #0A1220;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); overflow: visible; }
  .cvb-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px;
    transition: width .85s cubic-bezier(.2,.8,.2,1); }
  .cvb-clip { position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
    font-size: 10px; font-weight: 900; color: #0A0F1E; }
  .cvb-chip { font-size: 12px; font-weight: 900; text-align: right; white-space: nowrap; }
  .cvb-gl { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.07); z-index: 0; }
  .cvb-tl { position: absolute; top: -2px; bottom: -2px; width: 0; border-left: 1.5px dashed #FFD86B; opacity: .7; z-index: 2; }
  .cvb-lgd { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 13px; font-size: 9.6px;
    font-weight: 800; letter-spacing: .04em; color: #8093AE;
    padding-top: 10px; border-top: 1px solid rgba(255,255,255,.06); }
  .cvb-lgd span { display: flex; align-items: center; gap: 6px; }
  .cvb-lgd i { width: 9px; height: 9px; border-radius: 3px; }

  /* monthly demand table */
  .moc-tbl { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  .moc-tbl thead th { padding: 0 10px 9px; text-align: right; font-size: 9.5px; font-weight: 800;
    letter-spacing: .1em; text-transform: uppercase; color: #7E90AD; white-space: nowrap; }
  .moc-tbl thead th:first-child { text-align: left; }
  .moc-tbl tbody td { padding: 4.2px 10px; border-bottom: 1px solid #16233a; text-align: right;
    font-variant-numeric: tabular-nums; color: #AFC0D8; font-weight: 700; }
  .moc-tbl tbody tr:hover td { background: rgba(79,195,247,.05); }
  .moc-tbl td.nm { text-align: left; color: #F2F7FF; font-weight: 700; white-space: nowrap; }
  .moc-tbl td.avg { color: #60A5FA; font-weight: 900; }
  .moc-tbl tr.totrow td { border-top: 1px solid #33456A; border-bottom: none; padding-top: 8px;
    padding-bottom: 8px; color: #FFE9A8; font-weight: 900; background: rgba(255,216,107,.075); }
  .moc-tbl tr.totrow td:first-child { box-shadow: inset 3px 0 0 #C9A227; }
  .moc-tbl tr.totrow:hover td { background: rgba(255,216,107,.075); }
  .moc-tbl tr.totrow td.nm { color: #FFD86B; letter-spacing: .07em; }

  /* Warehouse-filter Stock trend panel */
  .wh-trend-hd {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap; margin-bottom: 6px;
  }
  .wh-trend-hd h2 { margin: 0; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  /* the live selection, stated beside the heading rather than folded into it */
  .wh-trend-hd h2 .hint { font-size: 10.5px; color: #7E90AD; font-weight: 700;
    letter-spacing: .04em; text-transform: none; }
  .wh-trend-hd h2 .hint b { color: #FFD700; font-weight: 800; }
  .wh-select {
    background: #0A1220; color: #E5EAF0; border: 1px solid #253654;
    border-radius: 8px; padding: 7px 32px 7px 12px; font-size: 12px; font-weight: 600;
    font-family: inherit; cursor: pointer; letter-spacing: 0.02em; min-width: 220px;
    appearance: none; -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M1 3l4 4 4-4' stroke='%23FFD86B' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat; background-position: right 11px center; background-size: 10px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .wh-select:hover { border-color: rgba(255,216,107,0.45); }
  .wh-select:focus { outline: none; border-color: #FFD86B; box-shadow: 0 0 0 3px rgba(255,216,107,0.15); }
  .wh-select option { background: #0A1220; color: #E5EAF0; }
  .wh-trend-ctrls { display: flex; gap: 22px; flex-wrap: wrap; align-items: center; }

  /* Segmented controls. Buttons flush inside a bordered box with hairline
     dividers made the two controls read as one strip of seven -- with the
     Period/Scope labels gone there was nothing marking where one ended. They
     are inset tracks now with the active choice raised as a pill inside, so
     each track is visibly its own switch and the dividers aren't needed. */
  .seg-ctl { display: inline-flex; gap: 2px; padding: 3px; border-radius: 11px;
    background: #0A1327; border: 1px solid #223350;
    box-shadow: inset 0 2px 5px rgba(0,0,0,.45); }
  .seg-ctl button { background: transparent; border: 0; cursor: pointer; font-family: inherit;
    font-size: 10.2px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase;
    color: #8FA3C0; padding: 6px 13px; border-radius: 8px; white-space: nowrap;
    transition: color .15s, background .15s, box-shadow .15s; }
  .seg-ctl button:hover { color: #E7EEF9; background: rgba(255,255,255,.055); }
  .seg-ctl button.on, #whScopeSeg button.on, #bpScopeSeg button.on {
    color: #FFD700;
    background: linear-gradient(180deg, #25365D 0%, #1A2743 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.10), 0 2px 6px rgba(0,0,0,.42),
                0 0 0 1px rgba(255,215,0,.22); }
  .seg-ctl button.on:hover { color: #FFE47A; }

  /* Scope drills down instead of listing 28 warehouses flat: pick Network or a
     cluster on the segment, and the cluster's own warehouses appear beneath. */
  .wh-sub-wrap { position: relative; display: flex; align-items: flex-start; gap: 12px;
    margin: 11px 0 14px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.06); }
  /* ONE LINE, never a scroller and never a second row (Abhay, 21 Jul). Scrolling
     hid warehouses off the right edge behind a fade, and wrapping cost a whole
     row for the one name that didn't fit. fitChipRow() steps the type and
     padding down until the row measures inside its box, so every warehouse in
     the cluster is visible at once at whatever width the pane happens to be. */
  .wh-sub { display: flex; flex-wrap: nowrap; gap: var(--chipgap, 6px); flex: 1 1 auto;
    min-width: 0; overflow: hidden; }
  .wh-sub.wrapped { flex-wrap: wrap; overflow: visible; }
  .wh-sub button { flex: 0 0 auto; cursor: pointer; font-family: inherit;
    font-size: var(--chipfs, 10.6px); font-weight: 800; letter-spacing: .06em;
    text-transform: uppercase;
    padding: 7.5px var(--chippx, 14px); border-radius: 9px; white-space: nowrap;
    color: #9FB0CC; border: 1px solid #26375A;

  /* Status tiers match the Months of Cover palette (Abhay 22 Jul):

  /* Drill-down is an OVERLAY card floating inside the panel (22 Jul 2026,
     Abhay: no scrolling system, and the page must not move). Clicking a row
     never inserts rows or resizes anything — the detail floats above the
     table with a dimmed veil behind it. */
  .grid-main > .panel:first-child { position: relative; }
  .wh-veil { position: fixed; inset: 0; z-index: 55; border-radius: 0;
    background: rgba(6,10,20,.55); opacity: 0; transition: opacity .18s ease; }

  /* Centered on the VIEWPORT (23 Jul 2026, Abhay): position:fixed puts the
     card in the middle of whatever is on screen — no scrolling to find it.
     Long SKU lists scroll INSIDE the card. */
  .wh-pop { position: fixed; z-index: 56; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: min(720px, calc(100vw - 48px));
    max-height: min(78vh, 660px); overflow-y: auto;
    background: linear-gradient(180deg,#111C31 0%,#0C1424 100%);
    border: 1px solid #2A3D5E; border-radius: 14px;
    box-shadow: 0 24px 64px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
    scrollbar-width: thin; scrollbar-color: #24365A transparent; }
  .wh-pop::-webkit-scrollbar { width: 7px; }

  /* Chart.js sizes a canvas from its container AT CONSTRUCTION and writes the
     result to inline width/height. If the container is still settling at that
     moment the canvas keeps the stale size and hangs over the panel edge --
     which is the right-hand clipping on a cold open. The resize pass at the
     bottom of the script re-measures; this clamp just stops an oversized canvas
     from spilling in the frames before it lands. */
  .chart-wrap { position: relative; height: 380px; overflow: hidden; }
  .chart-wrap > canvas, .trendwrap > canvas { max-width: 100% !important; }
  .chart-wrap.tall { height: 720px; }

     the cursor is on a bar (the Total Liquidation pattern: nothing floats over
     the data, the header carries the reading). */

     legend, and letting it wrap grew the panel for a moment, refired the row

  .whs-rd { display: flex; align-items: center; gap: 13px; min-height: 20px;

    padding-right: 13px; border-right: 1px solid rgba(255,255,255,.14); white-space: nowrap; }
  .whs-rd .rd-h u { text-decoration: none; color: #FFD86B; font-weight: 800; margin: 0 5px; }

  .rdrow { display: flex; align-items: center; gap: 15px; flex-wrap: wrap;

  .si-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 20px; align-items: start; margin-top: 6px; }

    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* the liquidation MoM anatomy: last month = wide hollow ghost pill behind,

  .si-track { position: relative; height: 17px; }
  .si-ghost { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 8px; min-width: 2px;

<script>
let PAYLOAD = null;
const PALETTE = {
  gold: '#FFD700', cyan: '#60A5FA', amber: '#FFB74D',
  red: '#F09A93', green: '#81C784', text: '#E5EAF0',
  axis: '#7E90AD', grid: '#1F2C49'
};
const fmt = n => (n==null||isNaN(n)) ? '—' : Math.round(n).toLocaleString('en-IN');
const fmt1 = n => (n==null||isNaN(n)) ? '—' : (Math.round(n*10)/10).toFixed(1);
const pct = n => (n==null||isNaN(n)) ? '—' : (Math.round(n*10)/10).toFixed(1) + '%';
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// ---- THE dispRows()ATCH FEED ------------------------------------------------------
// Every sales figure on this page - the header tile, the cluster cards, the
// drill-down strip, the insights board - reads these rows and nothing else.
// They are the Secondary uploads themselves, one line per invoice, dated by
// the Inv/GTN date on the invoice, so they are the same cases the Secondary
// Sales reports total.
//
// What they replaced (23 Sep 2026): inbound_history.csv, whose dispatch column
// is a reconstruction bucketed by the gap between two Bevco snapshots. On the
// live install it had September at 17,312 cs against 6,227 cs of invoices -
// the same cases counted again at every snapshot - and the page had no way to
// know. A figure a director acts on has to come from a file somebody uploaded.
// PAYLOAD arrives from a fetch, so every one of these is a function: read at
// call time, never captured while the page is still empty.
function ddCur() { return (PAYLOAD && PAYLOAD.dailyDispatch && PAYLOAD.dailyDispatch.cur) || null; }
function ddPri() { return (PAYLOAD && PAYLOAD.dailyDispatch && PAYLOAD.dailyDispatch.pri) || null; }
// The last day of a month this app can answer for: the last day a file covers,
// not the last day something happened to move. A quiet 23rd that was uploaded
// is still part of the month to date, and ending the window on the 18th
// because the 19th to 23rd were nil would shorten the month and flatter the
// run rate that divides by it.
function ddLastDay(b) {
  if (!b) return 0;
  return Math.max(0, ...Object.keys(b.days || {}).map(Number), ...(b.covered || []));
}
function ddFirstDay(b) {
  if (!b) return 0;
  const all = Object.keys(b.days || {}).map(Number).concat(b.covered || []);
  return all.length ? Math.min.apply(null, all) : 0;
}
function ddPrefix(b) { return b ? (b.y + '-' + String(b.mi).padStart(2, '0')) : null; }
function ddPre()  { return ddPrefix(ddCur()); }
function ddLast() { return ddLastDay(ddCur()); }
// Flat rows, the shape the panels below iterate: { d, w, out }. Memoised on
// the payload object itself, so a re-render costs nothing and a reload cannot
// serve the previous payload's rows.
let _dispRows = null, _dispFor = null;
function dispRows() {
  if (_dispFor === PAYLOAD && _dispRows) return _dispRows;
  const out = [];
  [ddPri(), ddCur()].forEach(b => {
    if (!b) return;
    const pre = ddPrefix(b) + '-';
    Object.keys(b.byWh || {}).forEach(w => {
      const days = b.byWh[w];
      Object.keys(days).forEach(day => {
        out.push({ d: pre + String(day).padStart(2, '0'), w: w, out: days[day] });
      });
    });
  });
  out.sort((a, b) => a.d < b.d ? -1 : (a.d > b.d ? 1 : 0));
  _dispFor = PAYLOAD; _dispRows = out;
  return out;
}
function ord(n) {
  const s = ['th','st','nd','rd'];
  const v = n % 100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}
function fmtDateLabel(d) {
  const parts = d.split('-').map(Number);
  return ord(parts[2]) + ' ' + MONTHS[parts[1]-1];
}
// Local-safe ISO date (never use toISOString on local dates — IST offset shifts the day).
function isoOf(dt) {
  return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0')
    + '-' + String(dt.getDate()).padStart(2, '0');
}
// Short display names for the 8 KSD brands ("OLD PEARL NO.1 MATURED XXX RUM" -> "OLD PEARL").
function brandShort(b) {
  return String(b)
    .replace(/\s*NO\.?\s*1\b/gi, '')
    .replace(/\bLIFE TIME MATURED\b/gi, '')
    .replace(/\b(CLASSIC|RESERVED|MATURED)\b/gi, '')
    .replace(/\bXO BRANDY\b/gi, '')
    .replace(/\bXXX RUM\b/gi, '')
    .replace(/\b(BRANDY|RUM)\b/gi, '')
    .replace(/\s+/g, ' ').trim();
}
// Inline SVG sparkline — dependency-free, safe inside template strings.
function sparkSvg(vals, opts) {
  const o = Object.assign({ w: 96, h: 26, color: '#4FC3F7', area: false, cls: 'spark' }, opts || {});
  if (!vals || vals.length < 2) return '';
  const present = vals.filter(v => v != null && !isNaN(v));
  if (present.length < 2) return '';
  const min = Math.min.apply(null, present), max = Math.max.apply(null, present);
  const span = (max - min) || 1;
  const n = vals.length, pts = [];
  vals.forEach((v, i) => {
    if (v == null || isNaN(v)) return;
    const x = Math.round((1 + (i / (n - 1)) * (o.w - 2)) * 10) / 10;
    const y = Math.round(((o.h - 3) - ((v - min) / span) * (o.h - 6)) * 10) / 10;
    pts.push(x + ',' + y);
  });
  const line = pts.join(' ');
  const last = pts[pts.length - 1].split(',');
  const first = pts[0].split(',');
  const area = o.area
    ? '<polygon points="' + first[0] + ',' + (o.h - 1) + ' ' + line + ' ' + last[0] + ',' + (o.h - 1) + '" fill="' + o.color + '" opacity="0.13"/>'
    : '';
  return '<svg class="' + o.cls + '" width="' + o.w + '" height="' + o.h + '" viewBox="0 0 ' + o.w + ' ' + o.h + '"'
    + ' xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' + area
    + '<polyline points="' + line + '" fill="none" stroke="' + o.color + '" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>'
    + '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="2" fill="' + o.color + '"/></svg>';
}

// (Removed 17 Jun 2026) The pending-% tier helper statusFor() was dead code.
// The league table + stock-health buckets classify by months-of-cover
// (shortCoverTier / coverTier) — the canonical basis (Abhay, 17 Jun 2026).

// --- Stock vs Sales Demand --------------------------------------------------
// <1 mo: critical · 1–2 mo: healthy · 2–3 mo: watch · >3 mo: overstocked.
// Target cover for dispatch recommendations = 2 months (mid-band).
const TARGET_COVER_MO = 2;

function coverTier(physical, avg) {
  if (!avg || avg <= 0) {
    return physical > 0
      ? { tier: 'idle',      color: '#5E7191', label: 'No sales' }
      : { tier: 'idle',      color: '#5E7191', label: '—' };
  }
  const cover = physical / avg;
  if (cover < 1)   return { tier: 'critical',    color: '#F0837B', label: 'Critical · <1 mo' };
  if (cover <= 2)  return { tier: 'cover-ok',    color: '#4ADE80', label: 'Healthy · 1–2 mo' };
  if (cover <= 3)  return { tier: 'cover-watch', color: '#FFD86B', label: 'Watch · 2–3 mo' };
  return                  { tier: 'overstock',   color: '#A78BFA', label: 'Overstocked · >3 mo' };
}

function recommendSend(physical, avg) {
  // Cases to dispatch so the warehouse hits TARGET_COVER_MO of cover.
  if (!avg || avg <= 0) return 0;
  const target = TARGET_COVER_MO * avg;
  return Math.max(0, Math.ceil(target - physical));
}
function excessOver(physical, avg, overMo) {
  // Cases beyond `overMo` months of cover. Useful to size overstock.
  if (!avg || avg <= 0) return 0;
  return Math.max(0, Math.round(physical - overMo * avg));
}

function buildMerged(latestRows) {
  const sales = (PAYLOAD.sales && PAYLOAD.sales.byWarehouse) || {};
  return latestRows.map(r => {
    const s = sales[r.warehouse];
    const avg = s ? s.avg : 0;
    const cover = avg > 0 ? r.physical / avg : null;
    return {
      warehouse: r.warehouse,
      physical: r.physical,
      avg: avg,
      total3mo: s ? s.total : 0,
      months: s ? s.months : null,
      cover: cover,
      tier: coverTier(r.physical, avg),
      send: recommendSend(r.physical, avg),
      excess: excessOver(r.physical, avg, 3),
    };
  });
}

function renderSvs(latestRows) {
  const salesData = (PAYLOAD.sales && PAYLOAD.sales.byWarehouse) || {};
  const periodLabel = (PAYLOAD.sales && PAYLOAD.sales.periodLabel) || '3-mo avg';
  const monthsUsed = (PAYLOAD.sales && PAYLOAD.sales.monthsUsed) || [];
  const hintEl = document.getElementById('svsHint');
  if (hintEl) hintEl.textContent = 'demand basis: ' + periodLabel;

  const kpisEl = document.getElementById('svsKpis');
  const barsEl = document.getElementById('coverBars');
  if (!Object.keys(salesData).length) {
    if (kpisEl) kpisEl.innerHTML = '';
    if (barsEl) barsEl.innerHTML = '<div class="svs-empty" style="color:#7E90AD;font-size:12px;padding:8px">'
      + 'No secondary-sales data — drop the recent Secondary Sales workbooks in <code>Secondary sales/</code> and refresh.</div>';
    return;
  }

  // V2 cover palette: red critical / green healthy / amber watch / purple over.
  // Local to this section so the league table's cyan/gold tiers stay as they are.
  const TC = { critical: '#F0837B', 'cover-ok': '#4ADE80', 'cover-watch': '#FFD86B',
               overstock: '#A78BFA', idle: '#5E7191' };
  const TARGET_COVER = 2, COVER_CAP = 6;
  const f2 = n => (n == null || isNaN(n)) ? '—' : (Math.round(n * 100) / 100).toFixed(2);

  const merged = buildMerged(latestRows);
  const totalPhys = merged.reduce((a, b) => a + b.physical, 0);
  const totalAvg  = merged.reduce((a, b) => a + b.avg, 0);
  const netCover  = totalAvg > 0 ? totalPhys / totalAvg : null;
  const nWh       = merged.length;
  const nCritical = merged.filter(m => m.cover != null && m.cover < 1).length;
  const nOver     = merged.filter(m => m.cover != null && m.cover > 3).length;
  const overExcess = merged.filter(m => m.avg > 0 && m.cover != null && m.cover > 3)
                           .reduce((s, m) => s + (m.physical - 3 * m.avg), 0);
  const critPct = nWh ? (nCritical / nWh * 100) : 0;
  const overPct = nWh ? (nOver / nWh * 100) : 0;
  const covBarPct = netCover == null ? 0 : Math.min(netCover / 3 * 100, 100);

  // --- 4 KPI cards (the dashboard's own .kpi card) -------------------------
  const card = (cc, label, val, unit, basePct, restIsHatch, footL, footR, footCls) =>
    '<div class="kpi" style="--cc:' + cc + '">'
    + '<div class="label"><i></i>' + label + '</div>'
    + '<div class="value"><span class="n">' + val + '</span><span class="u">' + unit + '</span></div>'
    + '<div class="cbar"><i class="base" style="width:' + basePct.toFixed(1) + '%"></i>'
    + (basePct < 99.9 ? '<i class="' + (restIsHatch ? 'rest' : 'rest') + '" style="width:' + (100 - basePct).toFixed(1) + '%"></i>' : '')
    + '</div>'
    + '<div class="sub"><span>' + footL + '</span>'
    + (footR ? '<span class="dd ' + (footCls || 'flat') + '">' + footR + '</span>' : '') + '</div>'
    + '</div>';
  if (kpisEl) kpisEl.innerHTML =
      card('#60A5FA', 'Cover in Scope', (netCover == null ? '—' : f2(netCover)), 'mo', covBarPct, false,
           '<b>' + fmt(totalPhys) + '</b> cs &divide; <b>' + fmt(totalAvg) + '</b> cs/mo', periodLabel, 'flat')
    + card('#F0837B', 'Critical Cover', nCritical, 'WH', critPct, false,
           'below 1 month of cover', '<b>' + Math.round(critPct) + '%</b> of scope', 'neg')
    + card('#A78BFA', 'Overstocked', nOver, 'WH', overPct, false,
           'above 3 months of cover', '<b>' + fmt(overExcess) + '</b> cs excess', 'flat')
    + card('#FFD86B', 'Monthly Demand', fmt(totalAvg), 'cs/mo', 100, false,
           // What the invoices ACTUALLY say for the window, never the rate
           // multiplied back out: "8,416 cs across 1 months" was a scaled
           // figure wearing the word "across", and the demand table three
           // inches below it printed the real 5,971 for the same month.
           (function () {
             const sal = PAYLOAD.sales || {};
             const real = Object.values(sal.byWarehouse || {})
               .reduce((a, w) => a + Object.values(w.months || {}).reduce((x, y) => x + y, 0), 0);
             const n = monthsUsed.length || 0;
             const mon = n === 1 ? '1 month' : n + ' months';
             return n ? '<b>' + fmt(Math.round(real)) + '</b> cs invoiced over ' + mon : '';
           })(),
           periodLabel, 'flat');

  // --- Cover by warehouse (horizontal bars, worst first) -------------------
  const x = v => Math.max(0, Math.min(v / COVER_CAP * 100, 100));
  const gl = [1, 3, 4, 5].map(v => '<div class="cvb-gl" style="left:' + x(v).toFixed(2) + '%"></div>').join('');
  const rated = merged.filter(m => m.cover != null).sort((a, b) => a.cover - b.cover);
  const idle  = merged.filter(m => m.cover == null);
  if (barsEl) barsEl.innerHTML = rated.map(m => {
      const c = TC[m.tier.tier] || '#5E7191';
      const w = x(Math.min(m.cover, COVER_CAP));
      return '<div class="cvb-r" title="' + m.warehouse + ' · ' + f2(m.cover) + ' mo · ' + m.tier.label
        + ' · ' + fmt(m.physical) + ' cs on hand · ' + fmt(m.avg) + ' cs/mo">'
        + '<span class="cvb-nm">' + m.warehouse + '</span>'
        + '<div class="cvb-track">' + gl + '<div class="cvb-tl" style="left:' + x(TARGET_COVER).toFixed(2) + '%"></div>'
        + '<div class="cvb-fill" style="width:' + w.toFixed(2) + '%;background:linear-gradient(90deg,' + c + '99,' + c + ');box-shadow:0 0 10px ' + c + '55">'
        + (m.cover > COVER_CAP ? '<span class="cvb-clip">' + fmt1(m.cover) + ' &rsaquo;&rsaquo;</span>' : '') + '</div></div>'
        + '<span class="cvb-chip" style="color:' + c + '">' + f2(m.cover) + ' mo</span></div>';
    }).join('')
    + idle.map(m => '<div class="cvb-r" title="' + m.warehouse + ' · no sales in period">'
        + '<span class="cvb-nm" style="color:#5E7191">' + m.warehouse + '</span>'
        + '<div class="cvb-track">' + gl + '</div>'
        + '<span class="cvb-chip" style="color:#5E7191">no sales</span></div>').join('');

  // --- Monthly sales demand table (sorted by avg desc, TOTAL row) ----------
  const subEl = document.getElementById('salesSub');
  if (subEl) subEl.textContent = monthsUsed.length
    ? monthsUsed.map(m => m.slice(0, 1) + m.slice(1, 3).toLowerCase()).join(' · ') : '—';
  const headEl = document.getElementById('salesHead');
  if (headEl) headEl.innerHTML = '<th>Warehouse</th>'
    + monthsUsed.map(m => '<th>' + m.slice(0, 1) + m.slice(1, 3).toLowerCase() + '</th>').join('')
    + '<th>Avg / mo</th>';
  const sr = merged.filter(m => m.avg > 0).sort((a, b) => b.avg - a.avg);
  const tot = monthsUsed.map(m => sr.reduce((s, r) => s + ((r.months && r.months[m]) || 0), 0));
  const bodyEl = document.getElementById('salesBody');
  if (bodyEl) bodyEl.innerHTML = sr.map(r =>
      '<tr><td class="nm">' + r.warehouse + '</td>'
      + monthsUsed.map(m => '<td>' + fmt((r.months && r.months[m]) || 0) + '</td>').join('')
      + '<td class="avg">' + fmt(r.avg) + '</td></tr>').join('')
    + '<tr class="totrow"><td class="nm">TOTAL</td>'
    + tot.map(t => '<td>' + fmt(t) + '</td>').join('')
    + '<td class="avg">' + fmt(sr.reduce((s, r) => s + r.avg, 0)) + '</td></tr>';
}

// The factory truck-load cross-check that used to sit here read
// PAYLOAD.factoryLoads, which is the Load Dispatch Tracker on Abhay's own
// machine. This app has never had that file - the payload builder does not
// emit the key - so the check had been dark since the dashboard moved onto the
// server, and every tile it refereed silently fell through to inbound_history.
// It is removed with the Inbound tile (23 Sep 2026). If the truck log is ever
// uploaded here, it comes back as a feed of its own, not as a fallback.

function renderSalesInsights() {
  const board = document.getElementById('siBoard');
  if (!board) return;
  const inb = dispRows();
  if (!inb.length || !ddPre()) {
    board.innerHTML = '<div class="empty-note">No dispatch uploaded yet — add a Secondary Sales export on the Raw Data Upload page.</div>';
    return;
  }
  const curPre = ddPre();
  const dayCap = ddLast();
  const last = curPre + '-' + String(dayCap).padStart(2, '0');
  const priorPre = ddPri() ? ddPrefix(ddPri())
    : ((+curPre.slice(5, 7) === 1 ? +curPre.slice(0, 4) - 1 : +curPre.slice(0, 4))
       + '-' + String(+curPre.slice(5, 7) === 1 ? 12 : +curPre.slice(5, 7) - 1).padStart(2, '0'));
  const cur = {}, prv = {};
  inb.forEach(r => {
    const dd = parseInt(r.d.slice(8, 10), 10);
    if (dd > dayCap) return;
    if (r.d.startsWith(curPre)) cur[r.w] = (cur[r.w] || 0) + (r.out || 0);
    else if (r.d.startsWith(priorPre)) prv[r.w] = (prv[r.w] || 0) + (r.out || 0);
  });
  const names = Array.from(new Set(Object.keys(cur).concat(Object.keys(prv))));
  const rows = names.map(w => {
    const c = cur[w] || 0, p = prv[w] || 0;
    return { w: w, c: c, p: p, g: p > 0 ? (c / p - 1) * 100 : (c > 0 ? null : 0) };
  }).sort((a, b) => b.c - a.c);
  const maxC = Math.max(1, ...rows.map(r => Math.max(r.c, r.p)));
  // Both windows whole, or no comparison at all. Without this the board read
  // a prior month nobody had uploaded as a zero baseline and painted every
  // warehouse "new" on a full-width green waterfall - an absent file
  // presented as the best month on record.
  const _cc = ddCur(), _pp = ddPri();
  const _covUpTo = (b) => (b && b.covered) ? b.covered.filter(d => d <= dayCap).length : 0;
  const bothWhole = !!(_cc && _pp && _covUpTo(_cc) >= dayCap && _covUpTo(_pp) >= dayCap);
  const gTxtOf = (r) => {
    // Δ in CASES (22 Jul 2026, Abhay: "cases instead of %") — matches the
    // waterfall beside it; 'new' only when there was no prior month at all
    if (!bothWhole) return '';
    const d = r.c - r.p;
    if (r.g == null && !r.p) return 'new';
    return (d > 0 ? '\u25B2 +' : (d < 0 ? '\u25BC \u2212' : '\u25AC ')) + fmt(Math.abs(d));
  };
  const monN = new Date(last + 'T00:00:00').toLocaleString('en-US', { month: 'short' });
  const priN = new Date(priorPre + '-01T00:00:00').toLocaleString('en-US', { month: 'short' });
  const winLbl = monN + ' 1\u2013' + dayCap, priLbl = priN + ' 1\u2013' + dayCap;
  const duOf = (g) => '<span class="du ' + (g == null ? 'flat' : g > 2 ? 'pos' : g < -2 ? 'neg' : 'flat') + '">';
  const dcsOf = (c, p2) => {
    const d = c - p2;
    const cls = d > 0 ? 'pos' : (d < 0 ? 'neg' : 'flat');
    return '<span class="dcs ' + cls + '">' + (d >= 0 ? '+' : '\u2212') + fmt(Math.abs(d)) + '</span>';
  };
  const totC = rows.reduce((s, r) => s + r.c, 0);
  const totPr = rows.reduce((s, r) => s + r.p, 0);
  const gAll = (bothWhole && totPr > 0) ? (totC / totPr - 1) * 100 : null;
  board.innerHTML = '<div class="si-plot"><div class="si-gridlines">'
    + [25, 50, 75].map(v => '<div class="si-gl" style="left:' + v + '%"></div>').join('') + '</div>'
    + rows.map(r => {
      const cw = (r.c / maxC * 100), pw = (r.p / maxC * 100);
      return '<div class="si-r" title="' + r.w + ' \u00B7 ' + winLbl + ' ' + fmt(r.c) + ' cs'
        + (bothWhole ? ' \u00B7 ' + priLbl + ' ' + fmt(r.p) + ' cs' : '') + '">'
        + '<span class="si-nm">' + r.w + '</span>'
        + '<span class="si-track">'
        +   (bothWhole && r.p > 0 ? '<i class="si-ghost" style="width:' + Math.min(100, pw).toFixed(1) + '%"></i>' : '')
        +   '<i class="si-bar ' + (r.g != null && r.g > 2 ? 'up' : (r.g != null && r.g < -2 ? 'dn' : 'nu'))
        +   '" style="width:' + cw.toFixed(1) + '%"></i></span>'
        + '<span class="si-val">' + fmt(r.c) + '</span>'
        + '<span class="si-g ' + (r.c - r.p > 0 ? 'pos' : (r.c - r.p < 0 ? 'neg' : 'flat'))
        + '">' + gTxtOf(r) + '</span>'
        + '</div>';
    }).join('') + '</div>';
  const totEl = document.getElementById('siTotal');
  if (totEl) totEl.innerHTML = '<div class="si-total"><span>TOTAL<b>' + fmt(totC) + '</b></span>'
    + (!bothWhole
      ? '<span class="r"><span>' + priLbl + ' not fully uploaded \u2014 no comparison</span></span>'
      : '<span class="r"><span>' + priLbl + ' \u00B7 ' + fmt(totPr) + ' cs</span>'
    + '<span class="d2 ' + (totC - totPr >= 0 ? 'pos' : 'neg') + '">'
    +   (totC - totPr >= 0 ? '+' : '\u2212') + fmt(Math.abs(totC - totPr)) + ' cs</span>'
    + (gAll == null ? '' : '<span class="si-g ' + (gAll > 2 ? 'pos' : gAll < -2 ? 'neg' : 'flat') + '">'
        + (gAll >= 0 ? '\u25B2 +' : '\u25BC \u2212') + Math.abs(gAll).toFixed(0) + '%</span>')
    + '</span>')
    + '</div>';
  // Contribution waterfall — ported faithfully from the liquidation live
  // artifact (22 Jul 2026, Abhay): top-18 warehouses by |Δ| sorted best→worst,
  // the tail folded into "All other", signed labels painted just past each
  // bar end (never inside), brighter zero spine.
  const deltas = rows.map(r => ({ w: r.w, d: r.c - r.p }));
  const shownD = deltas.slice().sort((a, b) => Math.abs(b.d) - Math.abs(a.d)).slice(0, 18)
                 .sort((a, b) => b.d - a.d);
  const restD = deltas.filter(x => shownD.indexOf(x) < 0).reduce((a, x) => a + x.d, 0);
  const wfL = shownD.map(x => x.w).concat(Math.abs(restD) >= 0.5 ? ['All other'] : []);
  const wfD = shownD.map(x => x.d).concat(Math.abs(restD) >= 0.5 ? [restD] : []);
  const wfMin = Math.min.apply(null, wfD.concat([0]));
  const wfWrap = document.getElementById('siWfWrap');
  if (wfWrap && board.offsetHeight > 120) wfWrap.style.height = (board.offsetHeight - 24) + 'px';
  const wfLabels = { id: 'siWfLabels', afterDatasetsDraw(ch) {
    const ctx = ch.ctx, meta = ch.getDatasetMeta(0);
    ctx.save(); ctx.font = '800 10.5px -apple-system,sans-serif'; ctx.textBaseline = 'middle';
    meta.data.forEach((bar, i) => { const v = wfD[i]; if (v === undefined || !bar) return;
      if (v >= 0) { ctx.shadowColor = 'rgba(67,192,138,.45)'; ctx.shadowBlur = 7;
        ctx.fillStyle = '#7BD8AA'; ctx.textAlign = 'left'; ctx.fillText('+' + fmt(v), bar.x + 8, bar.y); }
      else { ctx.shadowColor = 'rgba(224,106,98,.45)'; ctx.shadowBlur = 7;
        ctx.fillStyle = '#F09A93'; ctx.textAlign = 'right'; ctx.fillText('−' + fmt(Math.abs(v)), bar.x - 8, bar.y); }
      ctx.shadowBlur = 0;
    });
    ctx.restore(); } };
  if (window.siWfChart) { try { window.siWfChart.destroy(); } catch (e) {} }
  const wfCv = document.getElementById('siWaterfall');
  // The waterfall is the same month-on-month claim as the board beside it: if
  // the app does not hold both windows whole there is nothing to attribute,
  // and eighteen bars of "+0" or "+everything" is not a finding.
  if (wfWrap && !bothWhole) {
    wfWrap.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;'
      + 'height:100%;min-height:120px;padding:14px;text-align:center;color:#7E90AE;'
      + 'font-size:11.5px;line-height:1.55">Month-on-month contribution needs both months '
      + 'uploaded in full.<br>' + priLbl + ' is not, so there is nothing to compare against.</div>';
    return;
  }
  if (wfCv) window.siWfChart = new Chart(wfCv, {
    type: 'bar',
    data: { labels: wfL, datasets: [{ data: wfD,
      // lit-tube gradient (23 Jul 2026): dark at the zero spine, bright at
      // the tip — the same lighting the leaderboard bars carry
      backgroundColor: (c) => {
        const v = wfD[c.dataIndex];
        const ch2 = c.chart, area = ch2.chartArea, xs = ch2.scales.x;
        if (v === undefined || !area || !xs) return (v == null || v >= 0) ? '#43C08A' : '#E06A62';
        const x0 = xs.getPixelForValue(0);
        const g = v >= 0 ? ch2.ctx.createLinearGradient(x0, 0, area.right, 0)
                         : ch2.ctx.createLinearGradient(x0, 0, area.left, 0);
        g.addColorStop(0, v >= 0 ? '#2FA96F' : '#C6403A');
        g.addColorStop(1, v >= 0 ? '#7BE3A5' : '#F5978F');
        return g;
      },
      hoverBackgroundColor: wfD.map(v => v >= 0 ? '#6FE3AE' : '#FF9C94'),
      borderWidth: 0, borderRadius: 7, maxBarThickness: 16 }]},
    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, animation: { duration: 650 },
      layout: { padding: { right: 48, left: 8 } },
      interaction: { mode: 'index', intersect: false, axis: 'y' },
      hover: { mode: 'index', intersect: false, axis: 'y' },
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
      scales: { x: { grid: { color: c => (c.tick && c.tick.value === 0) ? 'rgba(255,216,107,.42)' : 'rgba(255,255,255,.045)' },
          border: { display: false },
          // every bar is labelled, so the tick row only added rotated noise
          // and a dead −1,000 gutter; the zero spine stays as the anchor
          suggestedMin: wfMin < 0 ? Math.floor(wfMin * 1.18) : undefined,
          ticks: { display: false } },
        y: { grid: { display: false }, border: { display: false },
          ticks: { font: { size: 10.5, weight: '800' },
            color: c => (wfL[c.index] === 'All other') ? '#7E90AD' : '#C4D3EA' } } } },
    plugins: [wfLabels]
  });

  // Cross-highlight (23 Jul 2026): hovering a leaderboard row lights the
  // same warehouse's bar in the waterfall beside it.
  const wfIdx = {}; wfL.forEach((n, i) => { wfIdx[n] = i; });
  board.querySelectorAll('.si-r').forEach(el => {
    const nm = el.querySelector('.si-nm'); if (!nm) return;
    el.addEventListener('mouseenter', () => {
      const ch2 = window.siWfChart;
      if (!ch2 || !ch2.setActiveElements) return;
      const i = wfIdx[nm.textContent];
      ch2.setActiveElements(i == null ? [] : [{ datasetIndex: 0, index: i }]);
      ch2.update('none');
    });
    el.addEventListener('mouseleave', () => {
      const ch2 = window.siWfChart;
      if (!ch2 || !ch2.setActiveElements) return;
      ch2.setActiveElements([]); ch2.update('none');
    });
  });

}

function skuDetailHtml(wh) {
  const det = PAYLOAD.skuDetail;
  if (!det || !det.byWarehouse || !det.byWarehouse[wh] || !det.byWarehouse[wh].length) {
    return '<div class="wh-detail-empty">No brand/pack detail captured yet for this warehouse \u2014 it starts with the next warehouse stock upload.</div>';
  }
  const rows = det.byWarehouse[wh];
  const byBrand = new Map();
  rows.forEach(r => { if (!byBrand.has(r[0])) byBrand.set(r[0], []); byBrand.get(r[0]).push(r); });
  const brands = Array.from(byBrand.entries()).map(([b, rs]) => ({
    brand: b, rows: rs,
    phys: rs.reduce((a,x)=>a+x[2],0), allot: rs.reduce((a,x)=>a+x[3],0), pend: rs.reduce((a,x)=>a+x[4],0),
  })).sort((a,b)=>b.phys-a.phys);

  const tp = brands.reduce((a, b) => a + b.phys, 0);
  const ta = brands.reduce((a, b) => a + b.allot, 0);
  const tn = brands.reduce((a, b) => a + b.pend, 0);
  const zz = '<span class="zz">&middot;</span>';
  const num = (v, cls) => '<td class="num ' + (cls || '') + '">' + (v > 0.4 ? fmt(v) : zz) + '</td>';
  const pend = v => '<td class="num pd' + (v > 0.4 ? ' hot' : '') + '">' + (v > 0.4 ? fmt(v) : zz) + '</td>';
  const body = brands.map(b => {
    const hue = brandHue(brandShort(b.brand)) || '#60A5FA';
    const share = tp > 0 ? b.phys / tp * 100 : 0;
    const dead = b.phys < 0.5 && b.allot < 0.5 && b.pend < 0.5;
    const packRows = b.rows.slice().sort((x, y) => y[2] - x[2]).map(r =>
      '<tr class="pack-row' + ((dead || r[2] < 0.5) ? ' dead' : '') + '">'
      + '<td></td><td class="pk"><span class="pkchip">' + r[1] + '</span></td>'
      + num(r[2], 'phys') + num(r[3], 'allot') + pend(r[4]) + '</tr>').join('');
    return '<tr class="brand-total' + (dead ? ' dead' : '') + '" style="--bc:' + hue + '">'
      + '<td class="bt"><i class="bdt"></i>' + brandShort(b.brand)
      + '<span class="bshare"><i style="width:' + Math.min(100, share).toFixed(1) + '%"></i></span></td>'
      + '<td></td>'
      + num(b.phys, 'phys') + num(b.allot, 'allot') + pend(b.pend) + '</tr>' + packRows;
  }).join('');

  return '<div class="wh-detail-inner">'
    + '<div class="dt-hd">'
    +   '<div class="dt-t"><span class="dt-wh">' + wh + '</span>'
    +     (det.date ? '<span class="dt-as">' + fmtDateLabel(det.date) + '</span>' : '')
    +   '</div>'
    + '</div>'
    + '<table class="sku-tbl">'
    + '<thead><tr><th>Brand</th><th>Pack</th><th>Physical</th><th>Allotable</th><th>Pending</th></tr></thead>'
    + '<tbody>' + body + '</tbody>'
    + '<tfoot><tr><td>TOTAL</td><td></td><td class="num">' + fmt(tp) + '</td><td class="num">' + fmt(ta) + '</td><td class="num">' + fmt(tn) + '</td></tr></tfoot>'
    + '</table></div>';
}

function attachWhDrilldown() {
  // OVERLAY drill-down (22 Jul 2026): the detail floats above the table in a
  // card, so nothing is inserted, nothing grows, and the page never moves.
  const closePop = () => {
    document.querySelectorAll('.wh-pop, .wh-veil').forEach(n => n.remove());
    document.querySelectorAll('table.tbl tbody tr.wh-row.open').forEach(o => o.classList.remove('open'));
  };
  document.querySelectorAll('table.tbl tbody tr.wh-row').forEach(tr => {
    tr.addEventListener('click', () => {
      const wasOpen = tr.classList.contains('open');
      closePop();
      if (wasOpen) return;
      const veil = document.createElement('div');
      veil.className = 'wh-veil';
      veil.addEventListener('click', closePop);
      const pop = document.createElement('div');
      pop.className = 'wh-pop';
      pop.innerHTML = '<button class="wh-pop-x" aria-label="Close" title="Close">&times;</button>'
        + skuDetailHtml(tr.dataset.wh);
      // Viewport-centred modal (23 Jul 2026, Abhay: "could it come in the
      // middle?") — appended to <body> and position:fixed, so it lands in
      // the middle of the screen he is looking at, wherever the row was.
      document.body.appendChild(veil);
      document.body.appendChild(pop);
      // Horizontally aligned to the Stock by Warehouse panel (23 Jul 2026,
      // Abhay) — vertical stays viewport-centred. position:fixed means the
      // panel's client rect maps straight onto the modal's coordinates.
      const lp = document.querySelector('.grid-main > .panel:first-child');
      if (lp) {
        const r = lp.getBoundingClientRect();
        if (r.width > 200) {
          pop.style.left = Math.round(r.left + r.width / 2) + 'px';
          pop.style.width = Math.round(Math.min(r.width - 24, 780)) + 'px';
        }
      }
      const x = pop.querySelector('.wh-pop-x');
      if (x) x.addEventListener('click', (e) => { e.stopPropagation(); closePop(); });
      requestAnimationFrame(() => veil.classList.add('on'));
      tr.classList.add('open');
    });
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePop(); });
}

// Geographic clusters. Module scope so the trend renderer, the sales strip and
// the league-table chips all read one map — and `let`, not `const`, because
// the payload carries the server's own map and overwrites this one on load.
// This literal is only the fallback for a payload built before that key

  ALAPPUZHA: 1, ATTINGAL: 1, NEDUMANGAD: 1, KOLLAM: 1, KOTTARAKARA: 1,
  PATHANAMTHITTA: 1, KARUNAGAPPALLY: 1, BALARAMAPURAM: 1, MENAMKULAM: 1, THIRUVALLA: 1,
  // Cluster 2 — Central
  THRISSUR: 2, TRIPUNITHURA: 2, THODUPUZHA: 2, KOTTAYAM: 2, ALUVA: 2,
  PERUMBAVOOR: 2, KOTHAMANGALAM: 2, AYARKKUNNAM: 2, CHALAKUDY: 2, KADAVANTHRA: 2,
  // Cluster 3 — North
  KANNUR: 3, KOZHIKODE: 3, PALAKKAD: 3, PERINTHALMANNA: 3,
  MENONPARA: 3, BATTATHUR: 3, KALPETTA: 3, NADUVANNUR: 3,

const cluNumOf = k => { const m = /^__C(\d)__$/.exec(k || ''); return m ? +m[1] : 0; };

// (Cluster 1 carries KARUNAGAPPALLY and BALARAMAPURAM; Cluster 3 is short), and
// the pane width is whatever the window gives us, so a fixed type size can only
// be right for one combination. This measures and steps down until it fits.
const CHIP_STEPS = [[9.8, 12, 6], [9.2, 10, 5], [8.7, 9, 5], [8.2, 8, 4], [7.7, 7, 4]];
function fitChipRow(row) {
  if (!row || !row.children.length) return;
  row.classList.remove('wrapped');
  for (let i = 0; i < CHIP_STEPS.length; i++) {
    const st = CHIP_STEPS[i];
    row.style.setProperty('--chipfs', st[0] + 'px');
    row.style.setProperty('--chippx', st[1] + 'px');
    row.style.setProperty('--chipgap', st[2] + 'px');

function watchChipRow(row) {
  if (!row) return;

let whTrendChart = null;

  // bug (22 Jul 2026). Area-based gradients render identically every time.
  const areaFill = (stops) => (c) => {

    stops.forEach(s => g.addColorStop(s[0], s[1]));

  };
  const fillGrad = areaFill([[0, 'rgba(129,199,132,0.30)'],

  // Physical = Allotable + Pending, so filling BOTH turns the chart into two

  // Allotable sits inside Physical, so both fills stack over the same ground and

  const endpointPlugin = {

  whTrendChart = new Chart(canvas, {

    const salesLbl = ((PAYLOAD.sales && PAYLOAD.sales.periodLabel) || '')
                       .replace(/\s*avg$/i, '');

    const inb = dispRows();

    const inScopeRow = r => isAll ? true
      : (cluNum > 0 ? (WH_CLUSTER[r.w] || 0) === cluNum : r.w === selected);

    let avg = 0; const mvals = {}, mrate = {};

    // Three tiles, on the dashboard's own .kpi card so this strip, the header

    const dayNum  = lastDay;

    const barOf = (cur, prv) => {

        + '</div>';

    // HOLDS, marked with a dot, because that is the figure the average above is

    const moHtml = moKeys.length
      ? '<div class="mos">' + moKeys.map(m => {

          const tip = g.part
            ? cap + ' · ' + fmt(g.raw) + ' cs dispatched over the ' + g.c.days + ' of '
              + g.c.inMonth + ' days uploaded · ' + fmt(g.v)
              + ' cs at that pace over a whole month, which is what the average uses'
            : cap + ' · ' + fmt(g.v) + ' cs dispatched';
          return '<span class="' + (moMax > 0 && g.v === moMax ? 'hi' : '') + '" title="' + tip + '">'
            + '<em>' + m.slice(0, 3) + (g.part ? ' ·' : '') + '</em><b>' + fmt(g.v) + '</b>'
            + '<i><s style="width:' + w.toFixed(1) + '%"></s></i></span>';
        }).join('') + '</div>'
      : '';
    // the average hides direction, so the pill states it: first month to last
    let moPill = '', moFoot = '<div class="sub"><span>' + (salesLbl || '3-month average') + '</span></div>';
    if (moKeys.length >= 2) {
      const f0 = moShown(moKeys[0]).v, l0 = moShown(moKeys[moKeys.length - 1]).v;
      if (f0 > 0) {
        const g = (l0 / f0 - 1) * 100;
        const cls = g > 0.05 ? 'pos' : (g < -0.05 ? 'neg' : 'flat');
        moPill = '<span class="dpill ' + cls + '">' + (g >= 0 ? '▲ +' : '▼ −')
               + Math.abs(g).toFixed(0) + '%</span>';
        const cap = t => t.charAt(0) + t.slice(1).toLowerCase();
        const dCs = l0 - f0;
        // the months row above already shows the trajectory, so the footer just
        // carries the window and the net Apr→Jun move
        moFoot = '<div class="sub"><span>' + (salesLbl || '3-mo avg') + '</span>'
          + '<span class="dd ' + cls + '">' + (dCs >= 0 ? '+' : '−')
          + fmt(Math.abs(dCs)) + ' cs</span></div>';
      }
    }

    // Scope stock position + cover, so the strip leads with what the selected
    // cluster/warehouse is holding before its sales flow -- the two header KPIs
    // Abhay asked to bring in, recomputed for the scope rather than the network.
    const scopePhys = lastOf(physSeries);
    let scopePrev = null, scopePrevD = '';
    for (let i = physSeries.length - 2; i >= 0; i--) { if (physSeries[i] != null) { scopePrev = physSeries[i]; scopePrevD = labels[i] || ''; break; } }
    const scopeDemand = avg;                                  // scope 3-mo avg
    const scopeCover  = scopeDemand > 0 && scopePhys != null ? scopePhys / scopeDemand : null;
    const covPill = scopeCover == null ? { c: 'flat', t: '—' }
      : scopeCover < 1  ? { c: 'neg',  t: 'Critical' }
      : scopeCover <= 2 ? { c: 'pos',  t: 'Healthy' }
      : scopeCover <= 3 ? { c: 'flat', t: 'Watch' }
      :                   { c: 'gold', t: 'Overstocked' };
    const covBar = scopeCover == null ? 0 : Math.min(scopeCover / 4 * 100, 100);

    note.innerHTML =
        (function () {
          // pill = DoD % at one decimal (whole-% would read "−0%" on small
          // stock moves); the absolute case move lives in the footer right —
          // the uniform strip grammar: % in the pill, Δ cs in the footer
          const dd = (scopePrev != null) ? (scopePhys - scopePrev) : null;
          const pct = (scopePrev) ? (dd / scopePrev * 100) : null;
          const cls = dd == null ? 'flat' : (dd > 0 ? 'pos' : (dd < 0 ? 'neg' : 'flat'));
          const pill = pct == null ? ''
            : '<span class="dpill ' + cls + '">' + (dd > 0 ? '▲ +' : (dd < 0 ? '▼ −' : '▬ ')) + Math.abs(pct).toFixed(1) + '%</span>';
          return '<div class="kpi" style="--cc:#FFD86B">'
            + '<div class="label"><i></i>Physical Stock' + pill + '</div>'
            + '<div class="value"><span class="n">' + fmt(scopePhys || 0) + '</span><span class="u">cs</span></div>'
            + (scopePrev != null ? barOf(scopePhys, scopePrev)
                : '<div class="cbar"><i class="base" style="width:100%"></i></div>')
            + (scopePrev != null
                ? '<div class="sub"><span>' + (scopePrevD ? 'vs ' + scopePrevD : 'vs prior') + ' &middot; <b>' + fmt(scopePrev) + '</b> cs</span>'
                    + '<span class="dd ' + cls + '">' + (dd >= 0 ? '+' : '−') + fmt(Math.abs(dd)) + ' cs</span></div>'
                : '<div class="sub"><span>latest snapshot</span></div>')
            + '</div>';   // <-- close the Physical .kpi (was missing: nested the rest inside it)
        })()
      + '<div class="kpi" style="--cc:#60A5FA">'
      +   '<div class="label"><i></i>MTD Sales &middot; ' + (mtdPre ? mtdLbl : 'not uploaded')
      +     (mtdPre ? pillOf(mtd, prvW.out) : '') + '</div>'
      +   '<div class="value"><span class="n">' + (mtdPre ? fmt(mtd) : '\u2014')
      +     '</span><span class="u">cs</span></div>'
      +   (mtdPre ? barOf(mtd, prvW.out) : '<div class="cbar"><i class="rest" style="width:100%"></i></div>')
      +   (mtdPre ? footOf(mtd, prvW.out, 'vs ' + priorMoLbl)
                  : '<div class="sub"><span>no Secondary Sales export for this month</span></div>')
      + '</div>'
      + '<div class="kpi" style="--cc:#FFD86B">'
      +   '<div class="label"><i></i>Avg Monthly Sales' + moPill + '</div>'
      +   '<div class="value"><span class="n">' + fmt(avg) + '</span><span class="u">cs/mo</span></div>'
      +   moHtml
      +   moFoot
      + '</div>'
      + '<div class="kpi" style="--cc:#4ADE80">'
      +   '<div class="label"><i></i>Months of Cover<span class="dpill ' + covPill.c + '">' + covPill.t + '</span></div>'
      +   '<div class="value"><span class="n">' + (scopeCover == null ? '—' : scopeCover.toFixed(2))
      +     '</span><span class="u">mo</span></div>'
      +   '<div class="cbar"><i class="base" style="width:' + covBar.toFixed(1) + '%"></i>'
      +     '<i class="rest" style="width:' + (100 - covBar).toFixed(1) + '%"></i></div>'
      +   '<div class="sub"><span>demand &middot; <b>' + fmt(Math.round(scopeDemand)) + '</b> cs/mo</span>'
      +     '<span class="dd flat">' + (scopeCover == null ? '—' : Math.round(scopeCover * MO_DAYS) + ' days') + '</span></div>'
      + '</div>';
  }
}

// --- Brand & Pack Mix (rebuilt 9 Jul 2026 PM — composition strip + twin tables
// + brand×pack heat matrix; the redundant Chart.js bars are gone) ---------------
const BRAND_COLORS = ['#4FC3F7','#FFD700','#81C784','#FFB74D','#B39DDB','#E57373','#4DB6AC','#90A4AE'];
// Per-brand identity hues — the SAME hue each brand carries on the Total
// Liquidation live artifact, so the two dashboards read as one family.
function brandHue(shortName) {
  const s = String(shortName || '').toUpperCase();
  if (s.includes('PEARL')) return '#FFD43B';
  if (s.includes('BLENDER')) return '#4FC3F7';
  if (s.includes('99')) return '#4ADE80';
  if (s.includes('FORT')) return '#FB923C';
  if (s.includes('WALKER') || s.includes('MORNING')) return '#F472B6';
  if (s.includes('MAGIC')) return '#2DD4BF';
  if (s.includes('CHAIRMAN')) return '#FB7185';
  if (s.includes('BRIHAN') || s.includes('BCB')) return '#A78BFA';
  return null;
}
function packMl(s) { const m = String(s).match(/(\d+)/); return m ? parseInt(m[1], 10) : 9999; }
function trendItems(rows) {
  // rows [date, key, phys, allot, pend] -> per-key latest + 7-day Δ + series
  const byKey = new Map();
  rows.forEach(r => {
    if (!byKey.has(r[1])) byKey.set(r[1], new Map());
    byKey.get(r[1]).set(r[0], [r[2], r[3], r[4]]);
  });
  const dates = Array.from(new Set(rows.map(r => r[0]))).sort();
  if (!byKey.size || !dates.length) return null;
  const latestD = dates[dates.length - 1];
  const tgt = new Date(latestD + 'T00:00:00'); tgt.setDate(tgt.getDate() - 7);
  const refISO = isoOf(tgt);
  let refD = null; dates.forEach(d => { if (d <= refISO) refD = d; });
  const items = Array.from(byKey.entries()).map(([k, m]) => {
    const cur = m.get(latestD) || [0, 0, 0];
    const ref = refD && m.has(refD) ? m.get(refD) : null;
    return { key: k, p: cur[0], a: cur[1], n: cur[2],
             d7: ref ? cur[0] - ref[0] : null,
             series: dates.map(d => m.has(d) ? m.get(d)[0] : null) };
  });
  return { items, latestD, refD, nDates: dates.length };
}
function skuFallbackRows(idx, whSet) {
  // Build [date, key, p, a, n] rows from skuDetail when a trend payload is absent.
  const det = PAYLOAD.skuDetail;
  if (!det || !det.byWarehouse) return [];
  const tmp = {};
  Object.keys(det.byWarehouse).forEach(w => {
    if (whSet && !whSet.has(w)) return;
    det.byWarehouse[w].forEach(x => {
    const k = det.date + '|' + x[idx];
    if (!tmp[k]) tmp[k] = [det.date, x[idx], 0, 0, 0];
    tmp[k][2] += x[2]; tmp[k][3] += x[3]; tmp[k][4] += x[4];
    });
  });
  return Object.values(tmp);
}
function deltaHtml(d7) {
  if (d7 == null) return '<span class="delta-cell flat">—</span>';
  if (d7 === 0)   return '<span class="delta-cell flat">0</span>';
  const cls = d7 > 0 ? 'pos' : 'neg';
  return '<span class="delta-cell ' + cls + '">' + (d7 > 0 ? '▲ +' : '▼ ') + fmt(d7) + '</span>';
}
// ---- Mix scope (added 21 Jul 2026) ----------------------------------------
// The panel used to be network-only. It now takes the same Network / Cluster /
// warehouse drill-down as the Stock Trend above, so both panels answer "where"
// the same way. Scoping runs off PAYLOAD.mixByWh (per-warehouse per-day brand
// and pack rows, index-compressed); when that key is absent the control hides
// and the panel falls back to the old network-level trend arrays.
let mixScope = '__ALL__';

function mixWhSet(scope) {
  if (!scope || scope === '__ALL__') return null;          // null = whole network
  const c = cluNumOf(scope);
  if (c) return new Set(Object.keys(WH_CLUSTER).filter(w => WH_CLUSTER[w] === c));
  return new Set([scope]);
}
function mixScopeLabel(scope) {
  if (!scope || scope === '__ALL__') return 'Network';
  const c = cluNumOf(scope);
  return c ? 'Cluster ' + c : scope;
}
function scopedMixRows(kind, whSet) {
  // -> [[date, key, phys, allot, pend], ...] in the shape trendItems() expects
  const M = PAYLOAD.mixByWh;
  if (!M || !M[kind] || !M[kind].length) return null;
  const names = kind === 'b' ? M.brand : M.pack;
  const keep  = whSet ? M.wh.map(w => whSet.has(w)) : null;
  const agg = new Map();
  M[kind].forEach(r => {
    if (keep && !keep[r[1]]) return;
    const k = r[0] + '|' + r[2];
    let v = agg.get(k);
    if (!v) { v = [M.date[r[0]], names[r[2]], 0, 0, 0]; agg.set(k, v); }
    v[2] += r[3]; v[3] += r[4]; v[4] += r[5];
  });
  return Array.from(agg.values());
}
function buildMixScopeControls() {
  const seg = document.getElementById('bpScopeSeg');
  const sub = document.getElementById('bpChips');
  const wrap = document.getElementById('bpChipsWrap');
  if (!seg || !sub) return;
  const M = PAYLOAD.mixByWh;
  if (!M || !M.wh || !M.wh.length) { seg.hidden = true; return; }   // network-only payload
  if (seg.dataset.built) return;                                     // panel re-renders on
  seg.dataset.built = '1';                                           // each pick; wire once

  // Chips run biggest-stock-first, matching the league table's reading order.
  const physOf = {};
  const stock = PAYLOAD.stock || [];
  const lastD = stock.length ? stock[stock.length - 1].d : null;
  stock.forEach(r => { if (r.d === lastD) physOf[r.w] = r.p; });
  const inCluster = c => M.wh.filter(w => (WH_CLUSTER[w] || 0) === c)
                             .sort((a, b) => (physOf[b] || 0) - (physOf[a] || 0));

  seg.innerHTML = '<button type="button" data-v="__ALL__">Network</button>'
    + [1, 2, 3].filter(c => inCluster(c).length)
        .map(c => '<button type="button" data-v="__C' + c + '__">Cluster ' + c + '</button>').join('');

  function sync() {
    // a bare warehouse still lights its own cluster, so the drill-down keeps its place
    const c = mixScope === '__ALL__' ? 0 : (cluNumOf(mixScope) || WH_CLUSTER[mixScope] || 0);
    seg.querySelectorAll('button').forEach(b =>
      b.classList.toggle('on', b.dataset.v === (c ? '__C' + c + '__' : '__ALL__')));
    if (!c) { if (wrap) wrap.hidden = true; sub.innerHTML = ''; return; }
    if (wrap) wrap.hidden = false;
    sub.innerHTML = '<button type="button" class="all" data-v="__C' + c + '__">All Cluster ' + c + '</button>'
      + inCluster(c).map(w => '<button type="button" data-v="' + w + '">' + w + '</button>').join('');
    sub.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === mixScope));
    fitChipRow(sub);
  }
  watchChipRow(sub);
  const choose = v => {
    mixScope = v;
    try { localStorage.setItem('ksdwh.mixscope', v); } catch (e) {}
    sync();
    if (PHASE2) renderBrandPanel();
  };
  seg.addEventListener('click', e => { const b = e.target.closest('button'); if (b) choose(b.dataset.v); });
  sub.addEventListener('click', e => { const b = e.target.closest('button'); if (b) choose(b.dataset.v); });
  sync();
}
let brandPieChart = null;
function renderBrandPanel() {
  if (!document.getElementById('bpGrid')) return;

  const scopeNm = mixScopeLabel(mixScope);

  const bpWrap = document.getElementById('bpGrid');

      + '<td style="min-width:70px">' + pct(x.share) + '<div class="sbar"><i style="width:' + Math.min(100, x.share).toFixed(1) + '%;background:' + x.color + '"></i></div></td>'
      + '<td>' + deltaHtml(x.d7) + '</td>'
      + '<td class="sparkcell">' + sparkSvg(x.series, { w: 64, h: 16, color: x.color }) + '</td>'
      + '</tr>';
  }).join('');
  // Brand share pie (upgraded 9 Jul 2026 PM: on-slice % labels, rounded
  // separated slices, largest slice pulled out, names-only legend — the
  // numbers live on the slices, in the tooltip and in the table above).
  const pieRdo = document.getElementById('pieRdo');
  const paintPie = (it) => {
    if (!pieRdo) return;
    if (!it) {
      pieRdo.innerHTML = '<div class="pr-rest"><b>' + fmt(totP) + '</b><u>cs physical</u>'
        + '<span class="pr-tops">' + B.items.slice(0, 3).map(x =>
            '<em style="color:' + x.color + '"><i style="background:' + x.color + '"></i>'

    pieRdo.innerHTML = '<div class="pr-card" style="--c:' + it.color + '">'

      + '<div class="pr-share"><b>' + pct(it.share) + '</b><em>of ' + scopeNm + ' stock</em></div>'

        labels: B.items.map(x => x.short),

          data: B.items.map(x => x.p),
          // radial gradient per slice — darker toward the hole, full colour at

          backgroundColor: (c) => {
            const it = B.items[c.dataIndex]; if (!it) return '#4FC3F7';

              const n = parseInt(hex.slice(1), 16);

            g.addColorStop(0, shade(it.color, 0.74));

            const meta = chart.getDatasetMeta(0);

              ctx.shadowBlur = 22;

              ctx.restore();

        },
        { // share % printed on every slice big enough to hold it
          id: 'pie-slice-labels',
          afterDatasetsDraw(chart) {
            const meta = chart.getDatasetMeta(0);
            const ctx = chart.ctx;
            ctx.save();
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            meta.data.forEach((arc, i) => {
              const item = B.items[i];
              if (!item || item.share < 4) return;
              const pr = arc.getProps(['x', 'y', 'startAngle', 'endAngle', 'innerRadius', 'outerRadius'], true);
              const ang = (pr.startAngle + pr.endAngle) / 2;
              const r = (pr.innerRadius + pr.outerRadius) / 2;
              const x = pr.x + Math.cos(ang) * r;
              const y = pr.y + Math.sin(ang) * r;
              ctx.font = '900 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
              ctx.fillStyle = '#0B1220';

            ctx.restore();
          }
        }
      ]
    });
  }

  // BY PACK table
  const ptRows = scopedMixRows('p', whSet)
          || (PAYLOAD.packTrend && PAYLOAD.packTrend.length ? PAYLOAD.packTrend : skuFallbackRows(1, whSet));
  const P = trendItems(ptRows);
  const ptb = document.getElementById('packTableBody');
  if (P && ptb) {
    // Descending by physical stock (23 Jul 2026, Abhay — corrected from the

    // the heat matrix below keeps its ml-ordered columns independently.
    P.items.sort((x, y) => y.p - x.p);
    const totPk = P.items.reduce((s, x) => s + x.p, 0) || 1;
    ptb.innerHTML = P.items.map(x => {
      const share = x.p / totPk * 100;
      return '<tr>'
        + '<td>' + x.key + '</td>'
        + '<td>' + fmt(x.p) + '</td>'
        + '<td>' + fmt(x.a) + '</td>'
        + '<td>' + fmt(x.n) + '</td>'
        + '<td style="min-width:70px">' + pct(share) + '<div class="sbar"><i style="width:' + Math.min(100, share).toFixed(1) + '%;background:linear-gradient(90deg,#A67C2E,#F5E3B3)"></i></div></td>'
        + '<td>' + deltaHtml(x.d7) + '</td>'
