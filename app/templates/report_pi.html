{% extends "base.html" %}
{% block title %}Purchase Instruction{% endblock %}
{% block heading %}Purchase Instruction{% endblock %}

{% block head %}
<style>
  .controls { position:sticky; top:0; z-index:30; background:var(--bg);
              padding:2px 0 12px; margin:-4px 0 0; }
  .bar1 { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .bar1 .sp { margin-left:auto; display:flex; gap:8px; align-items:center; }
  .fbar { display:inline-flex; align-items:stretch; background:var(--card);
          border:1px solid var(--line); border-radius:12px; padding:3px;
          box-shadow:0 1px 2px rgba(16,24,40,.04); }
  .fitem { display:flex; flex-direction:column; justify-content:center; gap:1px;
           padding:7px 15px; border-radius:9px; }
  .fitem:hover { background:var(--hover); }
  .fi-k { font-size:9.5px; letter-spacing:.7px; text-transform:uppercase;
          color:var(--muted); font-weight:700; }
  .fdiv { width:1px; background:var(--line); margin:8px 0; }

  /* Search sits with the filters - it is one - and the two downloads stack
     beside it, so the strip stays one block however narrow the window is. */
  input[type=search].search { border:1px solid var(--line); background:var(--card);
      border-radius:10px; padding:9px 11px 9px 36px; font:inherit; font-size:13.5px;
      color:var(--ink); width:100%; box-sizing:border-box; }
  input[type=search].search:focus { outline:2px solid #C7D2FE; outline-offset:-1px;
      border-color:var(--blue); }
  .searchwrap { position:relative; flex:1 1 140px; max-width:262px; }
  .searchwrap .ic { position:absolute; left:13px; top:50%; transform:translateY(-50%);
                    color:var(--muted); font-size:15px; pointer-events:none; }
  .bar1 .sp { flex-direction:column; align-items:stretch; gap:7px; }
  .bar1 .sp > * { width:176px; }
  .bar1 .sp .act { width:100%; box-sizing:border-box; text-align:center; }
  .selw { position:relative; display:flex; align-items:center; }
  .selw select { appearance:none; -webkit-appearance:none; border:0; background:none;
                 font:inherit; font-size:13.5px; font-weight:650; color:var(--ink);
                 padding:0 18px 0 0; cursor:pointer; }
  .selw select:focus { outline:none; }
  .selw i { position:absolute; right:2px; font-style:normal; font-size:9px;
            color:var(--muted); pointer-events:none; }
  .seg { display:inline-flex; background:var(--row); border-radius:9px; padding:2px; gap:2px; }
  .seg button { border:0; background:none; font:inherit; font-size:12.5px; font-weight:650;
                color:var(--muted); padding:5px 11px; border-radius:7px; cursor:pointer; }
  .seg button.on { background:var(--card); color:var(--ink);
                   box-shadow:0 1px 2px rgba(16,24,40,.12); }

  .banner { background:#FEF2F2; border:1px solid #FECACA; color:#991B1B;
            border-radius:11px; padding:13px 15px; font-size:13.5px; margin-bottom:11px; }


  .tablewrap { background:var(--card); border:1px solid var(--line); border-radius:14px;
               overflow:auto; max-height:72vh; box-shadow:0 1px 2px rgba(16,24,40,.05); }
  /* Fixed layout, so a brand carrying six-figure L3MS does not end up three
     times the width of one carrying dashes. Every brand gets the same block. */
  table { border-collapse:separate; border-spacing:0; width:100%; font-size:13px;
          table-layout:fixed; }
  col.c-nm { width:248px; }
  thead th { position:sticky; background:var(--navy); color:var(--gold); text-align:center;
             vertical-align:middle; font-weight:700; font-size:9.5px; letter-spacing:.5px;
             text-transform:uppercase; line-height:1.28; padding:9px 8px;
             border-bottom:1px solid #22407F; border-right:1px solid rgba(255,255,255,.07); }
  thead tr:first-child th { top:0; z-index:3; }
  thead tr:nth-child(2) th { top:31px; z-index:3; }
  /* Only the first header row has a name cell - "Row Labels" spans both rows -
     so the second row's first cell is a measure. Pinning "th:first-child"
     stuck that measure to the left edge as well, which is the stray column
     that appeared beside the bond names when the grid was scrolled across. */
  thead tr:first-child th:first-child { text-align:left; left:0; z-index:4;
                                        padding-left:16px; }
  thead th.grp { border-right:1px solid rgba(255,255,255,.22); }

  /* Ruled both ways, the way Shop Sales Cumulative reads. */
  tbody td { height:38px; padding:0 9px; text-align:center; white-space:nowrap;
             font-variant-numeric:tabular-nums; color:var(--ink);
             border-bottom:1px solid var(--line);
             border-left:1px solid var(--line); }
  /* The name column is fixed while the rest scrolls beneath it, so it needs an
     edge to hide behind - without one, a half-scrolled column printed its
     digits sliced down the middle and read as a rendering fault. */
  /* 9003-KOLLENGODE(VANDITHAVALAM) is wider than any column would sensibly
     be, and with nothing to stop it the name ran straight over the L3MS
     figure beside it. Cut it to the column and let the full name live in the
     tooltip - a truncated name still reads; a name printed over a number
     makes both unreadable. */
  tbody td:first-child { text-align:left; position:sticky; left:0; z-index:2;
                         background:var(--card); font-weight:650; padding-left:16px;
                         border-left:0; border-right:1px solid var(--line);
                         overflow:hidden; text-overflow:ellipsis;
                         box-shadow:7px 0 9px -7px rgba(16,24,40,.30); }
  thead tr:first-child th:first-child { box-shadow:7px 0 9px -7px rgba(0,0,0,.45); }
  tbody td.mq { font-weight:700; }
  tbody td.edge { border-right:1px solid var(--line); }
  tbody tr.g:nth-of-type(even) td, tbody tr.g:nth-of-type(even) td:first-child {
      background:var(--row); }
  tbody tr.g:hover td, tbody tr.g:hover td:first-child { background:var(--hover); }
  tbody tr.cl td, tbody tr.cl td:first-child { background:var(--navy); color:var(--gold);
      font-weight:700; border-bottom:1px solid #22407F; }
  tbody tr.gt td, tbody tr.gt td:first-child { background:var(--gold); color:#1B2A4A;
      font-weight:800; height:46px; letter-spacing:.3px;
      border-left-color:rgba(27,42,74,.20); }
  tbody tr.cl td { border-left-color:#22407F; }

  td.nm .opener { display:inline-flex; align-items:center; gap:8px; cursor:pointer;
                  user-select:none; max-width:100%; min-width:0; }
  td.nm .opener .lbl { overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
                       min-width:0; }
  td.nm .opener .n { flex:none; }
  td.nm .chev { width:9px; font-size:9px; color:var(--muted); transition:transform .16s;
                flex:none; }
  tr.open td.nm .chev { transform:rotate(90deg); color:var(--blue); }
  tr.open td, tr.open td:first-child { background:#EEF3FD !important; }
  tbody tr.shop td, tbody tr.shop td:first-child { background:#F7F9FC; font-size:12.5px;
      height:28px; color:#3F4A5E; font-weight:500; border-bottom:1px solid #EEF1F6; }
  tbody tr.shop td:first-child { padding-left:40px; }
  /* The name clips inside its own box so the 'no instruction' chip after it
     is never the thing that gets cut off. */
  td .sn { display:inline-block; max-width:100%; overflow:hidden; text-overflow:ellipsis;
           white-space:nowrap; vertical-align:middle; }
  tbody tr.shop.blank td:first-child .sn { max-width:calc(100% - 104px); }
  tbody tr.shop:hover td, tbody tr.shop:hover td:first-child { background:#EDF1F8; }
  tbody tr.shop.blank td:first-child::after { content:'no instruction'; margin-left:9px;
      font-size:9.5px; letter-spacing:.5px; text-transform:uppercase; font-weight:700;
      color:#92400E; background:#FEF3C7; border-radius:20px; padding:2px 7px; }

  .nil { color:#9AA3B2; font-weight:500; }
  tr.cl .nil { color:rgba(255,255,255,.45); }
  tr.gt .nil { color:rgba(27,42,74,.45); }
  .d-up { color:var(--ok); font-weight:700; }
  .d-dn { color:var(--bad); font-weight:700; }
  .status { font-size:12.5px; color:var(--muted); margin:11px 2px; }
</style>
{% endblock %}

{% block content %}
<div class="controls">
  <div class="bar1">
    <div class="fbar">
      <label class="fitem">
        <span class="fi-k">Month</span>
        <div class="selw"><select id="fMonth" onchange="load()"></select><i>&#9662;</i></div>
      </label>
      <span class="fdiv"></span>
      <div class="fitem">
        <span class="fi-k">Group by</span>
        <div class="seg" id="segView">
          <button type="button" class="on" data-v="bond" onclick="setView('bond')">Bond</button>
          <button type="button" data-v="warehouse" onclick="setView('warehouse')">Warehouse</button>
        </div>
      </div>
      <span class="fdiv"></span>
      <div class="fitem">
        <span class="fi-k">Show</span>
        <div class="seg" id="segCols">
          <button type="button" data-m="mq" onclick="setMeasure('mq')">MQ</button>
          <button type="button" data-m="rq" onclick="setMeasure('rq')">RQ</button>
          <button type="button" data-m="rl" onclick="setMeasure('rl')">RL</button>
          <button type="button" data-m="l3ms" onclick="setMeasure('l3ms')">L3MS</button>
          <button type="button" class="on" data-m="all" onclick="setMeasure('all')">All</button>
        </div>
      </div>
      <span class="fdiv"></span>
      <label class="fitem">
        <span class="fi-k">Cluster</span>
        <div class="selw"><select id="fCluster" onchange="load()">
          <option value="0">All clusters</option>
          <option value="1">Cluster 1</option>
          <option value="2">Cluster 2</option>
          <option value="3">Cluster 3</option>
        </select><i>&#9662;</i></div>
      </label>
    </div>
    <div class="searchwrap">
      <span class="ic">&#8981;</span>
      <input id="q" class="search" type="search" placeholder="Search bond or shop"
             autocomplete="off" oninput="onSearch()">
    </div>
    <div class="sp">
      <a class="act xl" id="xl" href="#">Download Excel</a>
      <a class="act pdf" id="pdf" href="#">Download PDF</a>
    </div>
  </div>
</div>

<div id="msg"></div>
<div class="tablewrap"><table id="grid">
  <colgroup></colgroup>
  <thead><tr><th>Bond</th></tr></thead>
  <tbody><tr><td>Loading…</td></tr></tbody>
</table></div>
<div class="status" id="foot"></div>
{% endblock %}

{% block scripts %}
<script>
// Opens the way the workbook prints: all four measures for every brand.
let view = 'bond', measure = 'all', DATA = null;
const open = new Set();

// Search runs over what is already on the page - the month's figures are all
// here - so typing filters instantly instead of going back to the server.
const term = () => q.value.trim().toLowerCase();
const hits = (text) => String(text ?? '').toLowerCase().includes(term());
const shopsOf = (key) => (DATA && DATA.shops && DATA.shops[key]) || [];

function onSearch(){ if (DATA) render(DATA); }

const esc = t => String(t ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// A nil instruction prints as a dash, the way the workbook prints it - a
// column of zeros reads as data, a column of dashes reads as nothing asked for.
const num = n => (!n) ? '<span class="nil">&ndash;</span>'
                      : Number(n).toLocaleString('en-IN');

const MEASURES = {mq:'MQ', rq:'RQ', rl:'RL', l3ms:'L3MS'};
function shown(){ return measure === 'all' ? ['l3ms','rl','rq','mq'] : [measure]; }

function params(){
  const p = new URLSearchParams({view});
  if (fMonth.value) p.set('month', fMonth.value);
  p.set('prior', '-');           // no comparison: the page does not offer one
  if (+fCluster.value) p.set('cluster', fCluster.value);
  return p;
}
function setView(v){
  if (view === v) return;
  view = v; open.clear();
  segView.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  load();
}
function setMeasure(m){
  if (measure === m) return;
  measure = m;
  segCols.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  if (DATA) render(DATA);
}

async function load(){
  foot.textContent = 'Loading…';
  let d;
  try {
    const res = await fetch('/api/pi-variance?' + params().toString());
    d = await res.json();
  } catch (e) {
    msg.innerHTML = `<div class="banner">Could not reach the server.</div>`;
    foot.textContent = ''; return;
  }
  if (d.error){
    msg.innerHTML = `<div class="banner">${esc(d.error)}</div>`;
    grid.querySelector('thead').innerHTML = '<tr><th>Bond</th></tr>';
    grid.querySelector('tbody').innerHTML = '<tr><td>No data</td></tr>';
    foot.textContent = ''; return;
  }
  DATA = d;
  fillMonths(d);
  xl.href = '/reports/pi-variance/export.xlsx?' + params().toString();
  // One sheet per bond - or per warehouse - the way the office forwards them,
  // so the button says how many are coming and in what.
  const pp = params(); pp.delete('prior');
  pdf.href = '/reports/pi-variance/export.pdf?' + pp.toString();
  const n = (d.rows || []).filter(r => r.kind === 'group').length;
  const what = view === 'warehouse' ? 'warehouse' : 'bond';
  pdf.title = n > 1 ? `${n} PDFs - one per ${what} - in a zip`
                    : `One PDF for this ${what}`;
  render(d);
}

function fillMonths(d){
  const opts = (d.months || []).map(m =>
    `<option value="${m.key}"${m.key === d.month ? ' selected' : ''}>${esc(m.label)}</option>`).join('');
  if (fMonth.innerHTML !== opts) fMonth.innerHTML = opts;
}

function head(d){
  const ms = shown();
  const wide = ms.length > 1;
  // "Row Labels" and the full brand names are the workbook's own wording, and
  // the full name only fits when the brand owns four columns.
  const groupRow = `<th rowspan="2">Row Labels</th>`
    + d.brands.map(b => wide
        ? `<th class="grp" colspan="${ms.length}">${esc(b.full)}</th>`
        : `<th class="grp" rowspan="2">${esc(b.short)}</th>`).join('')
    + (wide ? `<th class="grp" colspan="${ms.length}">Total</th>`
            : `<th class="grp" rowspan="2">Total</th>`)
    + (d.prior ? `<th rowspan="2">${esc(d.prior_label)}<br>MQ</th><th rowspan="2">Δ</th>` : '');
  const unitRow = wide
    ? d.brands.concat([{code:'__t'}]).map(() =>
        ms.map(m => `<th>${MEASURES[m]}</th>`).join('')).join('')
    : '';
  return `<tr>${groupRow}</tr>` + (wide ? `<tr>${unitRow}</tr>` : '');
}

function cells(cellSet, total){
  const ms = shown();
  let out = '';
  for (const b of DATA.brands){
    const c = cellSet[b.code] || {};
    out += ms.map((m, i) => {
      const cls = [m === 'mq' ? 'mq' : '', i === ms.length - 1 ? 'edge' : '']
                    .filter(Boolean).join(' ');
      return `<td${cls ? ` class="${cls}"` : ''}>${num(c[m] || 0)}</td>`;
    }).join('');
  }
  out += ms.map((m, i) => {
    const cls = [m === 'mq' ? 'mq' : '', i === ms.length - 1 ? 'edge' : '']
                  .filter(Boolean).join(' ');
    return `<td${cls ? ` class="${cls}"` : ''}>${num(total[m] || 0)}</td>`;
  }).join('');
  return out;
}

function delta(r){
  if (!DATA.prior) return '';
  const d = r.delta ?? 0;
  const cls = d > 0 ? 'd-up' : d < 0 ? 'd-dn' : '';
  return `<td>${num(r.prior_mq || 0)}</td>` +
         `<td class="${cls}">${d > 0 ? '+' : ''}${num(d)}</td>`;
}

function render(d){
  // The office reads its brands alphabetically by the full name; so does this.
  d.brands = d.brands.slice().sort((a, b) => a.full.localeCompare(b.full));
  // L3MS runs to seven digits in Indian grouping - 7,22,134 - so it gets a
  // wider column than the three case measures beside it. Every brand still
  // gets the same block, which is what keeps the grid readable across.
  const measures = shown();
  const W = {l3ms: 88, rl: 58, rq: 58, mq: 62};
  const widths = measures.length > 1
    ? measures.map(m => W[m]) : [measures[0] === 'l3ms' ? 118 : 104];
  const blockW = widths.reduce((a, b) => a + b, 0);
  const blocks = d.brands.length + 1;        // the brands, plus Total
  grid.querySelector('colgroup').innerHTML =
    `<col class="c-nm">`
    + widths.map(w => `<col style="width:${w}px">`).join('').repeat(blocks);
  grid.style.minWidth = (248 + blocks * blockW) + 'px';
  grid.querySelector('thead').innerHTML = head(d);
  const span = 1 + (d.brands.length + 1) * shown().length + (d.prior ? 2 : 0);

  // A search narrows the page to the bonds it matches. The cluster and grand
  // rows step out while it does: they total the whole book, and printed over
  // a filtered list they would be read as totals of it.
  const t = term();
  const groups = d.rows.filter(r => r.kind === 'group');
  const rows = !t ? d.rows : groups.filter(
    r => hits(r.label) || shopsOf(r.key).some(s => hits(s.name)));
  // A bond that only matched on one of its shops opens itself, or the hit
  // would be hidden inside a closed row.
  const showing = new Set(open);
  if (t) for (const r of rows) if (!hits(r.label)) showing.add(r.key);

  let html = '';
  for (const r of rows){
    if (r.kind === 'group'){
      const n = r.shops + (r.blank ? ` · ${r.blank} blank` : '');
      html += `<tr class="g" data-key="${esc(r.key)}">
          <td class="nm" title="${esc(r.label)}">
            <span class="opener" onclick="toggle('${esc(r.key)}')">
            <span class="chev">&#9654;</span><span class="lbl">${esc(r.label)}</span>
            <span class="n" style="color:var(--muted);font-weight:500;font-size:11.5px">${n}</span>
          </span></td>${cells(r.cells, r.total)}${delta(r)}</tr>`;
    } else {
      html += `<tr class="${r.kind === 'grand' ? 'gt' : 'cl'}">
          <td>${esc(r.label)}</td>${cells(r.cells, r.total)}${delta(r)}</tr>`;
    }
  }
  grid.querySelector('tbody').innerHTML = html;
  for (const k of showing) paint(k, span);

  // The grand total row says all of this. The line only speaks when a brand
  // code came back that the master data does not know - or when a search is
  // narrowing what is on screen, which the totals no longer describe.
  const notes = [];
  if (t) notes.push(rows.length
    ? `Showing ${rows.length} of ${groups.length} ${d.view === 'warehouse' ? 'warehouses' : 'bonds'} matching “${q.value.trim()}”.`
    : `Nothing matches “${q.value.trim()}”.`);
  if (d.unknown_codes.length)
    notes.push(`Unknown brand codes: ${d.unknown_codes.join(', ')}`);
  foot.textContent = notes.join('  ·  ');
}

function toggle(key){
  const span = 1 + (DATA.brands.length + 1) * shown().length + (DATA.prior ? 2 : 0);
  if (open.has(key)){
    open.delete(key);
    document.querySelectorAll(`tr.shop[data-of="${CSS.escape(key)}"]`).forEach(t => t.remove());
    const row = document.querySelector(`tr.g[data-key="${CSS.escape(key)}"]`);
    if (row) row.classList.remove('open');
    return;
  }
  open.add(key);
  paint(key, span);
}

function paint(key, span){
  const row = document.querySelector(`tr.g[data-key="${CSS.escape(key)}"]`);
  let shops = (DATA.shops || {})[key];
  if (!row || !shops) return;
  // Searching a shop name shows that shop, not the forty it sits with. A bond
  // matched by its own name keeps all of them.
  const label = row.querySelector('.lbl');
  if (term() && !hits(label ? label.textContent : ''))
    shops = shops.filter(s => hits(s.name));
  row.classList.add('open');
  const html = shops.map(s =>
    `<tr class="shop${s.blank ? ' blank' : ''}" data-of="${esc(key)}">
       <td title="${esc(s.name)}"><span class="sn">${esc(s.name)}</span></td>${cells(s.cells, s.total)}` +
    (DATA.prior ? `<td>${num(s.prior_mq || 0)}</td><td></td>` : '') + `</tr>`).join('');
  row.insertAdjacentHTML('afterend', html);
}

load();
</script>
{% endblock %}
