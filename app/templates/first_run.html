<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — KSD Reports</title>
<style>
  :root { --navy:#0D1B4A; --navy-mid:#1A237E; --gold:#FFB300; --ink:#111827; --line:#1f2f63; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;
         background:var(--navy); color:#e7ecf7; padding:24px; }
  .card { width:100%; max-width:380px; background:#0f2050; border:1px solid var(--line);
          border-radius:14px; padding:28px; }
  h1 { margin:0 0 4px; font-size:19px; letter-spacing:.5px; color:#fff; }
  .tag { margin:0 0 22px; font-size:11.5px; letter-spacing:1.4px; text-transform:uppercase;
         color:var(--gold); }
  label { display:block; font-size:12px; letter-spacing:.4px; text-transform:uppercase;
          color:#9fb0d8; margin:14px 0 6px; }
  input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
          background:#0a1740; color:#fff; font-size:15px; }
  input:focus { outline:2px solid var(--gold); outline-offset:1px; }
  button { width:100%; margin-top:20px; padding:11px; border:0; border-radius:8px;
           background:var(--gold); color:#20160a; font-weight:700; font-size:15px; cursor:pointer; }
  button:hover { filter:brightness(1.07); }
  .err { margin-top:16px; padding:10px 12px; border-radius:8px; font-size:13.5px;
         background:#3b1220; border:1px solid #7c2740; color:#ffc9d4; }
  .foot { margin-top:18px; font-size:12px; color:#7d90bd; }
</style>
</head>
<body>
  <form class="card" method="post" action="/first-run">
    <h1>K.S. Distillery</h1>
    <p class="tag">Report Transformer — first run</p>

    <p class="foot" style="margin:0 0 6px">
      No account exists on this install yet. Set the password for your company
      address once, and this page closes itself for good.
    </p>

    <label for="email">Company email</label>
    <input id="email" name="email" type="email" autocomplete="username" required autofocus
           {% if allowed|length == 1 %}value="{{ allowed[0] }}"{% endif %}>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="new-password"
           minlength="12" required>

    <label for="confirm">Password again</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password"
           minlength="12" required>

    <button type="submit">Set password</button>

    {% if error %}<div class="err">{{ error }}</div>{% endif %}

    <p class="foot">At least 12 characters. Only an address on this install's
      allowlist can be used.</p>
  </form>
</body>
</html>
